<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Companion • Workspace</title>
<style>
:root{--bg:#0f1115;--nav:#0b0d11;--surface:#16191f;--surface2:#1d222b;--line:rgba(255,255,255,.08);--text:#f7f8fb;--muted:#9fa6b2;--dim:#707887;--accent:#7d73f4;--accent2:#978fff;--ok:#38c992;--warn:#efb95f;--bad:#ff737d;--radius:16px;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}body{overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-columns:208px 1fr}.sidebar{background:var(--nav);border-right:1px solid var(--line);padding:18px 13px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 24px;font-weight:700}.mark{width:31px;height:31px;border-radius:11px;background:linear-gradient(145deg,#9b92ff,#5d52ce);position:relative}.mark:before,.mark:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;top:12px}.mark:before{left:8px}.mark:after{right:8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left}.nav button:hover{background:rgba(255,255,255,.04);color:#fff}.nav button.active{background:rgba(125,115,244,.15);color:#e8e4ff}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.link-btn{border:0;background:none;color:var(--muted);padding:3px}.main{overflow:auto}.top{position:sticky;top:0;z-index:20;height:62px;border-bottom:1px solid var(--line);background:rgba(15,17,21,.82);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.crumb{font-size:12px;color:var(--dim)}.crumb b{color:#fff}.device-pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 11px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}.dot.online{background:var(--ok)}
.content{max-width:1000px;margin:0 auto;padding:38px 34px 90px}h1{font-size:31px;line-height:1.08;letter-spacing:-.04em;margin:0 0 8px}h2{font-size:16px;margin:0}.lead{color:var(--muted);font-size:13px;line-height:1.55;max-width:650px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:26px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.hero{border-radius:24px;padding:25px;background:radial-gradient(circle at 35% 0,rgba(125,115,244,.17),transparent 34%),linear-gradient(145deg,#191d26,#12151b);border:1px solid rgba(125,115,244,.17)}.hero-row{display:flex;justify-content:space-between;gap:22px;align-items:center}.companion-id{display:flex;gap:15px;align-items:center}.face-icon{width:70px;height:54px;border-radius:20px;background:#242a35;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.eye{width:7px;height:13px;border-radius:8px;background:#e8e5ff}.hero-title{font-size:21px;font-weight:650;letter-spacing:-.03em}.meta{font-size:11.5px;color:var(--muted);margin-top:4px}.status{font-size:11px;border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.05);color:var(--muted)}.status.ok{background:rgba(56,201,146,.1);color:#99e5c5}.status.warn{background:rgba(239,185,95,.09);color:#e7c789}.status.bad{background:rgba(255,115,125,.09);color:#ffb1b7}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.quick{padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--surface);text-align:left}.quick:hover{background:var(--surface2)}.quick b{display:block;font-size:13px;margin-bottom:4px}.quick span{font-size:11px;color:var(--muted)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.row:first-child{border-top:1px solid var(--line)}.row-title{font-size:13.5px;font-weight:580}.row-sub{font-size:11.5px;color:var(--muted);margin-top:3px}.metric-label{font-size:11px;color:var(--dim)}.metric-value{font-size:23px;font-weight:650;letter-spacing:-.035em;margin-top:7px}.metric-sub{font-size:11px;color:var(--muted);margin-top:4px}.btn,.input,.select,.textarea{border:1px solid var(--line);background:var(--surface);border-radius:11px}.btn{padding:9px 12px;font-size:12px}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--accent);border-color:transparent;font-weight:650}.btn.primary:hover{background:var(--accent2)}.btn.danger{color:#ffb1b7}.btn:disabled{opacity:.44;cursor:not-allowed}.input,.select,.textarea{padding:10px 11px;outline:none}.textarea{resize:vertical;min-height:82px;width:100%}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted)}.form-row{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}.grow{flex:1;min-width:170px}.mono{font-family:var(--mono)}.muted{color:var(--muted)}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:9px}.tabs button.active{background:var(--surface2);color:#fff}.notice{padding:12px 13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:11.5px;line-height:1.5;background:rgba(255,255,255,.02)}.notice.warn{border-color:rgba(239,185,95,.16);background:rgba(239,185,95,.05);color:#d7bd8b}.table{width:100%;border-collapse:collapse;font-size:12.5px}.table th{text-align:left;color:var(--dim);font-weight:500;border-bottom:1px solid var(--line);padding:9px 8px}.table td{border-bottom:1px solid var(--line);padding:11px 8px;vertical-align:top}.right{text-align:right}.toggle{width:44px;height:24px;border:0;border-radius:999px;background:#343945;padding:3px}.toggle:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:white;transition:.18s}.toggle.on{background:var(--accent)}.toggle.on:after{transform:translateX(20px)}details{border-top:1px solid var(--line);padding-top:13px}summary{font-size:12px;color:#cbc6ff;cursor:pointer}.device-state{display:grid;grid-template-columns:1fr 1fr;gap:12px}.config-list{margin-top:8px}.config-line{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11.5px}.config-line span:first-child{color:var(--muted)}.empty{text-align:center;padding:42px 18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty b{display:block;color:#fff;margin-bottom:7px}.mobile-nav{display:none}
@media(max-width:820px){.app{grid-template-columns:72px 1fr}.brand span,.nav .label,.sidebar-foot{display:none}.brand{justify-content:center}.nav button{text-align:center}.content{padding:30px 22px 85px}.grid4{grid-template-columns:1fr 1fr}}@media(max-width:640px){body{overflow:auto}.app{display:block;height:auto;min-height:100vh}.sidebar{display:none}.main{overflow:visible;padding-bottom:70px}.top{height:58px;padding:0 15px}.crumb{display:none}.content{padding:25px 15px 90px}.head{align-items:flex-start;flex-direction:column}.hero-row{align-items:flex-start;flex-direction:column}.grid2,.grid3,.grid4,.device-state{grid-template-columns:1fr}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);left:8px;right:8px;bottom:8px;z-index:50;border:1px solid var(--line);background:rgba(22,25,31,.9);backdrop-filter:blur(18px);border-radius:16px;padding:6px}.mobile-nav button{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:9px;font-size:10.5px}.mobile-nav button.active{background:rgba(125,115,244,.16);color:#fff}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="mark"></div><span>AI Companion</span></div><nav class="nav"><button class="active" data-view="home">⌂ <span class="label">Home</span></button><button data-view="companion">◇ <span class="label">Companion</span></button><button data-view="personal">◫ <span class="label">Personal</span></button><button data-view="settings">⚙ <span class="label">Settings</span></button></nav><div class="sidebar-foot"><span>Owner</span><button class="link-btn" onclick="logout()">Sign out</button></div></aside><main class="main"><header class="top"><div class="crumb">Owner Hub / <b id="crumb">Home</b></div><div id="device-pill" class="device-pill"><span class="dot"></span><span>No Companion</span></div></header><div class="content" id="content"></div></main></div>
<nav class="mobile-nav"><button class="active" data-view="home">Home</button><button data-view="companion">Companion</button><button data-view="personal">Personal</button><button data-view="settings">Settings</button></nav>
<script>
const app={view:'home',personal:'money',deviceID:'',devices:[],device:null};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('vi-VN').format(Number(v||0))+' VND';const date=v=>v?new Date(v).toLocaleString():'—';
function cookie(name){const p=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(name+'='));return p?decodeURIComponent(p.slice(name.length+1)):''}
async function fetchJSON(url){const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error(`Request failed (${r.status})`);return r.json()}
async function mutate(url,method,body){const h={'X-CSRF-Token':cookie('__Host-companion_csrf'),'Accept':'application/json'};if(body!==undefined)h['Content-Type']='application/json';const r=await fetch(url,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});let data=null;try{data=await r.json()}catch(_){data={}}if(!r.ok)throw new Error(data?.error||`Request failed (${r.status})`);return data}
function stateText(s){return({applied:'Settings synced',requested:'Applying settings',offline:'Will apply when Companion reconnects',rejected:"Couldn't apply settings",stale:'Device report is stale',unknown:'Status unavailable'})[s]||'Status unavailable'}function statusClass(s){return s==='applied'?'ok':(s==='rejected'?'bad':(s==='requested'||s==='offline'||s==='stale'?'warn':''))}function wakeLabel(v){return v==='disabled'?'Push-to-talk only':v==='wn9_hiesp'?'Hi, ESP':v||'Not set'}
function setView(v){app.view=v;document.getElementById('crumb').textContent=v[0].toUpperCase()+v.slice(1);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
async function loadDevices(){try{const d=await fetchJSON('/v1/owner/data/devices');app.devices=d.devices||[];if(!app.deviceID&&app.devices.length)app.deviceID=app.devices[0].device_id}catch(_){app.devices=[]}await loadDevice()}async function loadDevice(){try{const q=app.deviceID?'?device_id='+encodeURIComponent(app.deviceID):'';app.device=await fetchJSON('/v1/owner/data/device'+q);if(app.device?.device_id)app.deviceID=app.device.device_id}catch(_){app.device=null}updateDevicePill()}function updateDevicePill(){const p=document.getElementById('device-pill');const d=app.device;if(!d?.has_device){p.innerHTML='<span class="dot"></span><span>No Companion</span>';return}p.innerHTML=`<span class="dot ${d.connection_status==='online'?'online':''}"></span><span>${esc(d.device_id)} · ${esc(d.connection_status)}</span>`}async function logout(){try{await mutate('/v1/owner/auth/logout','POST')}finally{location.reload()}}
function noDevice(){return `<div class="empty"><b>No Companion linked</b>Start setup on the Companion, then open the verification link it provides. Owner approval continues on the existing secure claim page.</div>`}function companionHero(d){if(!d?.has_device)return noDevice();const s=d.settings_status?.state||'unknown';return `<div class="hero"><div class="hero-row"><div class="companion-id"><div class="face-icon" aria-hidden="true"><span class="eye"></span><span class="eye"></span></div><div><div class="hero-title">${esc(d.device_id)}</div><div class="meta">${esc(d.connection_status)} · ${esc(stateText(s))}</div></div></div><span class="status ${statusClass(s)}">${esc(stateText(s))}</span></div></div>`}
async function render(){const c=document.getElementById('content');c.innerHTML='<div class="muted">Loading…</div>';try{if(app.view==='home')await renderHome(c);else if(app.view==='companion')await renderCompanion(c);else if(app.view==='personal')await renderPersonal(c);else await renderSettings(c)}catch(e){c.innerHTML=`<div class="notice warn">${esc(e.message)}</div>`}}
async function renderHome(c){const [o]=await Promise.all([fetchJSON('/v1/owner/data/overview'),loadDevice()]);const d=app.device;const budget=o.budget_set?money(o.monthly_budget):'Not set';c.innerHTML=`<div class="head"><div><h1>Home</h1><div class="lead">Your Companion and the personal items that need attention.</div></div></div>${companionHero(d)}<div class="section"><div class="grid4"><button class="quick" onclick="setView('companion')"><b>Companion</b><span>${d?.has_device?esc(stateText(d.settings_status?.state)):'Not linked'}</span></button><button class="quick" onclick="openPersonal('money')"><b>Money</b><span>${money(o.month_total)} this month</span></button><button class="quick" onclick="openPersonal('reminders')"><b>Reminders</b><span>${(o.reminders||[]).length} active</span></button><button class="quick" onclick="openPersonal('notes')"><b>Notes</b><span>${(o.notes||[]).length} recent</span></button></div></div><div class="section"><div class="grid3"><div class="card"><div class="metric-label">Monthly spending</div><div class="metric-value">${money(o.month_total)}</div></div><div class="card"><div class="metric-label">Monthly budget</div><div class="metric-value">${budget}</div></div><div class="card"><div class="metric-label">Savings target</div><div class="metric-value">${o.savings_progress?.goal?money(o.savings_progress.goal.target_vnd):'Not set'}</div></div></div></div>`}
function configLines(cfg){const rows=[['Wake',wakeLabel(cfg?.wake_model)],['Sensitivity',cfg?.wake_threshold??'Not set'],['Smart VAD',cfg?.smart_vad_enabled==null?'Not set':(cfg.smart_vad_enabled?'On':'Off')],['VAD threshold',cfg?.vad_threshold??'Not set'],['End silence',cfg?.vad_silence_ms==null?'Not set':cfg.vad_silence_ms+' ms'],['Min speech',cfg?.vad_min_speech_ms==null?'Not set':cfg.vad_min_speech_ms+' ms'],['OTA check',cfg?.ota_poll_interval_s==null?'Not set':Math.round(cfg.ota_poll_interval_s/3600)+' h']];return rows.map(r=>`<div class="config-line"><span>${esc(r[0])}</span><span class="mono">${esc(r[1])}</span></div>`).join('')}
async function renderCompanion(c){await loadDevice();const d=app.device;c.innerHTML=`<div class="head"><div><h1>Companion</h1><div class="lead">Device state and supported controls. Requested and applied settings stay separate until the Companion reports them.</div></div></div>${companionHero(d)}${!d?.has_device?'':`<div class="section"><div class="device-state"><div class="card"><h2>Requested</h2><div class="config-list">${configLines(d.desired)}</div></div><div class="card"><h2>Applied</h2><div class="config-list">${configLines(d.reported)}</div></div></div></div><div class="section"><div class="section-head"><h2>Wake & speech</h2><span class="status ${statusClass(d.settings_status?.state)}">${esc(stateText(d.settings_status?.state))}</span></div><div class="card">${settingsForm(d)}</div></div><div class="section"><div class="card"><div class="row"><div><div class="row-title">Software update checks</div><div class="row-sub">Background polling is a real desired device setting.</div></div><select id="ota-poll" class="select"><option value="">Not set</option>${[1,6,12,24].map(h=>`<option value="${h}h" ${d.desired?.ota_poll_interval_s===h*3600?'selected':''}>Every ${h} hour${h===1?'':'s'}</option>`).join('')}</select></div><div class="row"><div><div class="row-title">Install firmware update</div><div class="row-sub">No authoritative Owner Hub release trigger is wired yet.</div></div><button class="btn" disabled>Unavailable</button></div><button class="btn primary" style="margin-top:12px" onclick="saveOTA()">Save update interval</button></div></div><div class="section"><details><summary>Advanced device state</summary><div class="notice" style="margin-top:10px"><span class="mono">desired ${d.desired_version} · reported ${d.reported_version}</span><br>Updated ${esc(date(d.updated_at))}<br>Firmware: ${d.firmware_version==null?'not reported':esc(d.firmware_version)} · Wi-Fi RSSI: ${d.wifi_rssi_dbm==null?'not reported':esc(d.wifi_rssi_dbm)}</div></details></div>`}`}
function settingsForm(d){const x=d.desired||{};return `<div class="form-row"><div class="field grow"><label>Wake phrase</label><select id="wake-model" class="select"><option value="wn9_hiesp" ${x.wake_model!=='disabled'?'selected':''}>Hi, ESP</option><option value="disabled" ${x.wake_model==='disabled'?'selected':''}>Off — Push-to-talk only</option></select></div><div class="field grow"><label>Sensitivity (0.40–0.99)</label><input id="wake-threshold" class="input" type="number" min=".40" max=".99" step=".05" value="${esc(x.wake_threshold??0.60)}"></div><div class="field"><label>Smart VAD</label><button id="vad-toggle" class="toggle ${x.smart_vad_enabled===false?'':'on'}" aria-label="Toggle Smart VAD" data-on="${x.smart_vad_enabled===false?'false':'true'}" onclick="toggleVAD(this)"></button></div></div><details style="margin-top:15px"><summary>Advanced voice activity settings</summary><div class="form-row" style="margin-top:12px"><div class="field"><label>VAD threshold</label><input id="vad-threshold" class="input" type="number" min="1" max="65535" value="${esc(x.vad_threshold??450)}"></div><div class="field"><label>End silence (ms)</label><input id="vad-silence" class="input" type="number" min="100" max="5000" value="${esc(x.vad_silence_ms??800)}"></div><div class="field"><label>Min speech (ms)</label><input id="vad-min" class="input" type="number" min="50" max="5000" value="${esc(x.vad_min_speech_ms??250)}"></div></div></details><div style="margin-top:14px"><button class="btn primary" onclick="saveWake()">Apply settings</button> <span id="settings-result" class="meta"></span></div>`}
function toggleVAD(b){const on=b.dataset.on!=='true';b.dataset.on=String(on);b.classList.toggle('on',on)}async function saveWake(){const out=document.getElementById('settings-result');try{const body={device_id:app.deviceID,wake_model:document.getElementById('wake-model').value,wake_threshold:Number(document.getElementById('wake-threshold').value),smart_vad_enabled:document.getElementById('vad-toggle').dataset.on==='true',vad_threshold:Number(document.getElementById('vad-threshold').value),vad_silence_ms:Number(document.getElementById('vad-silence').value),vad_min_speech_ms:Number(document.getElementById('vad-min').value)};const d=await mutate('/v1/owner/data/device/config','POST',body);out.textContent=stateText(d.settings_status?.state);await loadDevice();setTimeout(render,250)}catch(e){out.textContent=e.message}}async function saveOTA(){const v=document.getElementById('ota-poll').value;if(!v)return;try{await mutate('/v1/owner/data/device/config','POST',{device_id:app.deviceID,ota_poll_interval:v});await loadDevice();render()}catch(e){alert(e.message)}}
function openPersonal(v){app.view='personal';app.personal=v;document.getElementById('crumb').textContent='Personal';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='personal'));render()}
async function renderPersonal(c){c.innerHTML=`<div class="head"><div><h1>Personal</h1><div class="lead">Each personal domain keeps its existing authoritative API and storage boundary.</div></div></div><div class="tabs">${[['money','Expenses & Budget'],['notes','Notes'],['journal','Journal'],['voice','Voice Memos'],['reminders','Reminders & Timers']].map(x=>`<button class="${app.personal===x[0]?'active':''}" onclick="app.personal='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div id="personal-body" class="section"></div>`;const b=document.getElementById('personal-body');if(app.personal==='money')await renderMoney(b);else if(app.personal==='notes')await renderNotes(b);else if(app.personal==='journal')await renderJournal(b);else if(app.personal==='voice')await renderVoice(b);else await renderReminders(b)}
async function renderMoney(b){const [o,e,s]=await Promise.all([fetchJSON('/v1/owner/data/overview'),fetchJSON('/v1/owner/data/expenses'),fetchJSON('/v1/owner/data/savings-goal?period=monthly')]);b.innerHTML=`<div class="grid3"><div class="card"><div class="metric-label">Spent this month</div><div class="metric-value">${money(o.month_total)}</div></div><div class="card"><div class="metric-label">Monthly budget</div><div class="metric-value">${o.budget_set?money(o.monthly_budget):'Not set'}</div></div><div class="card"><div class="metric-label">Savings target</div><div class="metric-value">${s.set?money(s.goal?.target_vnd):'Not set'}</div></div></div><div class="section grid2"><div class="card"><h2>Monthly budget</h2><div class="form-row" style="margin-top:12px"><input id="budget-value" class="input grow" type="number" min="0" placeholder="VND" value="${o.budget_set?esc(o.monthly_budget):''}"><button class="btn primary" onclick="saveBudget()">Save budget</button></div></div><div class="card"><h2>Savings goal</h2><div class="form-row" style="margin-top:12px"><input id="saving-value" class="input grow" type="number" min="1" placeholder="Target VND" value="${s.set?esc(s.goal?.target_vnd):''}"><input id="saving-desc" class="input grow" placeholder="Description" value="${s.set?esc(s.goal?.description||''):''}"><button class="btn primary" onclick="saveSavings()">Save</button>${s.set?'<button class="btn danger" onclick="deleteSavings()">Clear</button>':''}</div></div></div><div class="section"><div class="section-head"><h2>Recent expenses</h2><button class="btn primary" onclick="addExpense()">+ Add expense</button></div><table class="table"><thead><tr><th>Description</th><th>Category</th><th class="right">Amount</th><th></th></tr></thead><tbody>${(e.expenses||[]).map(x=>`<tr><td>${esc(x.description||'—')}</td><td>${esc(x.category||'—')}</td><td class="right">${money(x.amount_vnd)}</td><td class="right"><button class="btn danger" onclick="deleteExpense(${Number(x.id)})">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">No expenses.</td></tr>'}</tbody></table></div>`}
async function saveBudget(){const v=Number(document.getElementById('budget-value').value);if(!Number.isFinite(v)||v<0)return alert('Enter a valid budget');await mutate('/v1/owner/data/budget','POST',{period:'monthly',limit_vnd:Math.round(v)});render()}async function saveSavings(){const v=Number(document.getElementById('saving-value').value),d=document.getElementById('saving-desc').value;if(!v||v<=0)return alert('Enter a savings target');await mutate('/v1/owner/data/savings-goal','POST',{period:'monthly',target_vnd:Math.round(v),description:d});render()}async function deleteSavings(){if(confirm('Clear monthly savings goal?')){await mutate('/v1/owner/data/savings-goal?period=monthly','DELETE');render()}}async function addExpense(){const amount=Number(prompt('Amount in VND'));if(!amount||amount<=0)return;const category=prompt('Category','general')||'general';const description=prompt('Description','')||'';await mutate('/v1/owner/data/expenses','POST',{amount_vnd:Math.round(amount),category,description});render()}async function deleteExpense(id){if(confirm('Delete this expense?')){await mutate('/v1/owner/data/expenses?id='+encodeURIComponent(id),'DELETE');render()}}
async function renderNotes(b){const d=await fetchJSON('/v1/owner/data/notes');b.innerHTML=`<div class="card"><textarea id="note-new" class="textarea" placeholder="Capture a note…"></textarea><div style="margin-top:9px;text-align:right"><button class="btn primary" onclick="saveNote()">Save note</button></div></div><div class="section">${(d.notes||[]).map(n=>`<div class="row"><div><div class="row-title">${esc(n.content)}</div><div class="row-sub">${esc(date(n.created_at))}</div></div><button class="btn danger" onclick="deleteNote(${Number(n.id)})">Delete</button></div>`).join('')||'<div class="muted">No notes.</div>'}</div>`}async function saveNote(){const v=document.getElementById('note-new').value.trim();if(v){await mutate('/v1/owner/data/notes','POST',{content:v});render()}}async function deleteNote(id){if(confirm('Delete note?')){await mutate('/v1/owner/data/notes?id='+encodeURIComponent(id),'DELETE');render()}}
async function renderJournal(b){const d=await fetchJSON('/v1/owner/data/journal');b.innerHTML=`<div class="card"><textarea id="journal-new" class="textarea" placeholder="Write a journal entry…"></textarea><div style="margin-top:9px;text-align:right"><button class="btn primary" onclick="saveJournal()">Save entry</button></div></div><div class="section">${(d.journal||[]).map(n=>`<div class="row"><div><div class="row-title">${esc(n.content)}</div><div class="row-sub">${esc(date(n.occurred_at))}</div></div><button class="btn danger" onclick="deleteJournal(${Number(n.id)})">Delete</button></div>`).join('')||'<div class="muted">No journal entries.</div>'}</div>`}async function saveJournal(){const v=document.getElementById('journal-new').value.trim();if(v){await mutate('/v1/owner/data/journal','POST',{content:v});render()}}async function deleteJournal(id){if(confirm('Delete journal entry?')){await mutate('/v1/owner/data/journal?id='+encodeURIComponent(id),'DELETE');render()}}
async function renderVoice(b){const q=app.deviceID?'?device_id='+encodeURIComponent(app.deviceID):'';const d=await fetchJSON('/v1/owner/data/voice-memos'+q);b.innerHTML=`<div class="notice">Voice memo metadata and transcripts are available here. Browser playback is not presented until an authorized media contract exists.</div><div class="section">${(d.voice_memos||[]).map(v=>`<div class="row"><div><div class="row-title">${esc(v.transcript||'Voice memo')}</div><div class="row-sub">${esc(date(v.created_at))} · ${Number(v.duration_ms||0)/1000}s · ${esc(v.device_id||'device not reported')}</div></div><button class="btn danger" onclick="deleteVoice(${Number(v.id)})">Delete</button></div>`).join('')||'<div class="muted">No voice memos.</div>'}</div>`}async function deleteVoice(id){if(confirm('Delete voice memo?')){await mutate('/v1/owner/data/voice-memos?id='+encodeURIComponent(id),'DELETE');render()}}
async function renderReminders(b){const q=app.deviceID?'?device_id='+encodeURIComponent(app.deviceID):'';const d=await fetchJSON('/v1/owner/data/reminders'+q);b.innerHTML=`<div class="card"><div class="form-row"><input id="rem-title" class="input grow" placeholder="Reminder or timer title"><input id="rem-min" class="input" style="width:145px" type="number" min="0" placeholder="Timer minutes"><button class="btn primary" onclick="saveReminder()">Schedule</button></div></div><div class="section"><h2>Timers</h2>${(d.timers||[]).map(t=>`<div class="row"><div><div class="row-title">${esc(t.title)}</div><div class="row-sub">${esc(t.status)} · ${esc(date(t.fire_at))}</div></div><div>${t.status==='paused'?`<button class="btn" onclick="resumeTimer(${Number(t.id)})">Resume</button>`:`<button class="btn" onclick="pauseTimer(${Number(t.id)})">Pause</button>`}</div></div>`).join('')||'<div class="muted" style="margin-top:10px">No active timers.</div>'}</div><div class="section"><h2>Reminders</h2>${(d.reminders||[]).map(r=>`<div class="row"><div><div class="row-title">${esc(r.title)}</div><div class="row-sub">${esc(date(r.fire_at))}</div></div><button class="btn danger" onclick="deleteReminder(${Number(r.id)})">Delete</button></div>`).join('')||'<div class="muted" style="margin-top:10px">No active reminders.</div>'}</div>`}async function saveReminder(){const title=document.getElementById('rem-title').value.trim(),min=Number(document.getElementById('rem-min').value);if(!title)return;const body={title,device_id:app.deviceID};if(min>0)body.delay_seconds=Math.round(min*60);await mutate('/v1/owner/data/reminders','POST',body);render()}async function deleteReminder(id){if(confirm('Delete reminder?')){await mutate('/v1/owner/data/reminders?id='+encodeURIComponent(id),'DELETE');render()}}async function pauseTimer(id){await mutate('/v1/owner/data/timers/pause','POST',{id});render()}async function resumeTimer(id){await mutate('/v1/owner/data/timers/resume','POST',{id});render()}
async function renderSettings(c){const p=await fetchJSON('/v1/owner/data/privacy');const x=p.privacy||{};c.innerHTML=`<div class="head"><div><h1>Settings</h1><div class="lead">Owner privacy and retention controls backed by the current policy store.</div></div></div><div class="card"><div class="row"><div><div class="row-title">Save voice audio</div><div class="row-sub">Keep recorded voice audio when policy allows.</div></div><button id="privacy-audio" data-on="${x.save_voice_audio?'true':'false'}" class="toggle ${x.save_voice_audio?'on':''}" onclick="toggleVAD(this)"></button></div><div class="row"><div><div class="row-title">Long-term memory</div><div class="row-sub">Allow durable personal memory.</div></div><button id="privacy-memory" data-on="${x.long_term_memory_enabled?'true':'false'}" class="toggle ${x.long_term_memory_enabled?'on':''}" onclick="toggleVAD(this)"></button></div><div class="row"><div><div class="row-title">Voice-mail policy</div></div><select id="privacy-mail" class="select"><option ${x.voice_mail_policy==='disabled'?'selected':''}>disabled</option><option ${x.voice_mail_policy==='ephemeral'?'selected':''}>ephemeral</option><option ${x.voice_mail_policy==='retained'?'selected':''}>retained</option></select></div><div class="grid3" style="margin-top:14px"><div class="field"><label>Conversation retention (days)</label><input id="privacy-conv" class="input" type="number" min="0" max="3650" value="${esc(x.conversation_retention_days??30)}"></div><div class="field"><label>Voice memo retention (days)</label><input id="privacy-voice" class="input" type="number" min="0" max="3650" value="${esc(x.voice_memo_retention_days??30)}"></div><div class="field"><label>Memory retention (days)</label><input id="privacy-memdays" class="input" type="number" min="0" max="3650" value="${esc(x.memory_retention_days??90)}"></div></div><div style="margin-top:15px"><button class="btn primary" onclick="savePrivacy()">Save privacy settings</button></div></div>`}async function savePrivacy(){const body={save_voice_audio:document.getElementById('privacy-audio').dataset.on==='true',long_term_memory_enabled:document.getElementById('privacy-memory').dataset.on==='true',voice_mail_policy:document.getElementById('privacy-mail').value,conversation_retention_days:Number(document.getElementById('privacy-conv').value),voice_memo_retention_days:Number(document.getElementById('privacy-voice').value),memory_retention_days:Number(document.getElementById('privacy-memdays').value)};try{await mutate('/v1/owner/data/privacy','POST',body);render()}catch(e){alert(e.message)}}
loadDevices().then(render);
</script></body></html>
