<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Companion • Workspace</title>
<style>
:root {
  --bg-canvas: #191919;
  --bg-surface: #202020;
  --bg-hover: #2c2c2c;
  --border-subtle: #2f2f2f;
  --text-primary: #ffffff;
  --text-secondary: #999999;
  --text-muted: #666666;
  --accent-green: #10b981;
  --accent-blue: #38bdf8;
  --accent-amber: #f59e0b;
  --accent-indigo: #6366f1;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-canvas);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  overflow: hidden;
}
/* Notion Sidebar */
#sidebar {
  width: 260px;
  background: #151515;
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.2s ease;
}
.sidebar-header {
  padding: 1.2rem 1rem 0.8rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 600;
  font-size: 0.95rem;
  border-bottom: 1px solid var(--border-subtle);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); }
.nav-group { padding: 0.8rem 0.5rem; flex: 1; overflow-y: auto; }
.nav-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; padding: 0.4rem 0.5rem; letter-spacing: 0.05em; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0.6rem;
  border-radius: 6px;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.88rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover, .nav-item.active { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-footer { padding: 0.8rem 1rem; border-top: 1px solid var(--border-subtle); font-size: 0.8rem; color: var(--text-muted); }

/* Main Workspace Canvas */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-canvas);
  overflow-y: auto;
}
.topbar {
  padding: 0.9rem 1.8rem;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(25, 25, 25, 0.8);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.breadcrumbs { font-size: 0.85rem; color: var(--text-muted); }
.breadcrumbs span { color: var(--text-primary); font-weight: 500; }
.content-area { padding: 2rem 2.5rem; max-width: 1000px; width: 100%; margin: 0 auto; }
h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: -0.02em; }

/* Notion Cards & Blocks */
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
.block-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 1.3rem;
  transition: border-color 0.2s;
}
.block-card:hover { border-color: #404040; }
.block-title { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
.block-metric { font-size: 1.6rem; font-weight: 700; font-family: var(--font-mono); }
.progress-bar { height: 6px; background: #333; border-radius: 3px; margin: 0.8rem 0 0.4rem 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent-green); border-radius: 3px; width: 42.5%; }

/* Tables & Lists */
.data-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.88rem; }
.data-table th { text-align: left; padding: 0.6rem 0.8rem; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); font-weight: 500; }
.data-table td { padding: 0.75rem 0.8rem; border-bottom: 1px solid #252525; }
.data-table tr:hover td { background: var(--bg-surface); }
.amount { font-family: var(--font-mono); font-weight: 600; text-align: right; }
.tag { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; background: #2a2a2a; color: #bbb; }

/* Filter Controls */
.filter-bar { display: flex; gap: 0.6rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
.filter-input {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: #fff;
  padding: 0.45rem 0.8rem;
  border-radius: 6px;
  font-size: 0.85rem;
  outline: none;
}
.filter-input:focus { border-color: var(--accent-blue); }
.filter-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 0.45rem 0.8rem;
  border-radius: 6px;
  font-size: 0.82rem;
  cursor: pointer;
  transition: background 0.15s;
}
.filter-btn.active, .filter-btn:hover { background: var(--bg-hover); color: #fff; border-color: #444; }

/* Audio Waveform Scrubber */
.audio-card { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.8rem; background: #252525; border-radius: 6px; margin-bottom: 0.6rem; }
.audio-row { display: flex; align-items: center; gap: 0.8rem; }
.play-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-blue); color: #000; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.transcript { font-size: 0.85rem; color: #ccc; }
.time-badge { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <div class="status-dot"></div>
    <span>AI Companion</span>
  </div>
  <div class="nav-group">
    <div class="nav-title">Workspaces</div>
    <div class="nav-item active" onclick="navigate('overview')">📊 Overview</div>
    <div class="nav-item" onclick="navigate('expenses')">💰 Expenses & Budget</div>
    <div class="nav-item" onclick="navigate('voice')">🎙️ Voice Memos</div>
    <div class="nav-item" onclick="navigate('journal')">📖 Journal</div>
    <div class="nav-item" onclick="navigate('notes')">📝 Notes</div>
    <div class="nav-item" onclick="navigate('reminders')">⏰ Reminders & Timers</div>
    <div class="nav-title" style="margin-top:1rem">Hardware</div>
    <div class="nav-item" onclick="navigate('device')">📶 Device Twin & OTA</div>
  </div>
  <div class="sidebar-footer">
    <div>Signed in as <b id="user-display">owner</b></div>
  </div>
</aside>

<main id="main">
  <div class="topbar">
    <div class="breadcrumbs">Workspace / <span id="section-crumb">Overview</span></div>
    <div style="font-size:0.8rem;color:var(--text-muted);font-family:var(--font-mono)" id="live-clock">--:--:--</div>
  </div>

  <div class="content-area" id="content">
    <!-- Dynamic Workspace Canvas injected by JS -->
  </div>
</main>

<script>
let currentView = 'overview';
function updateClock() {
  const d = new Date();
  document.getElementById('live-clock').textContent = d.toLocaleTimeString() + ' (Local)';
}
setInterval(updateClock, 1000);
updateClock();

function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  event && event.currentTarget && event.currentTarget.classList.add('active');
  document.getElementById('section-crumb').textContent = view.charAt(0).toUpperCase() + view.slice(1);
  renderView();
}

async function fetchJSON(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('status ' + res.status);
    return await res.json();
  } catch (err) {
    console.error('Fetch error:', err);
    return null;
  }
}

async function renderView() {
  const container = document.getElementById('content');
  container.innerHTML = '<div style="color:var(--text-muted)">Loading workspace data...</div>';

  if (currentView === 'overview') {
    const data = await fetchJSON('/v1/owner/data/overview');
    if (!data) return;
    container.innerHTML = `
      <h1>Dashboard Overview</h1>
      <div class="card-grid">
        <div class="block-card">
          <div class="block-title">💰 Monthly Spending</div>
          <div class="block-metric">${(data.month_total || 0).toLocaleString()} <span style="font-size:0.9rem;font-weight:400;color:var(--text-muted)">VND</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, ((data.month_total || 0) / (data.monthly_budget || 10000000)) * 100)}%"></div></div>
          <div style="font-size:0.75rem;color:var(--text-muted)">Budget: ${(data.monthly_budget || 10000000).toLocaleString()} VND</div>
        </div>
        <div class="block-card">
          <div class="block-title">🎙️ Recent Voice Memos</div>
          <div class="block-metric">${(data.voice_memos || []).length} <span style="font-size:0.9rem;font-weight:400;color:var(--text-muted)">recorded</span></div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.6rem">Last audio captured today</div>
        </div>
        <div class="block-card">
          <div class="block-title">📝 Quick Notes</div>
          <div class="block-metric">${(data.notes || []).length} <span style="font-size:0.9rem;font-weight:400;color:var(--text-muted)">saved</span></div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.6rem">Synchronized across turns</div>
        </div>
      </div>
      <h2>Recent Activity</h2>
      <table class="data-table">
        <thead><tr><th>Description / Content</th><th>Type</th><th>Timestamp</th></tr></thead>
        <tbody>
          ${(data.expenses || []).map(e => `<tr><td>${e.description || e.category}</td><td><span class="tag">Expense</span></td><td class="amount">${(e.amount_vnd).toLocaleString()} VND</td></tr>`).join('')}
          ${(data.notes || []).map(n => `<tr><td>${n.content}</td><td><span class="tag">Note</span></td><td class="time-badge">${new Date(n.created_at).toLocaleDateString()}</td></tr>`).join('')}
        </tbody>
      </table>
    `;
  } else if (currentView === 'expenses') {
    const data = await fetchJSON('/v1/owner/data/expenses');
    container.innerHTML = `
      <h1>Expenses & Budget</h1>
      <div class="filter-bar">
        <button class="filter-btn active">This Month</button>
        <button class="filter-btn">This Week</button>
        <button class="filter-btn">Today</button>
        <input class="filter-input" placeholder="Filter category...">
      </div>
      <table class="data-table">
        <thead><tr><th>Occurred At</th><th>Category</th><th>Description</th><th style="text-align:right">Amount (VND)</th></tr></thead>
        <tbody>
          ${(data?.expenses || []).map(e => `
            <tr>
              <td class="time-badge">${new Date(e.occurred_at).toLocaleString()}</td>
              <td><span class="tag">${e.category}</span></td>
              <td>${e.description}</td>
              <td class="amount">${(e.amount_vnd).toLocaleString()}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } else if (currentView === 'voice') {
    const data = await fetchJSON('/v1/owner/data/voice-memos');
    container.innerHTML = `
      <h1>Voice Memos & Transcripts</h1>
      <div class="filter-bar">
        <input class="filter-input" placeholder="Search transcripts..." style="width:280px">
      </div>
      ${(data?.voice_memos || []).map(vm => `
        <div class="audio-card">
          <div class="audio-row">
            <button class="play-btn">▶</button>
            <div style="flex:1">
              <div class="transcript">"${vm.transcript || '(Audio recorded without transcript)'}"</div>
              <div class="time-badge">${new Date(vm.created_at).toLocaleString()} • ${(vm.duration_ms / 1000).toFixed(1)}s</div>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  } else if (currentView === 'notes') {
    const data = await fetchJSON('/v1/owner/data/notes');
    container.innerHTML = `
      <h1>Personal Notes</h1>
      <div class="filter-bar">
        <input class="filter-input" placeholder="Search notes..." style="width:280px">
      </div>
      <div class="card-grid">
        ${(data?.notes || []).map(n => `
          <div class="block-card">
            <div style="font-size:0.95rem;margin-bottom:0.8rem">${n.content}</div>
            <div class="time-badge">${new Date(n.created_at).toLocaleString()}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (currentView === 'device') {
    const data = await fetchJSON('/v1/owner/data/device');
    container.innerHTML = `
      <h1>Device Twin & Telemetry</h1>
      <div class="card-grid">
        <div class="block-card">
          <div class="block-title">📶 Hardware Connection</div>
          <div class="block-metric" style="color:var(--accent-green)">ONLINE</div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.4rem">Device: ${data?.device_id || 'companion-s3'}</div>
          <div style="font-size:0.8rem;color:var(--text-muted)">Wi-Fi RSSI: ${data?.wifi_rssi_dbm || -58} dBm</div>
        </div>
        <div class="block-card">
          <div class="block-title">🧠 Memory Budgets</div>
          <div class="block-metric">160.5 <span style="font-size:0.9rem;font-weight:400;color:var(--text-muted)">KiB SRAM</span></div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.4rem">PSRAM Codec: 128 KiB</div>
        </div>
        <div class="block-card">
          <div class="block-title">🔄 Dynamic OTA Polling</div>
          <div class="block-metric">6 <span style="font-size:0.9rem;font-weight:400;color:var(--text-muted)">hours</span></div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.4rem">Firmware: ${data?.firmware_version || 'v2.4.0'}</div>
        </div>
      </div>
    `;
  }
}
renderView();
</script>
</body>
</html>
