<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Companion • Workspace</title>
<style>
:root{--bg:#0f1115;--nav:#0b0d11;--surface:#16191f;--surface2:#13161b;--surface3:#1d222b;--line:rgba(255,255,255,.08);--text:#f7f8fb;--muted:#9fa6b2;--dim:#707887;--accent:#7d73f4;--accent2:#978fff;--ok:#38c992;--warn:#efb95f;--bad:#ff737d;--radius:16px;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}body{overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,input,select,textarea,summary{outline:none}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid rgba(151,143,255,.78);outline-offset:2px}
.app{height:100vh;display:grid;grid-template-columns:190px minmax(0,1fr)}.sidebar{background:var(--nav);border-right:1px solid var(--line);padding:20px 17px;display:flex;flex-direction:column}.brand{font-weight:650;font-size:16px;padding:0 3px 25px}.nav{display:grid;gap:6px}.nav button{min-height:44px;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;font-size:12px}.nav button:hover{background:rgba(255,255,255,.04);color:#fff}.nav button.active{background:#1a172e;color:#e8e3ff;font-weight:650}.sidebar-foot{margin-top:auto;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:space-between}.link-btn{min-height:44px;border:0;background:transparent;color:var(--muted);padding:8px}.main{overflow:auto}.top{position:sticky;top:0;z-index:20;height:62px;padding:0 30px;background:rgba(15,17,21,.9);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:flex-end;border-bottom:1px solid var(--line)}.device-pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 11px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}.dot.online{background:var(--ok)}
.content{max-width:990px;margin:0 auto;padding:31px 30px 100px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px}.head h1{font-size:29px;line-height:1.1;letter-spacing:-.035em;margin:0}.lead{color:var(--muted);font-size:11px;margin-top:8px}.live{font-size:10px;font-weight:650;color:var(--ok);background:rgba(56,201,146,.12);padding:5px 9px;border-radius:999px}.section{margin-top:28px}.section-title{font-size:15px;font-weight:650;margin:0 0 12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.summary-card{background:var(--surface2);border-radius:12px;padding:14px}.device-summary{padding:18px 17px;border:1px solid rgba(125,115,244,.18);border-radius:20px;background:var(--surface2)}.device-summary h2{font-size:17px;margin:0}.device-summary p{font-size:11px;color:var(--muted);margin:7px 0 0}.device-summary .state-line{font-size:12px;font-weight:650;margin-top:14px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.dim{color:var(--dim)}.mono{font-family:var(--mono)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{min-height:78px;text-align:left;padding:14px 13px;border:1px solid var(--line);background:var(--surface);border-radius:14px}.quick:hover{background:var(--surface3)}.quick b{font-size:13px}.quick span{display:block;color:var(--muted);font-size:10px;margin-top:10px}.summary-list{display:grid;gap:8px}.summary-link{min-height:64px;width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:0;background:var(--surface2);border-radius:12px;padding:12px 14px}.summary-link:hover{background:var(--surface)}.summary-link b{font-size:13px}.summary-link span{display:block;color:var(--muted);font-size:11px;margin-top:6px}.summary-link em{font-style:normal;color:var(--accent2);font-size:11px;font-weight:650;padding-left:20px}.truth-note{font-size:10px;color:var(--dim);margin-top:24px}
.state-card{padding:17px 15px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.state-card strong{font-size:16px}.state-card p{font-size:11px;color:var(--muted);margin:8px 0 0}.control-list{display:grid;gap:8px}.control-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,260px);gap:14px;align-items:center;min-height:64px;padding:10px 14px;background:var(--surface2);border-radius:12px}.row-title{font-size:13px;font-weight:560}.row-sub{font-size:11px;color:var(--muted);margin-top:5px}.row-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}.requested-applied{display:grid;grid-template-columns:1fr 1fr;gap:10px}.truth-box{background:var(--surface2);border-radius:12px;padding:13px}.truth-box b{font-size:11px}.truth-box div{font-size:10px;color:var(--muted);margin-top:8px}.advanced{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:13px}.advanced summary{min-height:32px;display:flex;align-items:center;cursor:pointer;color:var(--accent2);font-size:12px}.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv{background:var(--surface2);border-radius:10px;padding:10px}.kv span{display:block;color:var(--dim);font-size:10px}.kv b{display:block;font-size:11px;margin-top:5px;word-break:break-word}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs button{min-height:44px;border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px}.tabs button.active{background:var(--surface3);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar h2{font-size:15px;margin:0}.item-list{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface2);border-radius:12px;padding:12px 14px;min-height:64px}.item-title{font-size:13px;line-height:1.45;word-break:break-word}.item-sub{font-size:10.5px;color:var(--muted);margin-top:5px}.item-actions{display:flex;gap:7px;align-items:center}.empty{border:1px dashed var(--line);border-radius:14px;padding:30px 18px;text-align:center;color:var(--muted);font-size:11px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--surface2);border-radius:12px;padding:13px}.metric span{font-size:10px;color:var(--muted)}.metric strong{display:block;font-size:17px;margin-top:8px}.audio-row audio{width:min(360px,100%);height:34px;margin-top:8px}
.btn,.input,.select,.textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px}.btn{min-height:44px;padding:9px 12px;font-size:11px}.btn:hover{background:var(--surface3)}.btn.primary{background:var(--accent);border-color:transparent;font-weight:650}.btn.primary:hover{background:var(--accent2)}.btn.danger{background:#381417;border-color:rgba(255,115,125,.25);color:#ffb0b8}.btn.ghost{background:transparent}.btn:disabled{opacity:.48;cursor:not-allowed}.input,.select,.textarea{width:100%;min-height:44px;padding:10px 11px}.textarea{min-height:86px;resize:vertical}.compact{width:auto;min-width:86px}.field{display:grid;gap:6px}.field label{font-size:10px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings-form{display:grid;gap:12px}.check-row{display:flex;min-height:44px;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.check-row label{font-size:12px}.check-row input{width:22px;height:22px}.notice{padding:12px 13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:11px;line-height:1.5}.notice.error{border-color:rgba(255,115,125,.25);color:#ffb0b8;background:rgba(255,115,125,.06)}
.sheet{border:0;padding:0;margin:0 0 0 auto;width:min(620px,calc(100vw - 190px));max-width:100%;height:100vh;max-height:100vh;background:var(--surface);color:var(--text);box-shadow:-18px 0 50px rgba(0,0,0,.34)}.sheet::backdrop{background:rgba(4,6,10,.62)}.sheet-shell{min-height:100%;display:flex;flex-direction:column}.sheet-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.sheet-head h2{font-size:18px;margin:0}.sheet-head p{font-size:10px;color:var(--muted);margin:7px 0 0}.sheet-body{padding:18px 20px;display:grid;gap:14px;overflow:auto}.sheet-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.sheet-actions{display:flex;gap:8px}.sheet-status{font-size:10px;color:var(--muted);min-height:16px}.sheet-status.success{color:var(--ok)}.sheet-status.error{color:var(--bad)}.confirm{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);padding:20px;width:min(420px,calc(100vw - 28px))}.confirm::backdrop{background:rgba(4,6,10,.72)}.confirm h2{font-size:17px;margin:0}.confirm p{font-size:11px;color:var(--muted);line-height:1.5}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobile-nav{display:none}
@media(max-width:820px){.app{grid-template-columns:150px 1fr}.content{padding-left:22px;padding-right:22px}.sheet{width:calc(100vw - 150px)}}
@media(max-width:640px){body{overflow:auto}.app{display:block;height:auto;min-height:100vh}.sidebar{display:none}.main{overflow:visible;padding-bottom:72px}.top{height:54px;padding:0 14px}.content{padding:24px 14px 96px}.quick-grid,.split,.metrics,.requested-applied,.advanced-grid,.form-grid{grid-template-columns:1fr}.control-row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}.sheet{width:100vw;height:min(82vh,720px);max-height:82vh;margin:auto 0 0;border-radius:20px 20px 0 0}.sheet-shell{min-height:100%}.sheet-foot{align-items:flex-start;flex-direction:column}.sheet-actions{width:100%}.sheet-actions .btn{flex:1}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);left:8px;right:8px;bottom:8px;z-index:50;border:1px solid var(--line);background:rgba(22,25,31,.94);backdrop-filter:blur(16px);border-radius:16px;padding:6px}.mobile-nav button{min-height:44px;border:0;background:transparent;color:var(--muted);border-radius:9px;font-size:10px}.mobile-nav button.active{background:rgba(125,115,244,.16);color:#fff}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">AI Companion</div>
<nav class="nav" aria-label="Owner Hub"><button class="active" data-view="home">Home</button><button data-view="companion">Companion</button><button data-view="personal">Personal</button><button data-view="settings">Settings</button></nav>
<div class="sidebar-foot"><span>Owner</span><button class="link-btn" type="button" onclick="logout()">Sign out</button></div>
</aside>
<main class="main"><header class="top"><div id="device-pill" class="device-pill"><span class="dot"></span><span>No Companion</span></div></header><div class="content" id="content" aria-live="polite"></div></main>
</div>
<nav class="mobile-nav" aria-label="Owner Hub mobile"><button class="active" data-view="home">Home</button><button data-view="companion">Companion</button><button data-view="personal">Personal</button><button data-view="settings">Settings</button></nav>

<dialog id="edit-sheet" class="sheet" aria-labelledby="sheet-title">
<form id="sheet-form" class="sheet-shell" method="dialog">
<div class="sheet-head"><div><h2 id="sheet-title">Edit item</h2><p id="sheet-subtitle">Current authoritative values are loaded before editing.</p></div><button class="btn ghost" type="button" id="sheet-close" aria-label="Close edit panel">Close</button></div>
<div class="sheet-body" id="sheet-fields"></div>
<div class="sheet-foot"><button class="btn danger" id="sheet-delete" type="button">Delete</button><div><div id="sheet-status" class="sheet-status" role="status" aria-live="polite"></div><div class="sheet-actions"><button class="btn" type="button" id="sheet-cancel">Cancel</button><button class="btn primary" type="submit" id="sheet-save">Save</button></div></div></div>
</form>
</dialog>
<dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">Confirm change</h2><p id="confirm-text"></p><div class="confirm-actions"><button class="btn" type="button" id="confirm-cancel">Keep item</button><button class="btn danger" type="button" id="confirm-ok">Confirm</button></div></dialog>

<script>
const app={view:'home',personal:'money',deviceID:'',devices:[],device:null,sheet:null,lastFocus:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('vi-VN').format(Number(v||0))+' VND';
const date=v=>v?new Date(v).toLocaleString():'—';
const localValue=v=>{const d=v?new Date(v):new Date();if(Number.isNaN(d.getTime()))return'';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const isoValue=v=>{const d=new Date(v);if(Number.isNaN(d.getTime()))throw new Error('Enter a valid date and time.');return d.toISOString()};
function cookie(name){const p=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(name+'='));return p?decodeURIComponent(p.slice(name.length+1)):''}
async function fetchJSON(url){const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error(`Request failed (${r.status})`);return r.json()}
async function mutate(url,method,body){const h={'X-CSRF-Token':cookie('__Host-companion_csrf'),'Accept':'application/json'};if(body!==undefined)h['Content-Type']='application/json';const r=await fetch(url,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});const text=await r.text();let data={};if(text){try{data=JSON.parse(text)}catch(_){data={message:text.trim()}}}if(!r.ok)throw new Error(data.error||data.message||`Request failed (${r.status})`);return data}
function stateText(s){return({applied:'Settings synced',requested:'Applying settings',offline:'Will apply when Companion reconnects',rejected:"Couldn't apply settings",stale:'Device report is stale',unknown:'Status unavailable'})[s]||'Status unavailable'}
function stateClass(s){return s==='applied'?'ok':s==='rejected'?'bad':s==='unknown'?'muted':'warn'}
function wakeLabel(v){return v==='disabled'?'Push-to-talk only':v==='wn9_hiesp'?'Hi, ESP':v||'Not set'}
function setView(view){app.view=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
async function logout(){try{await mutate('/v1/owner/auth/logout','POST')}finally{location.reload()}}
async function loadDevices(){try{const data=await fetchJSON('/v1/owner/data/devices');app.devices=data.devices||[];if(!app.deviceID&&app.devices.length)app.deviceID=app.devices[0].device_id}catch(_){app.devices=[]}return loadDevice()}
async function loadDevice(){try{const q=app.deviceID?'?device_id='+encodeURIComponent(app.deviceID):'';app.device=await fetchJSON('/v1/owner/data/device'+q);if(app.device?.device_id)app.deviceID=app.device.device_id}catch(_){app.device=null}updateDevicePill();return app.device}
function updateDevicePill(){const p=document.getElementById('device-pill');const d=app.device;if(!d?.has_device){p.innerHTML='<span class="dot"></span><span>No Companion</span>';return}p.innerHTML=`<span class="dot ${d.connection_status==='online'?'online':''}"></span><span>${esc(d.connection_status)}</span>`}
function pageHead(title){return `<div class="head"><div><h1>${esc(title)}</h1><div class="lead">Current product surface</div></div><span class="live">LIVE</span></div>`}
function noDevice(){return `<div class="empty"><b>No Companion linked.</b><div>Complete the existing secure claim flow from the Companion.</div></div>`}
async function render(){const c=document.getElementById('content');c.innerHTML='<div class="muted">Loading…</div>';try{if(app.view==='home')await renderHome(c);else if(app.view==='companion')await renderCompanion(c);else if(app.view==='personal')await renderPersonal(c);else await renderSettings(c)}catch(e){c.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function renderHome(c){const [o]=await Promise.all([fetchJSON('/v1/owner/data/overview'),loadDevices()]);const d=app.device;const s=d?.settings_status?.state||'unknown';c.innerHTML=`${pageHead('Home')}<div class="device-summary"><h2>Companion</h2><p>Connection and settings state from authoritative Device Twin</p><div class="state-line ${stateClass(s)}">${d?.has_device?`${esc(d.connection_status)} · ${esc(stateText(s))}`:'No Companion linked'}</div></div><section class="section"><h2 class="section-title">Quick add</h2><div class="quick-grid"><button class="quick" type="button" data-create="expense"><b>+ Expense</b><span>Existing personal domain</span></button><button class="quick" type="button" data-create="note"><b>+ Note</b><span>Existing personal domain</span></button><button class="quick" type="button" data-create="reminder"><b>+ Reminder</b><span>Existing scheduler domain</span></button></div></section><section class="section"><h2 class="section-title">Summary</h2><div class="summary-list"><button class="summary-link" type="button" data-personal="money"><span><b>Money</b><span>${money(o.month_total)} this month · Monthly budget ${o.budget_set?money(o.monthly_budget):'Not set'}</span></span><em>Open</em></button><button class="summary-link" type="button" data-personal="notes"><span><b>Notes & journal</b><span>${(o.notes||[]).length} recent notes</span></span><em>Open</em></button><button class="summary-link" type="button" data-personal="reminders"><span><b>Reminders & timers</b><span>${(o.reminders||[]).length} active reminders</span></span><em>Open</em></button></div></section><div class="truth-note">No fake battery, RSSI, firmware version, activity feed, or chat state appears without an authoritative source.</div>`;c.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>openCreate(b.dataset.create,b));c.querySelectorAll('[data-personal]').forEach(b=>b.onclick=()=>openPersonal(b.dataset.personal))}
async function renderCompanion(c){const d=await loadDevice();c.innerHTML=pageHead('Companion')+(d?.has_device?companionMarkup(d):noDevice());bindCompanion(c,d)}
function companionMarkup(d){const s=d.settings_status?.state||'unknown';const desired=d.desired||{};const reported=d.reported||{};return `<div class="state-card"><strong class="${stateClass(s)}">${esc(stateText(s))}</strong><p>${s==='applied'?'Requested and applied state match.':'Requested state remains distinct from applied device state.'}</p></div><section class="section"><h2 class="section-title">Common controls</h2><div class="control-list"><div class="control-row"><div><div class="row-title">Wake</div><div class="row-sub">${esc(wakeLabel(reported.wake_model))}</div></div><div class="row-actions"><select id="wake-model" class="select compact"><option value="wn9_hiesp" ${desired.wake_model==='wn9_hiesp'?'selected':''}>Hi, ESP</option><option value="disabled" ${desired.wake_model==='disabled'?'selected':''}>Push-to-talk only</option></select><button class="btn" id="save-wake" type="button">Change</button></div></div><div class="control-row"><div><div class="row-title">Wake sensitivity</div><div class="row-sub">Supported threshold</div></div><div class="row-actions"><input id="wake-threshold" class="input compact" type="number" min="0" max="1" step="0.01" value="${esc(desired.wake_threshold??reported.wake_threshold??'')}"><button class="btn" id="save-wake-threshold" type="button">Change</button></div></div><div class="control-row"><div><div class="row-title">Smart VAD</div><div class="row-sub">${reported.smart_vad_enabled===true?'On':reported.smart_vad_enabled===false?'Off':'Not set'}</div></div><div class="row-actions"><select id="smart-vad" class="select compact"><option value="true" ${desired.smart_vad_enabled===true?'selected':''}>On</option><option value="false" ${desired.smart_vad_enabled===false?'selected':''}>Off</option></select><button class="btn" id="save-vad" type="button">Change</button></div></div><div class="control-row"><div><div class="row-title">OTA polling</div><div class="row-sub">Desired polling interval</div></div><div class="row-actions"><input id="ota-seconds" class="input compact" type="number" min="1" step="1" value="${esc(desired.ota_poll_interval_s??reported.ota_poll_interval_s??'')}"><button class="btn" id="save-ota" type="button">Change</button></div></div></div></section><details class="advanced"><summary>Advanced</summary><div class="requested-applied"><div class="truth-box"><b>Requested</b><div>Desired revision ${esc(d.desired_version)}</div></div><div class="truth-box"><b>Applied</b><div>Reported revision ${esc(d.reported_version)}</div></div></div><div class="advanced-grid"><div class="kv"><span>Device</span><b>${esc(d.device_id)}</b></div><div class="kv"><span>Connection</span><b>${esc(d.connection_status)}</b></div><div class="kv"><span>Last Twin update</span><b>${esc(date(d.updated_at))}</b></div><div class="kv"><span>Status</span><b>${esc(stateText(s))}</b></div><div class="kv"><span>VAD threshold requested</span><b>${esc(desired.vad_threshold??'Not set')}</b></div><div class="kv"><span>VAD threshold applied</span><b>${esc(reported.vad_threshold??'Not set')}</b></div><div class="kv"><span>Silence timing requested</span><b>${esc(desired.vad_silence_ms??'Not set')}</b></div><div class="kv"><span>Min speech timing applied</span><b>${esc(reported.vad_min_speech_ms??'Not set')}</b></div></div></details><div id="device-action-status" class="sheet-status" role="status" aria-live="polite"></div>`}
function bindCompanion(c,d){if(!d?.has_device)return;const run=async(body)=>{const status=c.querySelector('#device-action-status');status.textContent='Saving…';status.className='sheet-status';try{await mutate('/v1/owner/data/device/config','POST',{device_id:d.device_id,...body});status.textContent='Saved';status.className='sheet-status success';await renderCompanion(c)}catch(e){status.textContent=e.message;status.className='sheet-status error'}};c.querySelector('#save-wake').onclick=()=>run({wake_model:c.querySelector('#wake-model').value});c.querySelector('#save-wake-threshold').onclick=()=>{const value=Number(c.querySelector('#wake-threshold').value);if(!Number.isFinite(value))return;run({wake_threshold:value})};c.querySelector('#save-vad').onclick=()=>run({smart_vad_enabled:c.querySelector('#smart-vad').value==='true'});c.querySelector('#save-ota').onclick=()=>{const value=Number(c.querySelector('#ota-seconds').value);if(!Number.isInteger(value)||value<1)return;run({ota_poll_interval:`${value}s`})}}
function openPersonal(tab){app.personal=tab;setView('personal')}
async function renderPersonal(c){c.innerHTML=pageHead('Personal')+`<div class="tabs"><button data-tab="money">Money</button><button data-tab="notes">Notes & Journal</button><button data-tab="reminders">Reminders & Timers</button><button data-tab="voice">Voice Memos</button></div><div id="personal-body"></div>`;c.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===app.personal);b.onclick=()=>{app.personal=b.dataset.tab;renderPersonal(c)}});const body=c.querySelector('#personal-body');if(app.personal==='money')await renderMoney(body);else if(app.personal==='notes')await renderNotes(body);else if(app.personal==='reminders')await renderReminders(body);else await renderVoice(body)}
async function renderMoney(c){const [expenses,overview,goal]=await Promise.all([fetchJSON('/v1/owner/data/expenses?limit=50'),fetchJSON('/v1/owner/data/overview'),fetchJSON('/v1/owner/data/savings-goal?period=monthly')]);const list=expenses.expenses||[];c.innerHTML=`<div class="metrics"><div class="metric"><span>Monthly spending</span><strong>${money(overview.month_total)}</strong></div><div class="metric"><span>Monthly budget</span><strong>${overview.budget_set?money(overview.monthly_budget):'Not set'}</strong></div><div class="metric"><span>Savings goal</span><strong>${goal.set?money(goal.goal?.target_vnd):'Not set'}</strong></div></div><section class="section"><div class="split"><div class="card"><div class="field"><label for="budget-value">Monthly budget</label><input id="budget-value" class="input" type="number" min="0" step="1000" value="${overview.budget_set?esc(overview.monthly_budget):''}"></div><button id="save-budget" class="btn primary" type="button">Save budget</button></div><div class="card"><div class="field"><label for="goal-value">Savings goal</label><input id="goal-value" class="input" type="number" min="1" step="1000" value="${goal.set?esc(goal.goal?.target_vnd):''}"></div><div class="field"><label for="goal-description">Description</label><input id="goal-description" class="input" value="${goal.set?esc(goal.goal?.description):''}"></div><button id="save-goal" class="btn primary" type="button">Save goal</button></div></div></section><section class="section"><div class="toolbar"><h2>Expenses</h2><button class="btn primary" type="button" id="add-expense">+ Expense</button></div><div class="item-list">${list.length?list.map(x=>`<div class="item"><div><div class="item-title">${money(x.amount_vnd)} · ${esc(x.category||'other')}</div><div class="item-sub">${esc(x.description||'No description')} · ${esc(date(x.occurred_at))}</div></div><div class="item-actions"><button class="btn" type="button" data-edit-expense="${x.id}">Edit</button></div></div>`).join(''):'<div class="empty">No expenses in this period.</div>'}</div></section>`;c.querySelector('#save-budget').onclick=async()=>{const v=Number(c.querySelector('#budget-value').value);await mutate('/v1/owner/data/budget','POST',{period:'monthly',limit_vnd:v});renderPersonal(document.getElementById('content'))};c.querySelector('#save-goal').onclick=async()=>{const v=Number(c.querySelector('#goal-value').value);await mutate('/v1/owner/data/savings-goal','POST',{period:'monthly',target_vnd:v,description:c.querySelector('#goal-description').value});renderPersonal(document.getElementById('content'))};c.querySelector('#add-expense').onclick=e=>openCreate('expense',e.currentTarget);c.querySelectorAll('[data-edit-expense]').forEach(b=>{const item=list.find(x=>String(x.id)===b.dataset.editExpense);b.onclick=()=>openEdit('expense',item,b)})}
async function renderNotes(c){const [notes,journal]=await Promise.all([fetchJSON('/v1/owner/data/notes?limit=50'),fetchJSON('/v1/owner/data/journal?limit=50')]);const n=notes.notes||[],j=journal.journal||[];c.innerHTML=`<div class="split"><section><div class="toolbar"><h2>Notes</h2><button class="btn primary" id="add-note" type="button">+ Note</button></div><div class="item-list">${n.length?n.map(x=>`<div class="item"><div><div class="item-title">${esc(x.content)}</div><div class="item-sub">${esc(date(x.created_at))}</div></div><button class="btn" type="button" data-edit-note="${x.id}">Edit</button></div>`).join(''):'<div class="empty">No notes yet.</div>'}</div></section><section><div class="toolbar"><h2>Journal</h2><button class="btn primary" id="add-journal" type="button">+ Journal</button></div><div class="item-list">${j.length?j.map(x=>`<div class="item"><div><div class="item-title">${esc(x.content)}</div><div class="item-sub">${esc(date(x.occurred_at))}</div></div><button class="btn" type="button" data-edit-journal="${x.id}">Edit</button></div>`).join(''):'<div class="empty">No journal entries yet.</div>'}</div></section></div>`;c.querySelector('#add-note').onclick=e=>openCreate('note',e.currentTarget);c.querySelector('#add-journal').onclick=e=>openCreate('journal',e.currentTarget);c.querySelectorAll('[data-edit-note]').forEach(b=>{const item=n.find(x=>String(x.id)===b.dataset.editNote);b.onclick=()=>openEdit('note',item,b)});c.querySelectorAll('[data-edit-journal]').forEach(b=>{const item=j.find(x=>String(x.id)===b.dataset.editJournal);b.onclick=()=>openEdit('journal',item,b)})}
async function renderReminders(c){const data=await fetchJSON('/v1/owner/data/reminders?limit=50');const reminders=data.reminders||[],timers=data.timers||[];c.innerHTML=`<section><div class="toolbar"><h2>Reminders & Timers</h2><div><button class="btn" id="add-timer" type="button">+ Timer</button> <button class="btn primary" id="add-reminder" type="button">+ Reminder</button></div></div><div class="item-list">${reminders.length?reminders.map(x=>`<div class="item"><div><div class="item-title">${esc(x.title)}</div><div class="item-sub">Reminder · ${esc(date(x.fire_at))} · ${esc(x.status)}</div></div><button class="btn" type="button" data-edit-reminder="${x.id}">Edit</button></div>`).join(''):'<div class="empty">No active reminders.</div>'}</div></section><section class="section"><div class="toolbar"><h2>Timers</h2></div><div class="item-list">${timers.length?timers.map(x=>`<div class="item"><div><div class="item-title">${esc(x.title)}</div><div class="item-sub">${esc(date(x.fire_at))} · ${esc(x.status)}</div></div><div class="item-actions">${x.status==='paused'?`<button class="btn" data-resume="${x.id}" type="button">Resume</button>`:`<button class="btn" data-pause="${x.id}" type="button">Pause</button>`}<button class="btn danger" data-cancel-timer="${x.id}" type="button">Cancel</button></div></div>`).join(''):'<div class="empty">No active timers.</div>'}</div></section>`;c.querySelector('#add-reminder').onclick=e=>openCreate('reminder',e.currentTarget);c.querySelector('#add-timer').onclick=e=>openCreate('timer',e.currentTarget);c.querySelectorAll('[data-edit-reminder]').forEach(b=>{const item=reminders.find(x=>String(x.id)===b.dataset.editReminder);b.onclick=()=>openEdit('reminder',item,b)});c.querySelectorAll('[data-pause]').forEach(b=>b.onclick=async()=>{await mutate('/v1/owner/data/timers/pause','POST',{id:Number(b.dataset.pause)});renderPersonal(document.getElementById('content'))});c.querySelectorAll('[data-resume]').forEach(b=>b.onclick=async()=>{await mutate('/v1/owner/data/timers/resume','POST',{id:Number(b.dataset.resume)});renderPersonal(document.getElementById('content'))});c.querySelectorAll('[data-cancel-timer]').forEach(b=>b.onclick=()=>confirmAction('Cancel this timer?',async()=>{await mutate('/v1/owner/data/reminders/cancel','POST',{id:Number(b.dataset.cancelTimer)});renderPersonal(document.getElementById('content'))},b))}
async function renderVoice(c){const data=await fetchJSON('/v1/owner/data/voice-memos?limit=50');const list=data.voice_memos||[];c.innerHTML=`<div class="toolbar"><h2>Voice Memos</h2></div><div class="item-list">${list.length?list.map(v=>`<div class="item audio-row"><div><div class="item-title">${esc(v.transcript||'Voice memo')}</div><div class="item-sub">${esc(date(v.created_at))} · ${Math.round(Number(v.duration_ms||0)/1000)}s</div>${v.playback_available&&v.media_url?`<audio controls preload="none" src="${esc(v.media_url)}"></audio>`:'<div class="item-sub">Playback unavailable</div>'}</div><button class="btn danger" type="button" data-delete-voice="${v.id}">Delete</button></div>`).join(''):'<div class="empty">No voice memos yet.</div>'}</div>`;c.querySelectorAll('[data-delete-voice]').forEach(b=>b.onclick=()=>confirmAction('Delete this voice memo and its stored audio?',async()=>{await mutate('/v1/owner/data/voice-memos?id='+encodeURIComponent(b.dataset.deleteVoice),'DELETE');renderPersonal(document.getElementById('content'))},b))}
async function renderSettings(c){const data=await fetchJSON('/v1/owner/data/privacy');const p=data.privacy||{};c.innerHTML=`${pageHead('Settings')}<div class="card"><div class="settings-form"><div class="check-row"><label for="save-voice">Save voice audio</label><input id="save-voice" type="checkbox" ${p.save_voice_audio?'checked':''}></div><div class="field"><label for="voice-policy">Voice mail policy</label><select id="voice-policy" class="select"><option value="disabled" ${p.voice_mail_policy==='disabled'?'selected':''}>Disabled</option><option value="ephemeral" ${p.voice_mail_policy==='ephemeral'?'selected':''}>Ephemeral</option><option value="retained" ${p.voice_mail_policy==='retained'?'selected':''}>Retained</option></select></div><div class="check-row"><label for="memory-enabled">Long-term memory</label><input id="memory-enabled" type="checkbox" ${p.long_term_memory_enabled?'checked':''}></div><div class="form-grid"><div class="field"><label for="conversation-days">Conversation retention days</label><input id="conversation-days" class="input" type="number" min="0" max="3650" value="${esc(p.conversation_retention_days??30)}"></div><div class="field"><label for="voice-days">Voice memo retention days</label><input id="voice-days" class="input" type="number" min="0" max="3650" value="${esc(p.voice_memo_retention_days??30)}"></div><div class="field"><label for="memory-days">Memory retention days</label><input id="memory-days" class="input" type="number" min="0" max="3650" value="${esc(p.memory_retention_days??90)}"></div></div><button id="save-privacy" class="btn primary" type="button">Save privacy settings</button><div id="privacy-status" class="sheet-status" role="status" aria-live="polite"></div></div></div>`;c.querySelector('#save-privacy').onclick=async()=>{const s=c.querySelector('#privacy-status');s.textContent='Saving…';try{await mutate('/v1/owner/data/privacy','POST',{user_id:p.user_id||'',save_voice_audio:c.querySelector('#save-voice').checked,voice_mail_policy:c.querySelector('#voice-policy').value,long_term_memory_enabled:c.querySelector('#memory-enabled').checked,conversation_retention_days:Number(c.querySelector('#conversation-days').value),voice_memo_retention_days:Number(c.querySelector('#voice-days').value),memory_retention_days:Number(c.querySelector('#memory-days').value),updated_at:p.updated_at});s.textContent='Saved';s.className='sheet-status success'}catch(e){s.textContent=e.message;s.className='sheet-status error'}}}
const sheet=document.getElementById('edit-sheet'),sheetForm=document.getElementById('sheet-form'),sheetFields=document.getElementById('sheet-fields'),sheetTitle=document.getElementById('sheet-title'),sheetSubtitle=document.getElementById('sheet-subtitle'),sheetDelete=document.getElementById('sheet-delete'),sheetStatus=document.getElementById('sheet-status');
function field(name,label,type,value,opts=''){const tag=type==='textarea'?`<textarea class="textarea" id="sheet-${name}" name="${name}" ${opts}>${esc(value??'')}</textarea>`:`<input class="input" id="sheet-${name}" name="${name}" type="${type}" value="${esc(value??'')}" ${opts}>`;return `<div class="field"><label for="sheet-${name}">${esc(label)}</label>${tag}</div>`}
function openCreate(kind,trigger){const base={kind,mode:'create',item:null};if(kind==='expense')base.item={amount_vnd:'',category:'other',description:'',occurred_at:new Date().toISOString()};if(kind==='note')base.item={content:''};if(kind==='journal')base.item={content:''};if(kind==='reminder')base.item={title:'',fire_at:new Date(Date.now()+10*60*1000).toISOString()};if(kind==='timer')base.item={title:'',fire_at:new Date(Date.now()+10*60*1000).toISOString()};openSheet(base,trigger)}
function openEdit(kind,item,trigger){openSheet({kind,mode:'edit',item:{...item}},trigger)}
function openSheet(state,trigger){app.sheet=state;app.lastFocus=trigger||document.activeElement;sheetStatus.textContent='';sheetStatus.className='sheet-status';const create=state.mode==='create';const label={expense:'Expense',note:'Note',journal:'Journal',reminder:'Reminder',timer:'Timer'}[state.kind];sheetTitle.textContent=(create?'Add ':'Edit ')+label;sheetSubtitle.textContent=create?'Enter the new item details.':'Current authoritative values are loaded before editing.';const x=state.item||{};if(state.kind==='expense')sheetFields.innerHTML=field('amount_vnd','Amount (VND)','number',x.amount_vnd,'min="1" max="1000000000" required')+field('category','Category','text',x.category||'other','required')+field('description','Description','textarea',x.description||'')+field('occurred_at','Occurred time','datetime-local',localValue(x.occurred_at),'required');else if(state.kind==='note')sheetFields.innerHTML=field('content','Content','textarea',x.content||'','required');else if(state.kind==='journal')sheetFields.innerHTML=field('content','Content','textarea',x.content||'','required')+(create?'':field('occurred_at','Occurred time','datetime-local',localValue(x.occurred_at),'required'));else sheetFields.innerHTML=field('title','Title','text',x.title||'','required')+field('fire_at',state.kind==='timer'?'End time':'Fire time','datetime-local',localValue(x.fire_at),'required');sheetDelete.hidden=create;sheetDelete.textContent=state.kind==='reminder'?'Cancel reminder':'Delete';if(!sheet.open)sheet.showModal();requestAnimationFrame(()=>sheetFields.querySelector('input,textarea,select')?.focus())}
function closeSheet(){if(sheet.open)sheet.close()}
document.getElementById('sheet-close').onclick=closeSheet;document.getElementById('sheet-cancel').onclick=closeSheet;sheet.addEventListener('close',()=>{const f=app.lastFocus;app.sheet=null;if(f&&document.contains(f))f.focus()});
sheetForm.addEventListener('submit',async e=>{e.preventDefault();if(!app.sheet)return;const save=document.getElementById('sheet-save');save.disabled=true;sheetStatus.textContent='Saving…';sheetStatus.className='sheet-status';try{await saveSheet();sheetStatus.textContent='Saved';sheetStatus.className='sheet-status success';closeSheet();await render()}catch(err){sheetStatus.textContent=err.message;sheetStatus.className='sheet-status error'}finally{save.disabled=false}});
async function saveSheet(){const s=app.sheet,x=s.item||{};if(s.kind==='expense'){const body={amount_vnd:Number(document.getElementById('sheet-amount_vnd').value),category:document.getElementById('sheet-category').value,description:document.getElementById('sheet-description').value,occurred_at:isoValue(document.getElementById('sheet-occurred_at').value)};if(s.mode==='edit'){body.id=x.id;return mutate('/v1/owner/data/expenses','PATCH',body)}return mutate('/v1/owner/data/expenses','POST',body)}if(s.kind==='note'){const body={content:document.getElementById('sheet-content').value};if(s.mode==='edit'){body.id=x.id;return mutate('/v1/owner/data/notes','PATCH',body)}return mutate('/v1/owner/data/notes','POST',body)}if(s.kind==='journal'){const body={content:document.getElementById('sheet-content').value};if(s.mode==='edit'){body.id=x.id;body.occurred_at=isoValue(document.getElementById('sheet-occurred_at').value);return mutate('/v1/owner/data/journal','PATCH',body)}return mutate('/v1/owner/data/journal','POST',body)}const body={title:document.getElementById('sheet-title').value,fire_at:isoValue(document.getElementById('sheet-fire_at').value)};if(s.kind==='reminder'&&s.mode==='edit'){body.id=x.id;return mutate('/v1/owner/data/reminders','PATCH',body)}if(s.kind==='timer'){body.kind='timer';body.device_id=app.deviceID||''}return mutate('/v1/owner/data/reminders','POST',body)}
sheetDelete.onclick=()=>{if(!app.sheet||app.sheet.mode!=='edit')return;const s={...app.sheet,item:{...app.sheet.item}};const text=s.kind==='reminder'?'Cancel this reminder?':`Delete this ${s.kind}?`;confirmAction(text,async()=>{if(s.kind==='expense')await mutate('/v1/owner/data/expenses?id='+encodeURIComponent(s.item.id),'DELETE');else if(s.kind==='note')await mutate('/v1/owner/data/notes?id='+encodeURIComponent(s.item.id),'DELETE');else if(s.kind==='journal')await mutate('/v1/owner/data/journal?id='+encodeURIComponent(s.item.id),'DELETE');else if(s.kind==='reminder')await mutate('/v1/owner/data/reminders/cancel','POST',{id:s.item.id});closeSheet();await render()},sheetDelete)};
const confirmDialog=document.getElementById('confirm-dialog');let confirmRun=null,confirmFocus=null;function confirmAction(text,run,trigger){document.getElementById('confirm-text').textContent=text;confirmRun=run;confirmFocus=trigger||document.activeElement;confirmDialog.showModal();document.getElementById('confirm-ok').focus()}document.getElementById('confirm-cancel').onclick=()=>confirmDialog.close();document.getElementById('confirm-ok').onclick=async()=>{const run=confirmRun;document.getElementById('confirm-ok').disabled=true;try{if(run)await run();confirmDialog.close()}finally{document.getElementById('confirm-ok').disabled=false}};confirmDialog.addEventListener('close',()=>{confirmRun=null;if(confirmFocus&&document.contains(confirmFocus))confirmFocus.focus()});
loadDevices().finally(render);
</script>
