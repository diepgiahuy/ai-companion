<style>
:root{--bg:#0f1115;--nav:#0b0d11;--surface:#16191f;--surface2:#13161b;--surface3:#1d222b;--line:rgba(255,255,255,.08);--text:#f7f8fb;--muted:#9fa6b2;--dim:#707887;--accent:#7d73f4;--accent2:#978fff;--ok:#38c992;--warn:#efb95f;--bad:#ff737d;--radius:16px;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}body{overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,input,select,textarea,summary{outline:none}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid rgba(151,143,255,.78);outline-offset:2px}
.app{height:100vh;display:grid;grid-template-columns:190px minmax(0,1fr)}.sidebar{background:var(--nav);border-right:1px solid var(--line);padding:20px 17px;display:flex;flex-direction:column}.brand{font-weight:650;font-size:16px;padding:0 3px 25px}.nav{display:grid;gap:6px}.nav button{min-height:44px;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;font-size:12px}.nav button:hover{background:rgba(255,255,255,.04);color:#fff}.nav button.active{background:#1a172e;color:#e8e3ff;font-weight:650}.sidebar-foot{margin-top:auto;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:space-between}.link-btn{min-height:44px;border:0;background:transparent;color:var(--muted);padding:8px}.main{overflow:auto}.top{position:sticky;top:0;z-index:20;height:62px;padding:0 30px;background:rgba(15,17,21,.9);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:flex-end;border-bottom:1px solid var(--line)}.device-pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 11px;display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}.dot.online{background:var(--ok)}
.content{max-width:990px;margin:0 auto;padding:31px 30px 100px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px}.head h1{font-size:29px;line-height:1.1;letter-spacing:-.035em;margin:0}.lead{color:var(--muted);font-size:11px;margin-top:8px}.live{font-size:10px;font-weight:650;color:var(--ok);background:rgba(56,201,146,.12);padding:5px 9px;border-radius:999px}.section{margin-top:28px}.section-title{font-size:15px;font-weight:650;margin:0 0 12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.device-summary{padding:18px 17px;border:1px solid rgba(125,115,244,.18);border-radius:20px;background:var(--surface2)}.device-summary h2{font-size:17px;margin:0}.device-summary p{font-size:11px;color:var(--muted);margin:7px 0 0}.state-line{font-size:12px;font-weight:650;margin-top:14px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.dim{color:var(--dim)}.mono{font-family:var(--mono)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{min-height:78px;text-align:left;padding:14px 13px;border:1px solid var(--line);background:var(--surface);border-radius:14px}.quick:hover{background:var(--surface3)}.quick b{font-size:13px}.quick span{display:block;color:var(--muted);font-size:10px;margin-top:10px}.summary-list{display:grid;gap:8px}.summary-link{min-height:64px;width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:0;background:var(--surface2);border-radius:12px;padding:12px 14px}.summary-link:hover{background:var(--surface)}.summary-link b{font-size:13px}.summary-link span{display:block;color:var(--muted);font-size:11px;margin-top:6px}.summary-link em{font-style:normal;color:var(--accent2);font-size:11px;font-weight:650;padding-left:20px}.truth-note{font-size:10px;color:var(--dim);margin-top:24px}
.state-card{padding:17px 15px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.state-card strong{font-size:16px}.state-card p{font-size:11px;color:var(--muted);margin:8px 0 0}.control-list{display:grid;gap:8px}.control-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:14px;align-items:center;min-height:64px;padding:10px 14px;background:var(--surface2);border-radius:12px}.row-title{font-size:13px;font-weight:560}.row-sub{font-size:11px;color:var(--muted);margin-top:5px}.row-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}.requested-applied{display:grid;grid-template-columns:1fr 1fr;gap:10px}.truth-box{background:var(--surface2);border-radius:12px;padding:13px}.truth-box b{font-size:11px}.truth-box div{font-size:10px;color:var(--muted);margin-top:8px}.advanced{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:13px}.advanced summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--accent2);font-size:12px}.advanced-controls{display:grid;gap:8px;margin-top:10px}.advanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv{background:var(--surface2);border-radius:10px;padding:10px}.kv span{display:block;color:var(--dim);font-size:10px}.kv b{display:block;font-size:11px;margin-top:5px;word-break:break-word}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.tabs button{min-height:44px;border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px}.tabs button.active{background:var(--surface3);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar h2{font-size:15px;margin:0}.item-list{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface2);border-radius:12px;padding:12px 14px;min-height:64px}.item-title{font-size:13px;line-height:1.45;word-break:break-word}.item-sub{font-size:10.5px;color:var(--muted);margin-top:5px}.item-actions{display:flex;gap:7px;align-items:center}.empty{border:1px dashed var(--line);border-radius:14px;padding:30px 18px;text-align:center;color:var(--muted);font-size:11px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--surface2);border-radius:12px;padding:13px}.metric span{font-size:10px;color:var(--muted)}.metric strong{display:block;font-size:17px;margin-top:8px}.audio-row audio{width:min(360px,100%);height:34px;margin-top:8px}
.btn,.input,.select,.textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px}.btn{min-height:44px;padding:9px 12px;font-size:11px}.btn:hover{background:var(--surface3)}.btn.primary{background:var(--accent);border-color:transparent;font-weight:650}.btn.primary:hover{background:var(--accent2)}.btn.danger{background:#381417;border-color:rgba(255,115,125,.25);color:#ffb0b8}.btn.ghost{background:transparent}.btn:disabled{opacity:.48;cursor:not-allowed}.input,.select,.textarea{width:100%;min-height:44px;padding:10px 11px}.textarea{min-height:86px;resize:vertical}.compact{width:auto;min-width:92px}.field{display:grid;gap:6px}.field label{font-size:10px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings-form{display:grid;gap:12px}.check-row{display:flex;min-height:44px;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.check-row label{font-size:12px}.check-row input{width:22px;height:22px}.notice{padding:12px 13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:11px;line-height:1.5}.notice.error{border-color:rgba(255,115,125,.25);color:#ffb0b8;background:rgba(255,115,125,.06)}
.sheet{border:0;padding:0;margin:0 0 0 auto;width:min(620px,calc(100vw - 190px));max-width:100%;height:100vh;max-height:100vh;background:var(--surface);color:var(--text);box-shadow:-18px 0 50px rgba(0,0,0,.34)}.sheet::backdrop{background:rgba(4,6,10,.62)}.sheet-shell{min-height:100%;display:flex;flex-direction:column}.sheet-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.sheet-head h2{font-size:18px;margin:0}.sheet-head p{font-size:10px;color:var(--muted);margin:7px 0 0}.sheet-body{padding:18px 20px;display:grid;gap:14px;overflow:auto}.sheet-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.sheet-actions{display:flex;gap:8px}.sheet-status{font-size:10px;color:var(--muted);min-height:16px}.sheet-status.success{color:var(--ok)}.sheet-status.error{color:var(--bad)}.confirm{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);padding:20px;width:min(420px,calc(100vw - 28px))}.confirm::backdrop{background:rgba(4,6,10,.72)}.confirm h2{font-size:17px;margin:0}.confirm p{font-size:11px;color:var(--muted);line-height:1.5}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobile-nav{display:none}
@media(max-width:820px){.app{grid-template-columns:150px 1fr}.content{padding-left:22px;padding-right:22px}.sheet{width:calc(100vw - 150px)}}
@media(max-width:640px){body{overflow:auto}.app{display:block;height:auto;min-height:100vh}.sidebar{display:none}.main{overflow:visible;padding-bottom:72px}.top{height:54px;padding:0 14px}.content{padding:24px 14px 96px}.quick-grid,.split,.metrics,.requested-applied,.advanced-grid,.form-grid{grid-template-columns:1fr}.control-row{grid-template-columns:1fr}.row-actions{justify-content:flex-start;flex-wrap:wrap}.sheet{width:100vw;height:min(82vh,720px);max-height:82vh;margin:auto 0 0;border-radius:20px 20px 0 0}.sheet-shell{min-height:100%}.sheet-foot{align-items:flex-start;flex-direction:column}.sheet-actions{width:100%}.sheet-actions .btn{flex:1}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);left:8px;right:8px;bottom:8px;z-index:50;border:1px solid var(--line);background:rgba(22,25,31,.94);backdrop-filter:blur(16px);border-radius:16px;padding:6px}.mobile-nav button{min-height:44px;border:0;background:transparent;color:var(--muted);border-radius:9px;font-size:10px}.mobile-nav button.active{background:rgba(125,115,244,.16);color:#fff}}

</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">AI Companion</div>
<nav class="nav" aria-label="Owner Hub">
<button class="active" type="button" data-view="home">Home</button>
<button type="button" data-view="companion">Companion</button>
<button type="button" data-view="personal">Personal</button>
<button type="button" data-view="settings">Settings</button>
</nav>
<div class="sidebar-foot"><span>Owner</span><button class="link-btn" type="button" onclick="logout()">Sign out</button></div>
</aside>
<main class="main">
<header class="top"><div id="device-pill" class="device-pill"><span class="dot"></span><span>No Companion</span></div></header>
<div class="content" id="content" aria-live="polite"></div>
</main>
</div>
<nav class="mobile-nav" aria-label="Owner Hub mobile">
<button class="active" type="button" data-view="home">Home</button>
<button type="button" data-view="companion">Companion</button>
<button type="button" data-view="personal">Personal</button>
<button type="button" data-view="settings">Settings</button>
</nav>

<dialog id="edit-sheet" class="sheet" aria-labelledby="sheet-heading">
<form id="sheet-form" class="sheet-shell" method="dialog">
<div class="sheet-head">
<div><h2 id="sheet-heading">Edit item</h2><p id="sheet-subtitle">Current authoritative values are loaded before editing.</p></div>
<button class="btn ghost" type="button" id="sheet-close" aria-label="Close edit panel">Close</button>
</div>
<div class="sheet-body" id="sheet-fields"></div>
<div class="sheet-foot">
<button class="btn danger" id="sheet-delete" type="button">Delete</button>
<div>
<div id="sheet-status" class="sheet-status" role="status" aria-live="polite"></div>
<div class="sheet-actions"><button class="btn" type="button" id="sheet-cancel">Cancel</button><button class="btn primary" type="submit" id="sheet-save">Save</button></div>
</div>
</div>
</form>
</dialog>

<dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-title">
<h2 id="confirm-title">Confirm change</h2>
<p id="confirm-text"></p>
<div class="confirm-actions"><button class="btn" type="button" id="confirm-cancel">Keep item</button><button class="btn danger" type="button" id="confirm-ok">Confirm</button></div>
</dialog>

<script>
const app={view:'home',personal:'money',deviceID:'',devices:[],device:null,sheet:null,lastFocus:null};
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const money=value=>new Intl.NumberFormat('vi-VN').format(Number(value||0))+' VND';
const date=value=>value?new Date(value).toLocaleString():'—';

function localValue(value){
  const current=value?new Date(value):new Date();
  if(Number.isNaN(current.getTime()))return'';
  const pad=number=>String(number).padStart(2,'0');
  return `${current.getFullYear()}-${pad(current.getMonth()+1)}-${pad(current.getDate())}T${pad(current.getHours())}:${pad(current.getMinutes())}`;
}

function isoValue(value){
  const parsed=new Date(value);
  if(Number.isNaN(parsed.getTime()))throw new Error('Enter a valid date and time.');
  return parsed.toISOString();
}

function cookie(name){
  const item=document.cookie.split(';').map(value=>value.trim()).find(value=>value.startsWith(name+'='));
  return item?decodeURIComponent(item.slice(name.length+1)):'';
}

async function fetchJSON(url){
  const response=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error(`Request failed (${response.status})`);
  return response.json();
}

async function mutate(url,method,body){
  const headers={'X-CSRF-Token':cookie('__Host-companion_csrf'),'Accept':'application/json'};
  if(body!==undefined)headers['Content-Type']='application/json';
  const response=await fetch(url,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
  const text=await response.text();
  let data={};
  if(text){try{data=JSON.parse(text)}catch(_){data={message:text.trim()}}}
  if(!response.ok)throw new Error(data.error||data.message||`Request failed (${response.status})`);
  return data;
}

function stateText(state){
  return ({applied:'Settings synced',requested:'Applying settings',offline:'Will apply when Companion reconnects',rejected:"Couldn't apply settings",stale:'Device report is stale',unknown:'Status unavailable'})[state]||'Status unavailable';
}

function stateClass(state){
  if(state==='applied')return'ok';
  if(state==='rejected')return'bad';
  if(state==='unknown')return'muted';
  return'warn';
}

function wakeLabel(value){
  if(value==='disabled')return'Push-to-talk only';
  if(value==='wn9_hiesp')return'Hi, ESP';
  return value||'Not set';
}

function pageHead(title){
  return `<div class="head"><div><h1>${esc(title)}</h1><div class="lead">Current product surface</div></div><span class="live">LIVE</span></div>`;
}

function setView(view){
  app.view=view;
  document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));
  render();
}

document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));

async function logout(){
  try{await mutate('/v1/owner/auth/logout','POST')}finally{location.reload()}
}

async function loadDevices(){
  try{
    const data=await fetchJSON('/v1/owner/data/devices');
    app.devices=data.devices||[];
    if(!app.deviceID&&app.devices.length)app.deviceID=app.devices[0].device_id;
  }catch(_){app.devices=[]}
  return loadDevice();
}

async function loadDevice(){
  try{
    const query=app.deviceID?'?device_id='+encodeURIComponent(app.deviceID):'';
    app.device=await fetchJSON('/v1/owner/data/device'+query);
    if(app.device?.device_id)app.deviceID=app.device.device_id;
  }catch(_){app.device=null}
  updateDevicePill();
  return app.device;
}

function updateDevicePill(){
  const pill=document.getElementById('device-pill');
  const device=app.device;
  if(!device?.has_device){pill.innerHTML='<span class="dot"></span><span>No Companion</span>';return}
  pill.innerHTML=`<span class="dot ${device.connection_status==='online'?'online':''}"></span><span>${esc(device.connection_status)}</span>`;
}

function noDevice(){
  return '<div class="empty"><b>No Companion linked.</b><div>Complete the existing secure claim flow from the Companion.</div></div>';
}

async function render(){
  const content=document.getElementById('content');
  content.innerHTML='<div class="muted">Loading…</div>';
  try{
    if(app.view==='home')await renderHome(content);
    else if(app.view==='companion')await renderCompanion(content);
    else if(app.view==='personal')await renderPersonal(content);
    else await renderSettings(content);
  }catch(error){content.innerHTML=`<div class="notice error">${esc(error.message)}</div>`}
}

async function renderHome(content){
  const [overview]=await Promise.all([fetchJSON('/v1/owner/data/overview'),loadDevices()]);
  const device=app.device;
  const state=device?.settings_status?.state||'unknown';
  content.innerHTML=`${pageHead('Home')}
  <div class="device-summary">
    <h2>Companion</h2>
    <p>Connection and settings state from authoritative Device Twin</p>
    <div class="state-line ${stateClass(state)}">${device?.has_device?`${esc(device.connection_status)} · ${esc(stateText(state))}`:'No Companion linked'}</div>
  </div>
  <section class="section">
    <h2 class="section-title">Quick add</h2>
    <div class="quick-grid">
      <button class="quick" type="button" data-create="expense"><b>+ Expense</b><span>Existing personal domain</span></button>
      <button class="quick" type="button" data-create="note"><b>+ Note</b><span>Existing personal domain</span></button>
      <button class="quick" type="button" data-create="reminder"><b>+ Reminder</b><span>Existing scheduler domain</span></button>
    </div>
  </section>
  <section class="section">
    <h2 class="section-title">Summary</h2>
    <div class="summary-list">
      <button class="summary-link" type="button" data-personal="money"><span><b>Money</b><span>${money(overview.month_total)} this month · Monthly budget ${overview.budget_set?money(overview.monthly_budget):'Not set'}</span></span><em>Open</em></button>
      <button class="summary-link" type="button" data-personal="notes"><span><b>Notes & journal</b><span>${(overview.notes||[]).length} recent notes</span></span><em>Open</em></button>
      <button class="summary-link" type="button" data-personal="reminders"><span><b>Reminders & timers</b><span>${(overview.reminders||[]).length} active reminders</span></span><em>Open</em></button>
    </div>
  </section>
  <div class="truth-note">No fake battery, RSSI, firmware version, activity feed, or chat state appears without an authoritative source.</div>`;
  content.querySelectorAll('[data-create]').forEach(button=>button.onclick=()=>openCreate(button.dataset.create,button));
  content.querySelectorAll('[data-personal]').forEach(button=>button.onclick=()=>openPersonal(button.dataset.personal));
}

async function renderCompanion(content){
  const device=await loadDevice();
  content.innerHTML=pageHead('Companion')+(device?.has_device?companionMarkup(device):noDevice());
  bindCompanion(content,device);
}

function controlRow(title,sub,input,buttonID){
  return `<div class="control-row"><div><div class="row-title">${esc(title)}</div><div class="row-sub">${esc(sub)}</div></div><div class="row-actions">${input}<button class="btn" id="${buttonID}" type="button">Change</button></div></div>`;
}

function companionMarkup(device){
  const state=device.settings_status?.state||'unknown';
  const desired=device.desired||{};
  const reported=device.reported||{};
  const wakeSelect=`<select id="wake-model" class="select compact"><option value="wn9_hiesp" ${desired.wake_model==='wn9_hiesp'?'selected':''}>Hi, ESP</option><option value="disabled" ${desired.wake_model==='disabled'?'selected':''}>Push-to-talk only</option></select>`;
  const smartVAD=`<select id="smart-vad" class="select compact"><option value="true" ${desired.smart_vad_enabled===true?'selected':''}>On</option><option value="false" ${desired.smart_vad_enabled===false?'selected':''}>Off</option></select>`;
  return `<div class="state-card">
    <strong class="${stateClass(state)}">${esc(stateText(state))}</strong>
    <p>${state==='applied'?'Requested and applied state match.':'Requested state remains distinct from applied device state.'}</p>
  </div>
  <section class="section">
    <h2 class="section-title">Common controls</h2>
    <div class="control-list">
      ${controlRow('Wake',wakeLabel(reported.wake_model),wakeSelect,'save-wake')}
      ${controlRow('Wake sensitivity','Supported threshold',`<input id="wake-threshold" class="input compact" type="number" min="0.40" max="0.99" step="0.01" value="${esc(desired.wake_threshold??reported.wake_threshold??'')}">`,'save-wake-threshold')}
      ${controlRow('Smart VAD',reported.smart_vad_enabled===true?'On':reported.smart_vad_enabled===false?'Off':'Not set',smartVAD,'save-vad')}
      ${controlRow('OTA polling','Desired polling interval',`<input id="ota-seconds" class="input compact" type="number" min="1" step="1" value="${esc(desired.ota_poll_interval_s??reported.ota_poll_interval_s??'')}">`,'save-ota')}
    </div>
  </section>
  <details class="advanced">
    <summary>Advanced</summary>
    <div class="advanced-controls">
      ${controlRow('VAD threshold','Existing audio activity threshold',`<input id="vad-threshold" class="input compact" type="number" min="1" max="65535" step="1" value="${esc(desired.vad_threshold??reported.vad_threshold??'')}">`,'save-vad-threshold')}
      ${controlRow('End silence','Milliseconds before speech ends',`<input id="vad-silence" class="input compact" type="number" min="100" max="5000" step="1" value="${esc(desired.vad_silence_ms??reported.vad_silence_ms??'')}">`,'save-vad-silence')}
      ${controlRow('Minimum speech','Milliseconds required for speech',`<input id="vad-min-speech" class="input compact" type="number" min="50" max="5000" step="1" value="${esc(desired.vad_min_speech_ms??reported.vad_min_speech_ms??'')}">`,'save-vad-min-speech')}
    </div>
    <div class="requested-applied">
      <div class="truth-box"><b>Requested</b><div>Desired revision ${esc(device.desired_version)}</div></div>
      <div class="truth-box"><b>Applied</b><div>Reported revision ${esc(device.reported_version)}</div></div>
    </div>
    <div class="advanced-grid">
      <div class="kv"><span>Device</span><b>${esc(device.device_id)}</b></div>
      <div class="kv"><span>Connection</span><b>${esc(device.connection_status)}</b></div>
      <div class="kv"><span>Last Twin update</span><b>${esc(date(device.updated_at))}</b></div>
      <div class="kv"><span>Status</span><b>${esc(stateText(state))}</b></div>
      <div class="kv"><span>VAD threshold requested</span><b>${esc(desired.vad_threshold??'Not set')}</b></div>
      <div class="kv"><span>VAD threshold applied</span><b>${esc(reported.vad_threshold??'Not set')}</b></div>
      <div class="kv"><span>End silence requested</span><b>${esc(desired.vad_silence_ms??'Not set')}</b></div>
      <div class="kv"><span>Minimum speech applied</span><b>${esc(reported.vad_min_speech_ms??'Not set')}</b></div>
    </div>
  </details>
  <div id="device-action-status" class="sheet-status" role="status" aria-live="polite"></div>`;
}

function bindCompanion(content,device){
  if(!device?.has_device)return;
  const run=async body=>{
    const status=content.querySelector('#device-action-status');
    status.textContent='Saving…';
    status.className='sheet-status';
    try{
      await mutate('/v1/owner/data/device/config','POST',{device_id:device.device_id,...body});
      status.textContent='Saved';
      status.className='sheet-status success';
      await renderCompanion(content);
    }catch(error){status.textContent=error.message;status.className='sheet-status error'}
  };
  content.querySelector('#save-wake').onclick=()=>run({wake_model:content.querySelector('#wake-model').value});
  content.querySelector('#save-wake-threshold').onclick=()=>{
    const value=Number(content.querySelector('#wake-threshold').value);
    if(Number.isFinite(value))run({wake_threshold:value});
  };
  content.querySelector('#save-vad').onclick=()=>run({smart_vad_enabled:content.querySelector('#smart-vad').value==='true'});
  content.querySelector('#save-ota').onclick=()=>{
    const value=Number(content.querySelector('#ota-seconds').value);
    if(Number.isInteger(value)&&value>0)run({ota_poll_interval:`${value}s`});
  };
  content.querySelector('#save-vad-threshold').onclick=()=>{
    const value=Number(content.querySelector('#vad-threshold').value);
    if(Number.isInteger(value))run({vad_threshold:value});
  };
  content.querySelector('#save-vad-silence').onclick=()=>{
    const value=Number(content.querySelector('#vad-silence').value);
    if(Number.isInteger(value))run({vad_silence_ms:value});
  };
  content.querySelector('#save-vad-min-speech').onclick=()=>{
    const value=Number(content.querySelector('#vad-min-speech').value);
    if(Number.isInteger(value))run({vad_min_speech_ms:value});
  };
}

function openPersonal(tab){app.personal=tab;setView('personal')}

async function renderPersonal(content){
  content.innerHTML=pageHead('Personal')+`<div class="tabs"><button type="button" data-tab="money">Money</button><button type="button" data-tab="notes">Notes & Journal</button><button type="button" data-tab="reminders">Reminders & Timers</button><button type="button" data-tab="voice">Voice Memos</button></div><div id="personal-body"></div>`;
  content.querySelectorAll('[data-tab]').forEach(button=>{
    button.classList.toggle('active',button.dataset.tab===app.personal);
    button.onclick=()=>{app.personal=button.dataset.tab;renderPersonal(content)};
  });
  const body=content.querySelector('#personal-body');
  if(app.personal==='money')await renderMoney(body);
  else if(app.personal==='notes')await renderNotes(body);
  else if(app.personal==='reminders')await renderReminders(body);
  else await renderVoice(body);
}

  <section class="section"><div class="toolbar"><h2>Timers</h2></div><div class="item-list">${timers.length?timers.map(item=>`<div class="item"><div><div class="item-title">${esc(item.title)}</div><div class="item-sub">${esc(date(item.fire_at))} · ${esc(item.status)}</div></div><div class="item-actions">${item.status==='paused'?`<button class="btn" data-resume="${item.id}" type="button">Resume</button>`:`<button class="btn" data-pause="${item.id}" type="button">Pause</button>`}<button class="btn danger" data-cancel-timer="${item.id}" type="button">Cancel</button></div></div>`).join(''):'<div class="empty">No active timers.</div>'}</div></section>`;

const sheet=document.getElementById('edit-sheet');
const sheetForm=document.getElementById('sheet-form');
const sheetFields=document.getElementById('sheet-fields');
const sheetHeading=document.getElementById('sheet-heading');
const sheetSubtitle=document.getElementById('sheet-subtitle');
const sheetDelete=document.getElementById('sheet-delete');
const sheetStatus=document.getElementById('sheet-status');

function field(name,label,type,value,options=''){
  const control=type==='textarea'?`<textarea class="textarea" id="sheet-${name}" name="${name}" ${options}>${esc(value??'')}</textarea>`:`<input class="input" id="sheet-${name}" name="${name}" type="${type}" value="${esc(value??'')}" ${options}>`;
  return `<div class="field"><label for="sheet-${name}">${esc(label)}</label>${control}</div>`;
}

function openCreate(kind,trigger){
  const state={kind,mode:'create',item:{}};
  if(kind==='expense')state.item={amount_vnd:'',category:'other',description:'',occurred_at:new Date().toISOString()};
  if(kind==='note'||kind==='journal')state.item={content:''};
  if(kind==='reminder'||kind==='timer')state.item={title:'',fire_at:new Date(Date.now()+10*60*1000).toISOString()};
  openSheet(state,trigger);
}

function openEdit(kind,item,trigger){openSheet({kind,mode:'edit',item:{...item}},trigger)}

function openSheet(state,trigger){
  app.sheet=state;
  app.lastFocus=trigger||document.activeElement;
  sheetStatus.textContent='';
  sheetStatus.className='sheet-status';
  const create=state.mode==='create';
  const label={expense:'Expense',note:'Note',journal:'Journal',reminder:'Reminder',timer:'Timer'}[state.kind];
  sheetHeading.textContent=(create?'Add ':'Edit ')+label;
  sheetSubtitle.textContent=create?'Enter the new item details.':'Current authoritative values are loaded before editing.';
  const item=state.item||{};
  if(state.kind==='expense'){
    sheetFields.innerHTML=field('amount_vnd','Amount (VND)','number',item.amount_vnd,'min="1" max="1000000000" required')+field('category','Category','text',item.category||'other','required')+field('description','Description','textarea',item.description||'')+field('occurred_at','Occurred time','datetime-local',localValue(item.occurred_at),'required');
  }else if(state.kind==='note'){
    sheetFields.innerHTML=field('content','Content','textarea',item.content||'','required');
  }else if(state.kind==='journal'){
    sheetFields.innerHTML=field('content','Content','textarea',item.content||'','required')+(create?'':field('occurred_at','Occurred time','datetime-local',localValue(item.occurred_at),'required'));
  }else{
    sheetFields.innerHTML=field('title','Title','text',item.title||'','required')+field('fire_at',state.kind==='timer'?'End time':'Fire time','datetime-local',localValue(item.fire_at),'required');
  }
  sheetDelete.hidden=create;
  sheetDelete.textContent=state.kind==='reminder'?'Cancel reminder':'Delete';
  if(!sheet.open)sheet.showModal();
  requestAnimationFrame(()=>sheetFields.querySelector('input,textarea,select')?.focus());
}

function closeSheet(){if(sheet.open)sheet.close()}
document.getElementById('sheet-close').onclick=closeSheet;
document.getElementById('sheet-cancel').onclick=closeSheet;
sheet.addEventListener('close',()=>{
  const focus=app.lastFocus;
  app.sheet=null;
  if(focus&&document.contains(focus))focus.focus();
});

sheetForm.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!app.sheet)return;
  const save=document.getElementById('sheet-save');
  save.disabled=true;
  sheetStatus.textContent='Saving…';
  sheetStatus.className='sheet-status';
  try{
    await saveSheet();
    sheetStatus.textContent='Saved';
    sheetStatus.className='sheet-status success';
    closeSheet();
    await render();
  }catch(error){
    sheetStatus.textContent=error.message;
    sheetStatus.className='sheet-status error';
  }finally{save.disabled=false}
});

async function saveSheet(){
  const state=app.sheet;
  const item=state.item||{};
  if(state.kind==='expense'){
    const body={amount_vnd:Number(document.getElementById('sheet-amount_vnd').value),category:document.getElementById('sheet-category').value,description:document.getElementById('sheet-description').value,occurred_at:isoValue(document.getElementById('sheet-occurred_at').value)};
    if(state.mode==='edit'){body.id=item.id;return mutate('/v1/owner/data/expenses','PATCH',body)}
    return mutate('/v1/owner/data/expenses','POST',body);
  }
  if(state.kind==='note'){
    const body={content:document.getElementById('sheet-content').value};
    if(state.mode==='edit'){body.id=item.id;return mutate('/v1/owner/data/notes','PATCH',body)}
    return mutate('/v1/owner/data/notes','POST',body);
  }
  if(state.kind==='journal'){
    const body={content:document.getElementById('sheet-content').value};
    if(state.mode==='edit'){
      body.id=item.id;
      body.occurred_at=isoValue(document.getElementById('sheet-occurred_at').value);
      return mutate('/v1/owner/data/journal','PATCH',body);
    }
    return mutate('/v1/owner/data/journal','POST',body);
  }
  const body={title:document.getElementById('sheet-title').value,fire_at:isoValue(document.getElementById('sheet-fire_at').value)};
  if(state.kind==='reminder'&&state.mode==='edit'){
    body.id=item.id;
    return mutate('/v1/owner/data/reminders','PATCH',body);
  }
  if(state.kind==='timer'){
    body.kind='timer';
    body.device_id=app.deviceID||'';
  }
  return mutate('/v1/owner/data/reminders','POST',body);
}

sheetDelete.onclick=()=>{
  if(!app.sheet||app.sheet.mode!=='edit')return;
  const state={...app.sheet,item:{...app.sheet.item}};
  const text=state.kind==='reminder'?'Cancel this reminder?':`Delete this ${state.kind}?`;
  confirmAction(text,async()=>{
    if(state.kind==='expense')await mutate('/v1/owner/data/expenses?id='+encodeURIComponent(state.item.id),'DELETE');
    else if(state.kind==='note')await mutate('/v1/owner/data/notes?id='+encodeURIComponent(state.item.id),'DELETE');
    else if(state.kind==='journal')await mutate('/v1/owner/data/journal?id='+encodeURIComponent(state.item.id),'DELETE');
    else if(state.kind==='reminder')await mutate('/v1/owner/data/reminders/cancel','POST',{id:state.item.id});
    closeSheet();
    await render();
  },sheetDelete);
};

const confirmDialog=document.getElementById('confirm-dialog');
let confirmRun=null;
let confirmFocus=null;

function confirmAction(text,run,trigger){
  document.getElementById('confirm-text').textContent=text;
  confirmRun=run;
  confirmFocus=trigger||document.activeElement;
  confirmDialog.showModal();
  document.getElementById('confirm-ok').focus();
}

document.getElementById('confirm-cancel').onclick=()=>confirmDialog.close();
document.getElementById('confirm-ok').onclick=async()=>{
  const run=confirmRun;
  const button=document.getElementById('confirm-ok');
  button.disabled=true;
  try{if(run)await run();confirmDialog.close()}finally{button.disabled=false}
};
confirmDialog.addEventListener('close',()=>{
  confirmRun=null;
  if(confirmFocus&&document.contains(confirmFocus))confirmFocus.focus();
});

loadDevices().finally(render);
</script>
