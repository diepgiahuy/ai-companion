services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
  esp-idf:
    build:
      context: .
      dockerfile: Dockerfile.esp-idf
  backend:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: ["sh", "-c", "cd backend && go run -tags nolibopusfile ./cmd/companiond"]
    working_dir: /src
    environment:
      COMPANION_ADDRESS: ":8000"
      COMPANION_DATABASE_URL: "postgres://companion_app:companion_app_dev@postgres:5432/companion?sslmode=disable"
      COMPANION_POSTGRES_ALLOW_INSECURE: "true"
      COMPANION_RECORDINGS_DIR: "/data/recordings"
      MOCK_TRANSCRIPT: "hôm nay đi chợ 50k"
    ports: ["8000:8000"]
    volumes: ["companion-data:/data"]
    depends_on:
      postgres-runtime-role:
        condition: service_completed_successfully
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: companion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["companion-postgres:/var/lib/postgresql"]
  atlas-migrate:
    image: arigaio/atlas:1.2.0-community-distroless@sha256:0527e6aaaf8078ca3398cac75209f8f43a13e96bc15b3dfdeffe7cef5451c96e
    command: ["migrate", "apply", "--dir", "file:///migrations", "--url", "postgres://companion:companion@postgres:5432/companion?sslmode=disable"]
    volumes: ["./db/postgres:/migrations:ro"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres-runtime-role:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    entrypoint: ["psql"]
    command: ["-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "companion", "-d", "companion", "--set=runtime_user=companion_app", "--set=runtime_password=companion_app_dev", "-f", "/ops/configure_runtime_role.psql"]
    environment:
      PGPASSWORD: companion
    volumes: ["./ops/postgres/configure_runtime_role.psql:/ops/configure_runtime_role.psql:ro"]
    depends_on:
      atlas-migrate:
        condition: service_completed_successfully

volumes:
  companion-data:
  companion-postgres:
