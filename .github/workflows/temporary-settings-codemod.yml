name: temporary-settings-codemod

on:
  push:
    branches:
      - feat/issue-197-device-settings

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/issue-197-device-settings
          fetch-depth: 0
      - name: Apply fail-closed settings patches
        run: python3 scripts/temporary_settings_codemod.py
      - name: Commit exact result and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(settings): wire truthful desired reported flow (#197)'
          git push origin HEAD:feat/issue-197-device-settings
