name: one-shot-plan07-test-contract

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase-03-settings-wake-plan07
          fetch-depth: 0
          persist-credentials: true
      - name: Upgrade fake repository contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("backend/internal/server/device_settings_test.go")
          text = p.read_text()
          if "func (r *fakeTwinRepo) RecordConfigReport" in text:
              print("fake settings report contract already applied")
              raise SystemExit(0)

          old_struct = '''type fakeTwinRepo struct {
          \tmu        sync.Mutex
          \ttwins     map[string]controlplane.Twin
          \tversion   int64
          \toverrides map[string]controlplane.RuntimeConfig
          }
          '''
          new_struct = '''type fakeTwinRepo struct {
          \tmu        sync.Mutex
          \ttwins     map[string]controlplane.Twin
          \tmetadata  map[string]controlplane.SettingsMetadata
          \tversion   int64
          \toverrides map[string]controlplane.RuntimeConfig
          }
          '''
          if text.count(old_struct) != 1:
              raise SystemExit("fake repo struct mismatch")
          text = text.replace(old_struct, new_struct, 1)

          old_ctor = '''\treturn &fakeTwinRepo{
          \t\ttwins:     make(map[string]controlplane.Twin),
          \t\toverrides: make(map[string]controlplane.RuntimeConfig),
          \t}
          '''
          new_ctor = '''\treturn &fakeTwinRepo{
          \t\ttwins:     make(map[string]controlplane.Twin),
          \t\tmetadata:  make(map[string]controlplane.SettingsMetadata),
          \t\toverrides: make(map[string]controlplane.RuntimeConfig),
          \t}
          '''
          if text.count(old_ctor) != 1:
              raise SystemExit("fake repo constructor mismatch")
          text = text.replace(old_ctor, new_ctor, 1)

          set_start = text.index("func (r *fakeTwinRepo) SetDesired(")
          report_start = text.index("func (r *fakeTwinRepo) Report(", set_start)
          set_block = text[set_start:report_start]
          old_tail = '''\ttwin.UpdatedAt = time.Now().UTC()
          \tr.twins[deviceID] = twin
          \treturn twin, nil
          }

          '''
          new_tail = '''\tnow := time.Now().UTC()
          \ttwin.UpdatedAt = now
          \tr.twins[deviceID] = twin
          \tmeta := r.metadata[deviceID]
          \tmeta.DesiredVersion = twin.DesiredVersion
          \tmeta.ReportedVersion = twin.ReportedVersion
          \tmeta.DesiredAt = now
          \tr.metadata[deviceID] = meta
          \treturn twin, nil
          }

          '''
          if set_block.count(old_tail) != 1:
              raise SystemExit("SetDesired tail mismatch")
          set_block = set_block.replace(old_tail, new_tail, 1)
          text = text[:set_start] + set_block + text[report_start:]

          report_start = text.index("func (r *fakeTwinRepo) Report(")
          next_start = text.index("func newSettingsTestSession", report_start)
          new_report = '''func (r *fakeTwinRepo) Report(ctx context.Context, userID, deviceID string, version int64, config controlplane.RuntimeConfig) error {
          \treturn r.RecordConfigReport(ctx, userID, deviceID, controlplane.ConfigReportResult{
          \t\tVersion: version, Applied: true, Config: config, ReportedAt: time.Now().UTC(),
          \t})
          }

          func (r *fakeTwinRepo) RecordConfigReport(_ context.Context, userID, deviceID string, result controlplane.ConfigReportResult) error {
          \tr.mu.Lock()
          \tdefer r.mu.Unlock()
          \ttwin, ok := r.twins[deviceID]
          \tif !ok {
          \t\ttwin = controlplane.Twin{DeviceID: deviceID, UserID: userID}
          \t}
          \tif twin.UserID != userID {
          \t\treturn fmt.Errorf("device owner mismatch")
          \t}
          \tif result.Version > twin.DesiredVersion {
          \t\treturn fmt.Errorf("reported config version ahead of desired")
          \t}
          \tmeta := r.metadata[deviceID]
          \tif result.Version < meta.LastReportVersion {
          \t\treturn nil
          \t}
          \tif !result.Applied && result.Version <= twin.ReportedVersion {
          \t\treturn nil
          \t}
          \tif result.Applied && result.Version < twin.ReportedVersion {
          \t\treturn nil
          \t}
          \treportedAt := result.ReportedAt.UTC()
          \tif result.ReportedAt.IsZero() {
          \t\treportedAt = time.Now().UTC()
          \t}
          \tif result.Applied {
          \t\ttwin.Reported = result.Config
          \t\ttwin.ReportedVersion = result.Version
          \t\ttwin.UpdatedAt = reportedAt
          \t\tr.twins[deviceID] = twin
          \t\tmeta.ReportedVersion = result.Version
          \t\tmeta.LastReportState = controlplane.SettingsApplied
          \t\tmeta.FailureCode = ""
          \t} else {
          \t\tmeta.LastReportState = controlplane.SettingsRejected
          \t\tmeta.FailureCode = result.FailureCode
          \t}
          \tmeta.DesiredVersion = twin.DesiredVersion
          \tif meta.DesiredAt.IsZero() {
          \t\tmeta.DesiredAt = twin.UpdatedAt
          \t}
          \tmeta.LastReportVersion = result.Version
          \tmeta.ReportedAt = &reportedAt
          \tr.metadata[deviceID] = meta
          \treturn nil
          }

          func (r *fakeTwinRepo) SettingsMetadata(_ context.Context, userID, deviceID string) (controlplane.SettingsMetadata, error) {
          \tr.mu.Lock()
          \tdefer r.mu.Unlock()
          \ttwin, ok := r.twins[deviceID]
          \tif !ok {
          \t\treturn controlplane.SettingsMetadata{}, fmt.Errorf("device not found")
          \t}
          \tif twin.UserID != userID {
          \t\treturn controlplane.SettingsMetadata{}, fmt.Errorf("device owner mismatch")
          \t}
          \tmeta := r.metadata[deviceID]
          \tmeta.DesiredVersion = twin.DesiredVersion
          \tmeta.ReportedVersion = twin.ReportedVersion
          \tif meta.DesiredAt.IsZero() {
          \t\tmeta.DesiredAt = twin.UpdatedAt
          \t}
          \treturn meta, nil
          }

          var _ controlplane.SettingsReportRepository = (*fakeTwinRepo)(nil)

          '''
          text = text[:report_start] + new_report + text[next_start:]

          old_assert = 'if args.Version != 1 || args.Settings.WakeModel != "hilexin" || args.Settings.Locale != "vi-VN" {'
          new_assert = 'if args.Version != 1 || args.Settings.WakeModel != "hilexin" || args.Settings.Locale != "" {'
          if text.count(old_assert) != 1:
              raise SystemExit("happy apply device-owned projection assertion mismatch")
          text = text.replace(old_assert, new_assert, 1)

          if text.count("func newSettingsTestSession") != 1:
              raise SystemExit("unexpected settings test helper structure")
          p.write_text(text)
          PY
          (cd backend && gofmt -w internal/server/device_settings_test.go)
          git diff --check
      - name: Commit test contract patch if needed
        run: |
          set -euo pipefail
          git config user.name "ai-companion-plan07-bot"
          git config user.email "ai-companion-plan07-bot@users.noreply.github.com"
          git add backend/internal/server/device_settings_test.go
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "settings test contract already applied"
            exit 0
          fi
          git commit -m "test(settings): model durable settings report contract"
          git push origin HEAD:feat/phase-03-settings-wake-plan07
