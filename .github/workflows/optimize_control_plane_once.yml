name: optimize-control-plane-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize_control_plane_once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimize-control-plane-once
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      RULESET_ID: '20785214'
    steps:
      - name: Verify settings and clean exact merged-head branches
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}" || {
            echo "::error::PROJECT_TOKEN is unavailable; repository was not changed."
            exit 1
          }

          repo="${GITHUB_REPOSITORY}"
          repo_api="https://api.github.com/repos/${repo}"
          ruleset_api="${repo_api}/rulesets/${RULESET_ID}"
          headers=(
            -H "Authorization: Bearer ${ADMIN_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          ruleset="$(curl -fsSL "${headers[@]}" "$ruleset_api")"
          jq -e '
            .id == 20785214 and
            .name == "second rule" and
            .target == "branch" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/heads/main"] and
            .conditions.ref_name.exclude == [] and
            [.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]] == [
              {"context":"PR Gate","integration_id":15368}
            ] and
            (.rules[] | select(.type == "required_status_checks") | .parameters.strict_required_status_checks_policy) == true and
            (.rules[] | select(.type == "required_status_checks") | .parameters.do_not_enforce_on_create) == false
          ' <<<"$ruleset" >/dev/null

          repo_state="$(curl -fsSL "${headers[@]}" "$repo_api")"
          jq -e '.delete_branch_on_merge == true and .allow_auto_merge == true' <<<"$repo_state" >/dev/null

          work=/tmp/control-plane-cleanup
          rm -rf "$work"
          mkdir -p "$work/closed" "$work/branches"
          curl -fsSL "${headers[@]}" "${repo_api}/pulls?state=open&per_page=100" > "$work/open.json"

          page=1
          while :; do
            file="$work/closed/${page}.json"
            curl -fsSL "${headers[@]}" "${repo_api}/pulls?state=closed&per_page=100&page=${page}" > "$file"
            count="$(jq 'length' "$file")"
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done
          jq -s 'add' "$work"/closed/*.json > "$work/closed.json"

          page=1
          while :; do
            file="$work/branches/${page}.json"
            curl -fsSL "${headers[@]}" "${repo_api}/branches?per_page=100&page=${page}" > "$file"
            count="$(jq 'length' "$file")"
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done
          jq -s 'add' "$work"/branches/*.json > "$work/branches.json"

          deleted=0
          kept=0
          while IFS=$'\t' read -r branch sha; do
            [[ -z "$branch" ]] && continue
            if [[ "$branch" == "main" ]]; then
              kept=$((kept + 1))
              continue
            fi
            if jq -e --arg branch "$branch" 'any(.[]; .head.ref == $branch)' "$work/open.json" >/dev/null; then
              echo "keep open-PR branch: $branch"
              kept=$((kept + 1))
              continue
            fi
            if ! jq -e --arg branch "$branch" --arg sha "$sha" \
              'any(.[]; .merged_at != null and .head.ref == $branch and .head.sha == $sha)' \
              "$work/closed.json" >/dev/null; then
              echo "keep unproven branch: $branch"
              kept=$((kept + 1))
              continue
            fi

            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
            curl -fsSL -X DELETE "${headers[@]}" "${repo_api}/git/refs/heads/${encoded}"
            echo "deleted exact merged-head branch: $branch @ $sha"
            deleted=$((deleted + 1))
          done < <(jq -r '.[] | [.name, .commit.sha] | @tsv' "$work/branches.json")

          {
            echo "## GitHub control-plane optimization"
            echo
            echo "- ruleset: ${RULESET_ID} (second rule)"
            echo "- required checks: PR Gate only"
            echo "- strict up-to-date policy: preserved"
            echo "- delete branch on merge: enabled"
            echo "- auto-merge capability: enabled"
            echo "- stale exact merged-head branches deleted: ${deleted}"
            echo "- branches preserved: ${kept}"
          } >> "$GITHUB_STEP_SUMMARY"
