name: issue25-guarded-apply

on:
  push:
    branches: [agent/issue-25-observability]
    paths: [.github/workflows/issue25-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-25-observability
          fetch-depth: 0
      - name: Guard target branch
        run: test "$GITHUB_REF_NAME" = "agent/issue-25-observability"
      - name: Apply exact-state patch
        run: python3 scripts/issue25_apply.py
      - name: Format Go sources and check diff
        run: |
          gofmt -w backend/internal/observability/*.go backend/internal/capability/tool.go backend/internal/server/server.go backend/cmd/companiond/main.go
          git diff --check
      - name: Commit implementation and remove migration helpers
        run: |
          git config user.name "Diệp Gia Huy"
          git config user.email "30974088+diepgiahuy@users.noreply.github.com"
          git rm .github/workflows/issue25-apply.yml scripts/issue25_apply.py
          git add README.md backend/cmd/companiond/main.go backend/internal/capability/tool.go backend/internal/server/server.go host/companion_software_device/run_e2e.sh
          git diff --cached --check
          git commit -m "feat: instrument production observability contract"
          git push origin HEAD:agent/issue-25-observability
