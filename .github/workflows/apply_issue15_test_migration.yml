name: Apply issue-15 server test migration

on:
  push:
    branches:
      - issue-15-adk-auth-hard-cut
    paths:
      - scripts/migrate_issue15_server_tests.py
      - .github/workflows/apply_issue15_test_migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout phase-B branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-15-adk-auth-hard-cut
          fetch-depth: 0
      - name: Migrate server tests to explicit auth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/migrate_issue15_server_tests.py
          gofmt -w backend/internal/server/*_test.go
          ! grep -n 'TestExpenseBudgetFullE2EThroughQwenRegistryAndUI' backend/internal/server/server_test.go
          ! grep -n 'service := New(pipeline.Components' backend/internal/server/server_test.go
          ! grep -n 'websocket.Dial(' backend/internal/server/server_test.go
          git diff --check
          rm scripts/migrate_issue15_server_tests.py
          git add -A
          git commit -m "test: migrate server suite to enrolled-auth contract"
          git push origin HEAD:issue-15-adk-auth-hard-cut
