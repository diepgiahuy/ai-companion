name: Apply issue-15 Tier-1 auth migration

on:
  push:
    branches:
      - issue-15-adk-auth-hard-cut
    paths:
      - scripts/migrate_issue15_software_device_auth.py
      - .github/workflows/apply_issue15_software_device_auth.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout phase-B branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-15-adk-auth-hard-cut
          fetch-depth: 0
      - name: Migrate software-device to enrolled credentials
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/migrate_issue15_software_device_auth.py
          ! grep -n -- '--token' host/companion_software_device/main.cpp
          ! grep -n 'tier1-device-token' host/companion_software_device/main.cpp
          grep -q 'enrolled_auth_rejects_wrong_and_revoked' host/companion_software_device/main.cpp
          git diff --check
          rm scripts/migrate_issue15_software_device_auth.py
          git add -A
          git commit -m "test: use enrolled credentials in Tier-1 device harness"
          git push origin HEAD:issue-15-adk-auth-hard-cut
