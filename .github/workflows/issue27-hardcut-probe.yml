name: issue27-hardcut-probe

on:
  push:
    branches: [agent/issue-27-native-slice]
    paths: [.github/workflows/issue27-hardcut-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-27-native-slice
      - name: Apply hard-cut candidate in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          store=root/'backend/internal/store/store.go'; s=store.read_text(); needle='idempotency_key TEXT NOT NULL UNIQUE'
          if s.count(needle)!=5: raise SystemExit(f'store unique drifted: {s.count(needle)}')
          s=s.replace(needle,'idempotency_key TEXT NOT NULL')
          marker='\tindexes := []string{'
          if s.count(marker)!=1: raise SystemExit('store migration point drifted')
          s=s.replace(marker,'\tif err := s.migrateIdempotency(); err != nil {\n\t\treturn err\n\t}\n\tindexes := []string{')
          store.write_text(s)

          platform=root/'backend/internal/store/platform.go'; p=platform.read_text()
          if p.count(needle)!=1: raise SystemExit(f'market unique drifted: {p.count(needle)}')
          p=p.replace(needle,'idempotency_key TEXT NOT NULL')
          old='''\tfor _, q := range stmts {\n\t\tif _, err := s.db.Exec(q); err != nil {\n\t\t\treturn fmt.Errorf("platform migration: %w", err)\n\t\t}\n\t}\n\tfor _, c := range []struct{ table, column, alter string }{'''
          new='''\tfor _, q := range stmts {\n\t\tif _, err := s.db.Exec(q); err != nil {\n\t\t\treturn fmt.Errorf("platform migration: %w", err)\n\t\t}\n\t}\n\tif err := s.migrateMarketWatchIdempotencyUniqueness(); err != nil {\n\t\treturn err\n\t}\n\tfor _, c := range []struct{ table, column, alter string }{'''
          if p.count(old)!=1: raise SystemExit('market migration point drifted')
          platform.write_text(p.replace(old,new))

          (root/'backend/internal/store/legacy_idempotency.go').write_text(r'''package store
          import (
            "context"
            "database/sql"
            "fmt"
            "strings"
            "time"
            "companion-server/internal/idempotency"
          )
          const legacyIdempotencyDDL = `CREATE TABLE IF NOT EXISTS legacy_idempotency_reservations (scope TEXT NOT NULL,user_id TEXT NOT NULL,idempotency_key TEXT NOT NULL,created_at TEXT NOT NULL,PRIMARY KEY(scope,user_id,idempotency_key))`
          func captureLegacyIdempotencyRows(tx *sql.Tx, table string) error {
            now:=time.Now().UTC().Format(time.RFC3339Nano)
            q:=fmt.Sprintf(`INSERT OR IGNORE INTO legacy_idempotency_reservations(scope,user_id,idempotency_key,created_at) SELECT ?,user_id,idempotency_key,? FROM %s WHERE TRIM(idempotency_key)!=''`,table)
            _,err:=tx.Exec(q,table,now); return err
          }
          func (s *Store) rejectLegacyIdempotencyKey(ctx context.Context, scope,userID string, request idempotency.Request, batch bool) error {
            userID,key:=owner(userID),strings.TrimSpace(request.Key); var one int; var err error
            if batch { err=s.db.QueryRowContext(ctx,`SELECT 1 FROM legacy_idempotency_reservations WHERE scope=? AND user_id=? AND (idempotency_key=? OR substr(idempotency_key,1,length(?)+1)=?||':') LIMIT 1`,scope,userID,key,key,key).Scan(&one) } else { err=s.db.QueryRowContext(ctx,`SELECT 1 FROM legacy_idempotency_reservations WHERE scope=? AND user_id=? AND idempotency_key=? LIMIT 1`,scope,userID,key).Scan(&one) }
            if err==nil { return idempotency.Conflict{Operation:request.Operation,Key:key} }; if err==sql.ErrNoRows { return nil }; return err
          }
          ''')

          idem=root/'backend/internal/store/idempotency.go'; x=idem.read_text()
          old='''func (s *Store) migrateIdempotency() error {\n\tif _, err := s.db.Exec(idempotencyLedgerDDL); err != nil {\n\t\treturn fmt.Errorf("idempotency ledger migration: %w", err)\n\t}\n\treturn nil\n}'''
          new='''func (s *Store) migrateIdempotency() error {\n\tif _, err := s.db.Exec(idempotencyLedgerDDL); err != nil { return fmt.Errorf("idempotency ledger migration: %w", err) }\n\tif _, err := s.db.Exec(legacyIdempotencyDDL); err != nil { return fmt.Errorf("legacy idempotency reservation migration: %w", err) }\n\treturn s.migrateLegacyIdempotencyUniqueness()\n}'''
          if x.count(old)!=1: raise SystemExit('idempotency migration drifted')
          idem.write_text(x.replace(old,new))

          run=root/'backend/internal/store/idempotency_run.go'; x=run.read_text(); old='''\tif err := s.migrateIdempotency(); err != nil {\n\t\treturn idempotentOutcome{}, err\n\t}\n'''
          if x.count(old)!=1: raise SystemExit('lazy migration drifted')
          run.write_text(x.replace(old,''))

          schema=root/'backend/internal/store/idempotency_schema.go'; x=schema.read_text(); old='''\tdefer tx.Rollback()\n\tlegacy := migration.Table + "__legacy_global_idempotency"'''; new='''\tdefer tx.Rollback()\n\tif err := captureLegacyIdempotencyRows(tx, migration.Table); err != nil { return err }\n\tlegacy := migration.Table + "__legacy_global_idempotency"'''
          if x.count(old)!=1: raise SystemExit('schema capture drifted')
          schema.write_text(x.replace(old,new))

          checks={
            'backend/internal/store/idempotent_domain.go':[
              ('func (s *Store) CreateExpenseMutation(ctx context.Context, request idempotency.Request, userID string, amount int64, category, description string, occurredAt time.Time) error {','\n\tif err := s.rejectLegacyIdempotencyKey(ctx,"expenses",userID,request,true); err != nil { return err }'),
              ('func (s *Store) CreateExpensesMutation(ctx context.Context, request idempotency.Request, userID string, items []domain.ExpenseInput) error {','\n\tif err := s.rejectLegacyIdempotencyKey(ctx,"expenses",userID,request,true); err != nil { return err }'),
              ('func (s *Store) CreateNoteMutation(ctx context.Context, request idempotency.Request, userID, content string) error {','\n\tif err := s.rejectLegacyIdempotencyKey(ctx,"notes",userID,request,false); err != nil { return err }'),
              ('func (s *Store) CreateJournalMutation(ctx context.Context, request idempotency.Request, userID, content string, occurredAt time.Time) error {','\n\tif err := s.rejectLegacyIdempotencyKey(ctx,"journal_entries",userID,request,false); err != nil { return err }'),
              ('func (s *Store) createScheduledMutation(ctx context.Context, request idempotency.Request, operation, userID, deviceID, kind, title string, fireAt time.Time) (domain.ScheduledItem, error) {','\n\tif err := s.rejectLegacyIdempotencyKey(ctx,"reminders",userID,request,false); err != nil { return domain.ScheduledItem{}, err }'),
            ],
            'backend/internal/store/idempotent_voice_context.go':[(
              'func (s *Store) CreateVoiceMemoMutation(ctx context.Context, request idempotency.Request, userID, deviceID, path, transcript string, durationMS int64) (domain.VoiceMemo, error) {','\n\tif err := s.rejectLegacyIdempotencyKey(ctx,"voice_memos",userID,request,false); err != nil { return domain.VoiceMemo{}, err }')],
            'backend/internal/store/idempotent_platform.go':[(
              'func (s *Store) CreateMarketWatchMutation(ctx context.Context, request idempotency.Request, user, device, provider, symbol, currency, operator string, threshold float64) (market.Watch, error) {','\n\tif err := s.rejectLegacyIdempotencyKey(ctx,"market_watches",user,request,false); err != nil { return market.Watch{}, err }')],
          }
          for name,ps in checks.items():
            path=root/name; text=path.read_text()
            for sig,extra in ps:
              if text.count(sig)!=1: raise SystemExit(f'{name} signature drift')
              text=text.replace(sig,sig+extra)
            path.write_text(text)
          print('hard-cut candidate applied in runner only')
          PY
      - name: Test hard-cut candidate
        run: |
          docker build -f Dockerfile.test -t issue27-hardcut-probe .
          docker run --rm -v "$PWD:/src" -w /src issue27-hardcut-probe bash -c 'gofmt -w backend/internal/store && cd backend && go test ./internal/idempotency ./internal/store ./internal/providers/tools && go test -race ./internal/store ./internal/providers/tools'
