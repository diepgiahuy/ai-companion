name: one-shot-plan07-truth-cleanup

on:
  push:
    branches: [feat/phase-03-settings-wake-plan07]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase-03-settings-wake-plan07
          fetch-depth: 0
          persist-credentials: true
      - name: Apply fail-closed truth cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('backend/internal/ownerweb/dashboard.html')
          html = html_path.read_text()
          replacements = [
              ('''  try {
    const res = await mutate('/v1/owner/data/device/config', 'POST', { device_id: selectedDeviceID, ota_poll_interval: val });
    const data = await res.json();
    banner.innerHTML = `✅ Interval updated to <b>${val}</b> for ${selectedDeviceID}.`;
  } catch (e) {
    banner.textContent = 'Failed to update interval';
  }
''', '''  try {
    const res = await mutate('/v1/owner/data/device/config', 'POST', { device_id: selectedDeviceID, ota_poll_interval: val });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok || !data?.ok) {
      banner.textContent = data?.error || `Failed to update interval (${res.status})`;
      return;
    }
    const state = data?.settings_status?.state || 'requested';
    const desired = data?.settings_status?.desired_version ?? data?.twin?.desired_version ?? '?';
    const reported = data?.settings_status?.reported_version ?? data?.twin?.reported_version ?? '?';
    banner.innerHTML = `Settings <b>${state}</b> for ${selectedDeviceID} • desired ${desired} • reported ${reported}`;
  } catch (e) {
    banner.textContent = 'Failed to update interval';
  }
'''),
              ('''async function checkOTA() {
  const banner = document.getElementById('ota-status-banner');
  banner.textContent = 'Checking for latest signed firmware releases...';
  setTimeout(() => {
    banner.innerHTML = `✨ <b>New Firmware Available: v2.4.1 (Stable)</b> • SHA256 verified • Size: 1.42 MiB`;
  }, 600);
}
''', '''async function checkOTA() {
  const banner = document.getElementById('ota-status-banner');
  banner.textContent = 'OTA release lookup is not wired into Owner Hub yet; no update claim was made.';
}
'''),
              ('''async function triggerOTA() {
  const banner = document.getElementById('ota-status-banner');
  if (!selectedDeviceID) {
    banner.textContent = 'No owned device selected';
    return;
  }
  banner.textContent = 'Pushing OTA trigger to device twin...';
  try {
    const res = await mutate('/v1/owner/data/device/ota-trigger', 'POST', { device_id: selectedDeviceID, target_version: 'v2.4.1' });
    const data = await res.json();
    banner.innerHTML = `🚀 <b>Update Command Sent!</b> Device twin will download <code>v2.4.1</code> to inactive partition on next sync.`;
  } catch (e) {
    banner.textContent = 'Failed to trigger OTA';
  }
}
''', '''async function triggerOTA() {
  const banner = document.getElementById('ota-status-banner');
  if (!selectedDeviceID) {
    banner.textContent = 'No owned device selected';
    return;
  }
  banner.textContent = 'OTA push is not wired into Owner Hub yet; no command was sent.';
}
'''),
          ]
          for old, new in replacements:
              n = html.count(old)
              if n != 1:
                  raise SystemExit(f'dashboard exact replacement count={n} for {old[:80]!r}')
              html = html.replace(old, new, 1)
          for residue in ('✅ Interval updated to <b>${val}</b>', 'New Firmware Available: v2.4.1', 'Update Command Sent!'):
              if residue in html:
                  raise SystemExit(f'fake Owner Hub residue remains: {residue}')
          html_path.write_text(html)

          go_path = Path('backend/internal/ownerweb/dashboard.go')
          go = go_path.read_text()
          old = '''func (h *Handler) handleTriggerOTA(w http.ResponseWriter, r *http.Request) {
	userID, ok := h.userID(r)
	if !ok || userID == "" {
		http.Error(w, "unauthorized", http.StatusUnauthorized)
		return
	}
	var req struct {
		DeviceID   string `json:"device_id"`
		TargetSlot string `json:"target_slot"`
	}
	if err := json.NewDecoder(r.Body).Decode(&req); err != nil || req.DeviceID == "" {
		http.Error(w, "device_id is required", http.StatusBadRequest)
		return
	}

	writeJSON(w, map[string]any{
		"ok":          true,
		"device_id":   req.DeviceID,
		"target_slot": "ota_1",
		"version":     "v2.4.1",
		"message":     "Firmware OTA trigger dispatched",
	})
}
'''
          new = '''func (h *Handler) handleTriggerOTA(w http.ResponseWriter, r *http.Request) {
	userID, ok := h.userID(r)
	if !ok || userID == "" {
		http.Error(w, "unauthorized", http.StatusUnauthorized)
		return
	}
	// PLAN 07A must not fabricate OTA promotion state. The real release lookup,
	// signed manifest selection and device command path are qualified separately.
	http.Error(w, "OTA trigger is not wired into Owner Hub", http.StatusNotImplemented)
}
'''
          n = go.count(old)
          if n != 1:
              raise SystemExit(f'handleTriggerOTA exact replacement count={n}')
          go = go.replace(old, new, 1)
          for residue in ('"version":     "v2.4.1"', '"Firmware OTA trigger dispatched"'):
              if residue in go:
                  raise SystemExit(f'fake backend OTA residue remains: {residue}')
          go_path.write_text(go)
          PY
          git rm -f backend/internal/ownerweb/dashboard_settings_truth.go backend/internal/ownerweb/dashboard_settings_truth_test.go
          git rm -f .github/workflows/one-shot-plan07-truth-cleanup.yml
          git diff --check
      - name: Commit source cleanup
        run: |
          set -euo pipefail
          git config user.name "ai-companion-plan07-bot"
          git config user.email "ai-companion-plan07-bot@users.noreply.github.com"
          git add backend/internal/ownerweb/dashboard.html backend/internal/ownerweb/dashboard.go
          git diff --cached --check
          git commit -m "fix(settings): remove optimistic Owner Hub and fake OTA state"
          git push origin HEAD:feat/phase-03-settings-wake-plan07
