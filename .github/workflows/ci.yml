name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.head_ref || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.classify.outputs.e2e }}
      backend: ${{ steps.classify.outputs.backend }}
      codeql: ${{ steps.classify.outputs.codeql }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - name: Checkout for diff classification
        if: github.event_name != 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          e2e=false
          backend=false
          codeql=false
          deps=false

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            codeql=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            e2e=true
            backend=true
            codeql=true
          elif [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            e2e=true
            backend=true
            codeql=true
            deps=true
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/ci-changed-files.txt
            cat /tmp/ci-changed-files.txt
            while IFS= read -r file; do
              case "$file" in
                components/*|host/*|testdata/*|CMakeLists.txt|partitions.csv|scripts/e2e.sh|scripts/budget_check.py|compose.e2e.yaml|Dockerfile.test|.github/workflows/ci.yml)
                  e2e=true
                  ;;
              esac
              case "$file" in
                backend/*|db/postgres/*|ops/postgres/*|testdata/*|Dockerfile.test|.github/workflows/ci.yml)
                  backend=true
                  ;;
              esac
              case "$file" in
                backend/*|Dockerfile.test|.github/workflows/ci.yml)
                  codeql=true
                  ;;
              esac
              case "$file" in
                backend/go.mod|backend/go.sum|go.work|go.work.sum|Dockerfile*|.github/workflows/*.yml)
                  deps=true
                  ;;
              esac
            done < /tmp/ci-changed-files.txt
          fi

          {
            echo "e2e=$e2e"
            echo "backend=$backend"
            echo "codeql=$codeql"
            echo "deps=$deps"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## CI scope"
            echo
            echo "- host e2e: $e2e"
            echo "- backend quality: $backend"
            echo "- CodeQL Go: $codeql"
            echo "- dependency review: $deps"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Evidence truth gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate production evidence claims
        run: python3 scripts/check_evidence.py
      - name: Enforce single product runtime/auth/transport path
        run: python3 scripts/check_single_path.py

  e2e:
    name: e2e
    needs: scope
    if: github.event_name != 'schedule' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail closed if CI scope classification failed
        if: needs.scope.result != 'success'
        run: exit 1
      - name: Record skipped host E2E
        if: needs.scope.result == 'success' && needs.scope.outputs.e2e != 'true'
        run: |
          echo "Host/software E2E skipped: no host, component, CMake, partition, testdata, or E2E-container inputs changed." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        if: needs.scope.result == 'success' && needs.scope.outputs.e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exact Go 1.26.6 + production dependency E2E
        if: needs.scope.result == 'success' && needs.scope.outputs.e2e == 'true'
        run: make e2e-container

  backend-quality:
    name: Go reproducibility, vet, race, vulnerabilities
    needs: scope
    if: github.event_name != 'schedule' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fail closed if CI scope classification failed
        if: needs.scope.result != 'success'
        run: exit 1
      - name: Record skipped backend quality
        if: needs.scope.result == 'success' && needs.scope.outputs.backend != 'true'
        run: |
          echo "Backend quality skipped: no backend, PostgreSQL, testdata, toolchain, or CI inputs changed." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        if: needs.scope.result == 'success' && needs.scope.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact Go 1.26.6 test image
        if: needs.scope.result == 'success' && needs.scope.outputs.backend == 'true'
        run: docker build --pull -f Dockerfile.test -t companion-quality .
      - name: Module reproducibility and verification
        if: needs.scope.result == 'success' && needs.scope.outputs.backend == 'true'
        run: |
          docker run --rm companion-quality sh -c '
            set -eu
            cd /src/backend
            cp go.mod /tmp/go.mod.before
            cp go.sum /tmp/go.sum.before
            go mod tidy
            cmp go.mod /tmp/go.mod.before
            cmp go.sum /tmp/go.sum.before
            go mod verify
          '
      - name: Vet and race production adapter tags
        if: needs.scope.result == 'success' && needs.scope.outputs.backend == 'true'
        run: |
          docker run --rm companion-quality sh -c '
            set -eu
            cd /src/backend
            go vet -tags "adk,mcp,nolibopusfile" ./...
            go test -tags "adk,mcp,nolibopusfile" -race -count=1 ./...
          '
      - name: Go vulnerability reachability scan
        if: needs.scope.result == 'success' && needs.scope.outputs.backend == 'true'
        run: |
          set -euo pipefail
          docker run --rm companion-quality sh -c '
            set -eu
            export GOBIN=/tmp/go-tools
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
            cd /src/backend
            /tmp/go-tools/govulncheck -scan symbol -tags=adk,mcp,nolibopusfile -test ./...
          '
      - name: Diff hygiene
        if: needs.scope.result == 'success' && needs.scope.outputs.backend == 'true'
        run: git diff --check

  dependency-review:
    name: Dependency review
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.scope.outputs.deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe Dependency Graph capability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          if curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$endpoint" >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is unavailable for this repository; dependency-review is UNAVAILABLE, not PASS."
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  codeql-go:
    name: CodeQL Go
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Fail closed if CI scope classification failed
        if: needs.scope.result != 'success'
        run: exit 1
      - name: Record skipped CodeQL
        if: needs.scope.result == 'success' && needs.scope.outputs.codeql != 'true'
        run: |
          echo "CodeQL Go skipped: no Go/backend/toolchain/CI inputs changed." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        if: needs.scope.result == 'success' && needs.scope.outputs.codeql == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up exact Go toolchain
        if: needs.scope.result == 'success' && needs.scope.outputs.codeql == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - name: Install native build dependencies
        if: needs.scope.result == 'success' && needs.scope.outputs.codeql == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev
      - name: Initialize CodeQL
        if: needs.scope.result == 'success' && needs.scope.outputs.codeql == 'true'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: go
          build-mode: manual
      - name: Build production adapter tags under CodeQL tracing
        if: needs.scope.result == 'success' && needs.scope.outputs.codeql == 'true'
        working-directory: backend
        run: go build -tags "adk,mcp,nolibopusfile" ./...
      - name: Analyze
        if: needs.scope.result == 'success' && needs.scope.outputs.codeql == 'true'
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:go
