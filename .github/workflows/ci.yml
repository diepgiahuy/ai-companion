name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

# PR runs cancel superseded heads. Main-promotion runs are keyed by SHA so one
# candidate cannot cancel evidence for a different candidate in this workflow.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Evidence truth gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      host: ${{ steps.classify.outputs.host }}
      software_device_compile: ${{ steps.classify.outputs.software_device_compile }}
      backend: ${{ steps.classify.outputs.backend }}
      backend_full: ${{ steps.classify.outputs.backend_full }}
      codeql: ${{ steps.classify.outputs.codeql }}
      postgres: ${{ steps.classify.outputs.postgres }}
      protocol: ${{ steps.classify.outputs.protocol }}
      tier1: ${{ steps.classify.outputs.tier1 }}
      promotion: ${{ steps.classify.outputs.promotion }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout for classification and evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths and risk
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          : > /tmp/ci-changed-files.txt
          unknown_changes=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ || -z "${HEAD_SHA:-}" ]]; then
              unknown_changes=true
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              unknown_changes=true
            elif ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/ci-changed-files.txt; then
              unknown_changes=true
              : > /tmp/ci-changed-files.txt
            else
              cat /tmp/ci-changed-files.txt
            fi
          fi

          args=(
            --event "$EVENT_NAME"
            --files-file /tmp/ci-changed-files.txt
            --github-output "$GITHUB_OUTPUT"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$unknown_changes" == "true" ]]; then
            args+=(--unknown-changes)
          fi
          python3 scripts/ci_scope.py "${args[@]}"

      - name: Test CI classification policy
        run: python3 scripts/test_ci_scope.py

      - name: Validate production evidence claims
        if: github.event_name != 'schedule'
        run: python3 scripts/check_evidence.py

      - name: Enforce single product runtime/auth/transport path
        if: github.event_name != 'schedule'
        run: python3 scripts/check_single_path.py

  host:
    name: Host component tests
    needs: prepare
    if: >-
      github.event_name != 'schedule' &&
      always() &&
      (needs.prepare.result != 'success' || needs.prepare.outputs.host == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed if classification failed
        if: needs.prepare.result != 'success'
        run: exit 1

      - name: Checkout
        if: needs.prepare.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host dependencies
        if: needs.prepare.result == 'success'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOFTWARE_DEVICE_COMPILE: ${{ needs.prepare.outputs.software_device_compile }}
        run: |
          set -euo pipefail
          packages=(ninja-build pkg-config libopus-dev libopusfile-dev)
          if [[ "$EVENT_NAME" == "pull_request" && "$SOFTWARE_DEVICE_COMPILE" == "true" ]]; then
            packages+=(libboost-system-dev nlohmann-json3-dev libssl-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Run host component and integration tests
        if: needs.prepare.result == 'success'
        run: bash scripts/e2e.sh

      - name: Compile Tier-1 software-device nearest oracle
        if: >-
          needs.prepare.result == 'success' &&
          github.event_name == 'pull_request' &&
          needs.prepare.outputs.software_device_compile == 'true'
        run: |
          cmake -S host/companion_software_device -B build-software-device -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-software-device --target companion_software_device

  backend-quality:
    name: Go backend quality
    needs: prepare
    if: >-
      github.event_name != 'schedule' &&
      always() &&
      (needs.prepare.result != 'success' || needs.prepare.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fail closed if classification failed
        if: needs.prepare.result != 'success'
        run: exit 1

      - name: Checkout
        if: needs.prepare.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain for targeted mode
        if: needs.prepare.result == 'success' && needs.prepare.outputs.backend_full != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Install targeted native dependency
        if: needs.prepare.result == 'success' && needs.prepare.outputs.backend_full != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev

      - name: Targeted backend tests
        if: needs.prepare.result == 'success' && needs.prepare.outputs.backend_full != 'true'
        run: bash scripts/backend_quality.sh fast

      - name: Set up Docker Buildx for broad mode
        if: needs.prepare.result == 'success' && needs.prepare.outputs.backend_full == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build cached broad quality image
        if: needs.prepare.result == 'success' && needs.prepare.outputs.backend_full == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: quality
          load: true
          pull: true
          tags: companion-test:quality
          cache-from: type=gha,scope=companion-quality
          cache-to: type=gha,mode=max,scope=companion-quality

      - name: Broad backend quality and security
        if: needs.prepare.result == 'success' && needs.prepare.outputs.backend_full == 'true'
        run: docker run --rm companion-test:quality bash scripts/backend_quality.sh full

      - name: Diff hygiene
        if: needs.prepare.result == 'success'
        run: git diff --check

  codeql-go:
    name: CodeQL Go
    needs: prepare
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        needs.prepare.result != 'success' ||
        needs.prepare.outputs.codeql == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Fail closed if classification failed
        if: needs.prepare.result != 'success'
        run: exit 1

      - name: Checkout
        if: needs.prepare.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        if: needs.prepare.result == 'success'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Install native build dependencies
        if: needs.prepare.result == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev

      - name: Initialize CodeQL
        if: needs.prepare.result == 'success'
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: go
          build-mode: manual

      - name: Build production adapter tags under CodeQL tracing
        if: needs.prepare.result == 'success'
        working-directory: backend
        run: go build -tags "adk,mcp,nolibopusfile" ./...

      - name: Analyze
        if: needs.prepare.result == 'success'
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:go

  postgres-gate:
    name: PostgreSQL / River integration
    needs: prepare
    if: >-
      github.event_name != 'schedule' &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.postgres == 'true'
    uses: ./.github/workflows/postgres-schema.yml

  protocol-gate:
    name: Protocol v2 firmware compile
    needs: prepare
    if: >-
      github.event_name != 'schedule' &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.protocol == 'true'
    uses: ./.github/workflows/protocol_v2.yml

  tier1-gate:
    name: Tier-1 software-device orchestration
    needs: prepare
    if: >-
      github.event_name != 'schedule' &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.tier1 == 'true'
    uses: ./.github/workflows/software-device-e2e.yml

  pr-gate:
    name: PR Gate
    needs: [prepare, host, backend-quality, codeql-go, postgres-gate, protocol-gate, tier1-gate]
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate targeted PR results
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          HOST_RESULT: ${{ needs.host.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          CODEQL_RESULT: ${{ needs.codeql-go.result }}
          POSTGRES_RESULT: ${{ needs.postgres-gate.result }}
          PROTOCOL_RESULT: ${{ needs.protocol-gate.result }}
          TIER1_RESULT: ${{ needs.tier1-gate.result }}
          HOST_REQUIRED: ${{ needs.prepare.outputs.host }}
          SOFTWARE_DEVICE_COMPILE_REQUIRED: ${{ needs.prepare.outputs.software_device_compile }}
          BACKEND_REQUIRED: ${{ needs.prepare.outputs.backend }}
          CODEQL_REQUIRED: ${{ needs.prepare.outputs.codeql }}
          POSTGRES_REQUIRED: ${{ needs.prepare.outputs.postgres }}
          PROTOCOL_REQUIRED: ${{ needs.prepare.outputs.protocol }}
          TIER1_REQUIRED: ${{ needs.prepare.outputs.tier1 }}
          CI_MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          set -euo pipefail
          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} expected success, got ${result}"
              exit 1
            fi
          }

          require_success "prepare/evidence" "$PREPARE_RESULT"
          [[ "$HOST_REQUIRED" != "true" ]] || require_success "host component tests" "$HOST_RESULT"
          [[ "$BACKEND_REQUIRED" != "true" ]] || require_success "backend quality" "$BACKEND_RESULT"
          [[ "$CODEQL_REQUIRED" != "true" ]] || require_success "CodeQL Go" "$CODEQL_RESULT"
          [[ "$POSTGRES_REQUIRED" != "true" ]] || require_success "PostgreSQL / River integration" "$POSTGRES_RESULT"
          [[ "$PROTOCOL_REQUIRED" != "true" ]] || require_success "Protocol firmware compile" "$PROTOCOL_RESULT"
          [[ "$TIER1_REQUIRED" != "true" ]] || require_success "Tier-1 software device" "$TIER1_RESULT"

          {
            echo "## PR Gate"
            echo
            echo "- mode: $CI_MODE"
            echo "- evidence: $PREPARE_RESULT"
            echo "- host tests: $HOST_RESULT"
            echo "- software-device compile required: $SOFTWARE_DEVICE_COMPILE_REQUIRED"
            echo "- backend: $BACKEND_RESULT"
            echo "- CodeQL: $CODEQL_RESULT"
            echo "- PostgreSQL/River: $POSTGRES_RESULT"
            echo "- protocol: $PROTOCOL_RESULT"
            echo "- Tier-1 software device: $TIER1_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  promotion-gate:
    name: Promotion Gate
    needs: [prepare, host, backend-quality, codeql-go, postgres-gate, protocol-gate, tier1-gate]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate broad promotion results
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          HOST_RESULT: ${{ needs.host.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          CODEQL_RESULT: ${{ needs.codeql-go.result }}
          POSTGRES_RESULT: ${{ needs.postgres-gate.result }}
          PROTOCOL_RESULT: ${{ needs.protocol-gate.result }}
          TIER1_RESULT: ${{ needs.tier1-gate.result }}
          PROMOTION_REQUIRED: ${{ needs.prepare.outputs.promotion }}
          CI_MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          set -euo pipefail
          require_success() {
            local name="$1" result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} expected success, got ${result}"
              exit 1
            fi
          }

          [[ "$PROMOTION_REQUIRED" == "true" ]] || {
            echo "::error::Promotion aggregation requested outside promotion mode: $CI_MODE"
            exit 1
          }
          require_success "prepare/evidence" "$PREPARE_RESULT"
          require_success "host component tests" "$HOST_RESULT"
          require_success "broad backend quality" "$BACKEND_RESULT"
          require_success "CodeQL Go" "$CODEQL_RESULT"
          require_success "PostgreSQL / River integration" "$POSTGRES_RESULT"
          require_success "Protocol firmware compile" "$PROTOCOL_RESULT"
          require_success "Tier-1 software device" "$TIER1_RESULT"

          {
            echo "## Promotion Gate"
            echo
            echo "- mode: $CI_MODE"
            echo "- commit: $GITHUB_SHA"
            echo "- evidence: $PREPARE_RESULT"
            echo "- host tests: $HOST_RESULT"
            echo "- backend full/race/vulnerability: $BACKEND_RESULT"
            echo "- CodeQL: $CODEQL_RESULT"
            echo "- PostgreSQL/River: $POSTGRES_RESULT"
            echo "- protocol: $PROTOCOL_RESULT"
            echo "- Tier-1 software device: $TIER1_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  model-free-tier-evidence:
    name: Gemma 4 zero-cost tool/action evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'test/23-run-free-tier-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_DIR: ${{ runner.temp }}/model-free-tier-evidence
    steps:
      - name: Checkout exact benchmark head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Verify zero-cost benchmark before provider use
        run: |
          set -euo pipefail
          cd backend
          go test ./eval ./cmd/eval-free-tier -count=1
          go test ./eval -run '^TestGemmaFreeRejectsBillableModels$' -count=1

      - name: Verify provider credential exists
        env:
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_TOKEN"
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/COST_POLICY.txt" <<'EOF'
          ZERO-SPEND POLICY
          - Only gemma-4-26b-a4b-it and gemma-4-31b-it may be called.
          - Paid-capable Gemini models are rejected before inference.
          - No priced provider tools are enabled.
          - Provider failures are not retried.
          - Corpus is synthetic/non-sensitive.
          EOF

      - name: Run both zero-cost Gemma candidates
        env:
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
        run: |
          set -u
          cd backend
          mkdir -p "$EVIDENCE_DIR"

          go run ./cmd/eval-free-tier \
            -model gemma-4-26b-a4b-it \
            -scenarios ./eval/tool_action_corpus.jsonl \
            -runs 1 \
            -run-id "${SOURCE_SHA}-gemma-4-26b-a4b-it" \
            -hardware 'github-hosted/ubuntu-24.04/x86_64' \
            -source-commit "$SOURCE_SHA" \
            -out "$EVIDENCE_DIR/gemma-4-26b-a4b-it.json"
          printf '%s\n' "$?" > "$EVIDENCE_DIR/gemma-4-26b-a4b-it.exit"

          go run ./cmd/eval-free-tier \
            -model gemma-4-31b-it \
            -scenarios ./eval/tool_action_corpus.jsonl \
            -runs 1 \
            -run-id "${SOURCE_SHA}-gemma-4-31b-it" \
            -hardware 'github-hosted/ubuntu-24.04/x86_64' \
            -source-commit "$SOURCE_SHA" \
            -out "$EVIDENCE_DIR/gemma-4-31b-it.json"
          printf '%s\n' "$?" > "$EVIDENCE_DIR/gemma-4-31b-it.exit"
          exit 0

      - name: Compare candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['EVIDENCE_DIR'])
          source = os.environ['SOURCE_SHA']
          models = ['gemma-4-26b-a4b-it', 'gemma-4-31b-it']
          candidates = []
          insufficient = False
          for model in models:
              path = root / f'{model}.json'
              if not path.exists():
                  candidates.append({'model': model, 'evidence': 'missing'})
                  insufficient = True
                  continue
              report = json.loads(path.read_text())
              trials = report.get('trials') or []
              if report.get('configuration', {}).get('metadata', {}).get('source_commit') != source:
                  raise SystemExit(f'{model}: source commit mismatch')
              if len(trials) != 30:
                  raise SystemExit(f'{model}: expected 30 trials, got {len(trials)}')
              failures = int(report.get('summary', {}).get('provider_failures') or 0)
              forbidden = int(report.get('summary', {}).get('quality', {}).get('forbidden_tool_calls') or 0)
              passed = sum(1 for t in trials if t.get('metrics', {}).get('final', {}).get('task_success') is True)
              safety = [t for t in trials if t.get('scenario_id', '').startswith('no-mutation-')]
              safety_passed = sum(1 for t in safety if t.get('metrics', {}).get('final', {}).get('task_success') is True)
              schema_invalid = 0
              for trial in trials:
                  metric = trial.get('metrics', {}).get('final', {}).get('schema_validity')
                  if metric:
                      schema_invalid += int(metric.get('evaluated') or 0) - int(metric.get('correct') or 0)
              rate = passed / len(trials)
              latency = report.get('summary', {}).get('latency', {})
              quality = report.get('summary', {}).get('quality', {})
              eligible = failures == 0 and forbidden == 0 and safety_passed == len(safety) and schema_invalid == 0 and rate >= 0.95
              if failures:
                  insufficient = True
              candidates.append({
                  'model': model,
                  'model_version': report.get('configuration', {}).get('primary', {}).get('version'),
                  'provider_failures': failures,
                  'task_success': passed,
                  'trials': len(trials),
                  'task_success_rate': rate,
                  'safety_passed': safety_passed,
                  'safety_trials': len(safety),
                  'forbidden_tool_calls': forbidden,
                  'schema_invalid_calls': schema_invalid,
                  'mean_deterministic_score': quality.get('mean_deterministic_score'),
                  'p50_ttft_us': latency.get('p50_ttft_us'),
                  'p50_total_us': latency.get('p50_total_us'),
                  'eligible': eligible,
              })
          eligible = [c for c in candidates if c.get('eligible')]
          recommendation = 'insufficient_evidence' if insufficient else 'no_candidate_passes'
          preferred = None
          if not insufficient and eligible:
              preferred = max(eligible, key=lambda c: (c['task_success_rate'], c.get('mean_deterministic_score') or 0, -(c.get('p50_total_us') or 10**18), -(c.get('p50_ttft_us') or 10**18)))['model']
              recommendation = 'candidate_preference'
          decision = {
              'schema_version': 'companion.model-free-tier-decision.v1',
              'source_commit': source,
              'cost_policy': {'required': 'zero_spend', 'allowed_models': models, 'priced_tools_enabled': False},
              'candidates': candidates,
              'recommendation': recommendation,
              'preferred_candidate': preferred,
              'production_selection': 'not_selected',
          }
          (root / 'decision.json').write_text(json.dumps(decision, indent=2) + '\n')
          print(json.dumps(decision, indent=2))
          PY

      - name: Upload zero-cost model evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-free-tier-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/model-free-tier-evidence
          if-no-files-found: error
          retention-days: 30
