name: software-device-e2e

on:
  pull_request:
    paths:
      - "host/companion_software_device/**"
      - "components/companion_app/**"
      - "backend/**"
      - "testdata/scenarios/**"
      - "evidence/**"
      - "README.md"
      - "docs/TEST_EVIDENCE_LADDER.md"
      - "scripts/check_evidence.py"
      - ".github/workflows/software-device-e2e.yml"
  push:
    branches: [main]
    paths:
      - "host/companion_software_device/**"
      - "components/companion_app/**"
      - "backend/**"
      - "testdata/scenarios/**"
      - "evidence/**"
      - "README.md"
      - "docs/TEST_EVIDENCE_LADDER.md"
      - "scripts/check_evidence.py"
      - ".github/workflows/software-device-e2e.yml"
  workflow_dispatch:

concurrency:
  group: software-device-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned host software-device image
        run: docker build -f host/companion_software_device/Dockerfile -t companion-software-device .
      - name: Run real-backend Tier-1 scenarios
        run: |
          mkdir -p artifacts/software-device
          docker run --rm \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e COMPANION_EVIDENCE_OUT=/artifacts/software-device/evidence.json \
            -v "$PWD/artifacts:/artifacts" \
            companion-software-device
      - name: Validate core and representative-tool evidence artifacts
        run: |
          python3 host/companion_software_device/validate_evidence.py artifacts/software-device/evidence.json
          for evidence in artifacts/software-device/evidence-tool*.json; do
            case "$evidence" in
              *-db.json) continue ;;
            esac
            python3 host/companion_software_device/validate_evidence.py "$evidence"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/software-device/evidence-tool-db.json').read_text())
          assert data.get('schema_version') == 2
          assert data.get('result') == 'passed'
          assert data.get('promotion') == 'orchestration_only'
          mutation = data.get('mutation', {})
          assert mutation.get('table') == 'expenses'
          assert mutation.get('count') == 1
          assert mutation.get('amount_vnd') == 50000
          assert mutation.get('idempotency_key_present') is True
          parity = data.get('representative_parity', {})
          assert set(parity) == {'expense', 'budget', 'note', 'journal', 'reminder', 'timer', 'memory'}
          assert parity['budget']['limit_vnd'] == 1000000
          assert parity['note']['content'] == 'tier1 note'
          assert parity['journal']['content'] == 'tier1 journal'
          assert parity['reminder']['device_id'] == 'software-device-tool'
          assert parity['timer']['device_id'] == 'software-device-tool'
          assert parity['memory'] == {
              'count': 1, 'key': 'preferred_language', 'kind': 'semantic', 'value': 'Vietnamese'
          }
          print('AUTHORITATIVE TOOL PARITY PASS: expense/budget/note/journal/reminder/timer/memory')
          PY
      - name: Upload orchestration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-device-tier1-${{ github.sha }}
          path: artifacts/software-device/
          if-no-files-found: warn
          retention-days: 14
