name: software-device-e2e

on:
  pull_request:
    paths:
      - "host/companion_software_device/**"
      - "components/companion_app/**"
      - "backend/**"
      - "db/postgres/**"
      - "ops/postgres/**"
      - "testdata/scenarios/**"
      - "evidence/**"
      - "README.md"
      - "docs/TEST_EVIDENCE_LADDER.md"
      - "docs/OBSERVABILITY.md"
      - "scripts/check_evidence.py"
      - ".github/workflows/software-device-e2e.yml"
  push:
    branches: [main]
    paths:
      - "host/companion_software_device/**"
      - "components/companion_app/**"
      - "backend/**"
      - "db/postgres/**"
      - "ops/postgres/**"
      - "testdata/scenarios/**"
      - "evidence/**"
      - "README.md"
      - "docs/TEST_EVIDENCE_LADDER.md"
      - "docs/OBSERVABILITY.md"
      - "scripts/check_evidence.py"
      - ".github/workflows/software-device-e2e.yml"
  workflow_dispatch:

concurrency:
  group: software-device-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier1-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_IMAGE: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
      ATLAS_IMAGE: arigaio/atlas:1.2.0-community-distroless@sha256:0527e6aaaf8078ca3398cac75209f8f43a13e96bc15b3dfdeffe7cef5451c96e
      COMPANION_DATABASE_URL: postgres://companion_app:companion_app_test@127.0.0.1:55432/companion?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Atlas-migrated PostgreSQL 18.4 data plane
        run: |
          set -euo pipefail
          docker run -d --rm --name companion-tier1-pg \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_PASSWORD=companion \
            -e POSTGRES_USER=companion \
            -e POSTGRES_DB=companion \
            "$POSTGRES_IMAGE"
          for _ in $(seq 1 60); do
            if docker exec companion-tier1-pg pg_isready -U companion -d companion >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec companion-tier1-pg pg_isready -U companion -d companion
          docker run --rm --network host \
            -v "$PWD/db/postgres:/migrations:ro" \
            "$ATLAS_IMAGE" migrate apply \
            --dir file:///migrations \
            --url 'postgres://companion:companion@127.0.0.1:55432/companion?sslmode=disable'
          docker run --rm --network host \
            -v "$PWD:/src" -w /src/backend golang:1.26.6-bookworm \
            go run ./cmd/companion-river-migrate up \
            --database-url 'postgres://companion:companion@127.0.0.1:55432/companion?sslmode=disable'
          docker exec -i companion-tier1-pg psql -v ON_ERROR_STOP=1 -U companion -d companion \
            --set=runtime_user=companion_app \
            --set=runtime_password=companion_app_test \
            < ops/postgres/configure_runtime_role.psql
          test "$(docker exec companion-tier1-pg psql -v ON_ERROR_STOP=1 -At -U companion -d companion -c "SELECT rolsuper::int || ':' || rolcreatedb::int || ':' || rolcreaterole::int || ':' || has_schema_privilege('companion_app','public','CREATE')::int FROM pg_roles WHERE rolname='companion_app';")" = "0:0:0:0"
      - name: Build pinned host software-device image
        run: docker build -f host/companion_software_device/Dockerfile -t companion-software-device .
      - name: Run real-backend Tier-1 scenarios
        run: |
          mkdir -p artifacts/software-device
          docker run --rm --network host \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e COMPANION_DATABASE_URL="${COMPANION_DATABASE_URL}" \
            -e COMPANION_EVIDENCE_OUT=/artifacts/software-device/evidence.json \
            -v "$PWD/artifacts:/artifacts" \
            companion-software-device
      - name: Validate core, representative-tool, and observability evidence artifacts
        run: |
          set -eu
          python3 host/companion_software_device/validate_evidence.py artifacts/software-device/evidence.json
          python3 host/companion_software_device/validate_evidence.py artifacts/software-device/evidence-voice-mail.json
          for evidence in artifacts/software-device/evidence-tool*.json; do
            case "$evidence" in
              *-db.json|*-observability.json) continue ;;
            esac
            python3 host/companion_software_device/validate_evidence.py "$evidence"
          done

          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-observability-core.json core
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-observability.json tool expense.log
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-budget-observability.json tool budget.set
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-note-observability.json tool note.create
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-journal-observability.json tool journal.create
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-reminder-observability.json tool reminder.create
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-timer-observability.json tool timer.create
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-memory-observability.json tool memory.remember
          python3 host/companion_software_device/validate_observability.py \
            artifacts/software-device/evidence-tool-device-volume-observability.json tool device.volume.set

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/software-device/evidence-tool-db.json').read_text())
          assert data.get('schema_version') == 2
          assert data.get('result') == 'passed'
          assert data.get('promotion') == 'orchestration_only'
          assert data.get('authoritative_store') == 'postgresql'
          assert data.get('schema_revision') == '20260815093000'
          assert data.get('runtime_role') == 'companion_app'
          assert data.get('schema_create_allowed') is False
          mutation = data.get('mutation', {})
          assert mutation.get('table') == 'expenses'
          assert mutation.get('count') == 1
          assert mutation.get('amount_vnd') == 50000
          assert mutation.get('idempotency_key_present') is True
          parity = data.get('representative_parity', {})
          assert set(parity) == {'expense', 'budget', 'note', 'journal', 'reminder', 'timer', 'memory'}
          assert parity['budget']['limit_vnd'] == 1000000
          assert parity['note']['content'] == 'tier1 note'
          assert parity['journal']['content'] == 'tier1 journal'
          assert parity['reminder']['device_id'] == 'software-device-tool'
          assert parity['timer']['device_id'] == 'software-device-tool'
          assert parity['memory'] == {
              'count': 1, 'key': 'preferred_language', 'kind': 'semantic', 'value': 'Vietnamese'
          }
          print('AUTHORITATIVE TOOL PARITY PASS: expense/budget/note/journal/reminder/timer/memory + device capability wire')
          PY
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker stop companion-tier1-pg >/dev/null 2>&1 || true
      - name: Upload orchestration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-device-tier1-${{ github.sha }}
          path: artifacts/software-device/
          if-no-files-found: warn
          retention-days: 14
