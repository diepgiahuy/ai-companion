name: figma-owner-visual

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/internal/ownerweb/**'
      - 'scripts/figma_owner_visual.py'
      - '.github/workflows/figma-owner-visual.yml'
  workflow_dispatch:
    inputs:
      refresh_figma:
        description: 'Refresh Figma V3 reference artifact from the live design (does not commit it)'
        required: false
        default: false
        type: boolean

concurrency:
  group: figma-owner-visual-${{ github.event.pull_request.number || github.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apply-final-patch:
    name: Apply final visual remediation
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact final visual remediation
        run: python3 scripts/apply_owner_visual_final_patch.py

      - name: Commit final source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/internal/ownerweb/dashboard.html backend/internal/ownerweb/dashboard_visual_test.go scripts/figma_owner_visual.py
          git commit -m 'fix(ownerweb): close exact Figma V3 visual gaps (#281)'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  visual-oracle:
    name: Owner Hub visual contract
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum

      - name: Capture deterministic production DOM and screenshots
        working-directory: backend
        env:
          OWNER_VISUAL_CONTRACT_OUT: ${{ github.workspace }}/artifacts/ownerweb/production_contract.json
          OWNER_VISUAL_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/ownerweb/screenshots
        run: go test ./internal/ownerweb -run '^TestOwnerHubVisualContract$' -count=1

      - name: Compare production DOM with verified Figma V3 snapshot
        run: >-
          python3 scripts/figma_owner_visual.py compare
          --contract-output backend/internal/ownerweb/testdata/figma_owner_v3_contract.json

      - name: Upload production renders and visual report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-visual-${{ github.sha }}
          path: |
            artifacts/figma/visual_report.json
            artifacts/ownerweb/
          if-no-files-found: warn
          retention-days: 14

  refresh-figma:
    name: Refresh Figma V3 reference artifact
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_figma
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read live approved V3 contract and renders from Figma REST API
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/figma_owner_visual.py contract --contract-output artifacts/figma/refreshed_contract.json
          python3 scripts/figma_owner_visual.py export --scale 1

      - name: Upload refreshed Figma reference for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figma-owner-refresh-${{ github.sha }}
          path: artifacts/figma/
          if-no-files-found: warn
          retention-days: 14
