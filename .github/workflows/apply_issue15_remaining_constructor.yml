name: Apply issue-15 remaining constructor fix

on:
  push:
    branches: [issue-15-single-path-v2]
    paths:
      - scripts/apply_issue15_remaining_constructor.py
      - .github/workflows/apply_issue15_remaining_constructor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-15-single-path-v2
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/apply_issue15_remaining_constructor.py
          gofmt -w backend/internal/server/server_test.go
          git add backend/internal/server/server_test.go
          git diff --cached --check
          git commit -m "test(auth): finish server constructor migration"
          git push origin HEAD:issue-15-single-path-v2
