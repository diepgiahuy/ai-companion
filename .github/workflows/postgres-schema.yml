name: postgres-schema

on:
  pull_request:
    paths:
      - "db/postgres/**"
      - "backend/internal/pgstore/**"
      - "backend/cmd/companion-migrate/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/postgres-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_IMAGE: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
      ATLAS_IMAGE: arigaio/atlas:1.2.0-community-distroless@sha256:0527e6aaaf8078ca3398cac75209f8f43a13e96bc15b3dfdeffe7cef5451c96e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Start disposable PostgreSQL 18.4
        run: |
          set -euo pipefail
          docker network create companion-pg-test
          docker run -d --rm --name companion-pg --network companion-pg-test \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_PASSWORD=companion \
            -e POSTGRES_USER=companion \
            -e POSTGRES_DB=companion \
            "$POSTGRES_IMAGE"
          for _ in $(seq 1 60); do
            if docker exec companion-pg pg_isready -U companion -d companion >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs companion-pg
          exit 1

      - name: Verify Atlas integrity and validate SQL
        run: |
          set -euo pipefail
          rm -rf .tmp-atlas-migrations
          mkdir .tmp-atlas-migrations
          cp db/postgres/*.sql db/postgres/atlas.sum .tmp-atlas-migrations/
          before="$(sha256sum .tmp-atlas-migrations/atlas.sum | awk '{print $1}')"
          docker run --rm -v "$PWD/.tmp-atlas-migrations:/migrations" \
            "$ATLAS_IMAGE" migrate hash --dir file:///migrations
          after="$(sha256sum .tmp-atlas-migrations/atlas.sum | awk '{print $1}')"
          test "$before" = "$after" || {
            echo 'Committed atlas.sum does not match migration SQL:' >&2
            diff -u db/postgres/atlas.sum .tmp-atlas-migrations/atlas.sum >&2 || true
            exit 1
          }
          docker run --rm --network companion-pg-test \
            -v "$PWD/.tmp-atlas-migrations:/migrations" \
            "$ATLAS_IMAGE" migrate validate \
            --dir file:///migrations \
            --dev-url 'postgres://companion:companion@companion-pg:5432/companion?sslmode=disable'

      - name: Apply migration through Atlas
        run: |
          set -euo pipefail
          docker run --rm --network companion-pg-test \
            -v "$PWD/.tmp-atlas-migrations:/migrations" \
            "$ATLAS_IMAGE" migrate apply \
            --dir file:///migrations \
            --url 'postgres://companion:companion@companion-pg:5432/companion?sslmode=disable'

      - name: Assert post-27 invariants
        run: |
          set -euo pipefail
          psqlq() { docker exec companion-pg psql -v ON_ERROR_STOP=1 -At -U companion -d companion -c "$1"; }
          test "$(psqlq "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('idempotency_records','legacy_idempotency_reservations','privacy_policies','outbox','voice_memos');")" = "5"
          test "$(psqlq "SELECT count(*) FROM information_schema.table_constraints WHERE table_name='idempotency_records' AND constraint_type='PRIMARY KEY';")" = "1"
          test "$(psqlq "WITH inserted AS (INSERT INTO privacy_policies(user_id,updated_at) VALUES('default-deny-check',now()) RETURNING save_voice_audio,long_term_memory_enabled) SELECT save_voice_audio::int || ':' || long_term_memory_enabled::int FROM inserted;")" = "0:0"
          psqlq "INSERT INTO idempotency_records(actor_id,operation,idempotency_key,request_hash,outcome_json,created_at) VALUES('actor-a','note.create','same','aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','{}',now());"
          psqlq "INSERT INTO idempotency_records(actor_id,operation,idempotency_key,request_hash,outcome_json,created_at) VALUES('actor-b','note.create','same','bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb','{}',now());"
          test "$(psqlq "SELECT count(*) FROM idempotency_records WHERE idempotency_key='same';")" = "2"
          psqlq "INSERT INTO expenses(idempotency_key,user_id,amount_vnd,category,description,occurred_at,created_at) VALUES('pg-e2e','u',50000,'food','phase-a',now(),now());"
          test "$(psqlq "SELECT count(*) FROM outbox WHERE event_type='expense.created' AND user_id='u';")" = "1"

      - name: Run pgx Phase B transaction tests
        run: |
          set -euo pipefail
          docker run --rm --network companion-pg-test \
            -v "$PWD:/src" \
            -w /src/backend \
            -e COMPANION_POSTGRES_TEST_DSN='postgres://companion:companion@companion-pg:5432/companion?sslmode=disable' \
            golang:1.26.6-bookworm \
            sh -c 'set -eu; go test ./internal/pgstore -count=1 -timeout=2m'

      - name: Prove application server and ToolRegistry on PostgreSQL only
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD:/src" \
            -w /src/backend \
            -e COMPANION_POSTGRES_APP_TEST_DSN='postgres://companion:companion@127.0.0.1:55432/companion?sslmode=disable' \
            golang:1.26.6-bookworm \
            sh -c 'set -eu; go test -tags="apppge2e,compilecheck" ./internal/pgstore -run "^TestPostgresApplicationServerToolRestartNoSQLite$" -count=1 -timeout=2m'

      - name: Build fresh migration-parity database
        run: |
          set -euo pipefail
          docker exec companion-pg createdb -U companion companion_migration
          docker run --rm --network companion-pg-test \
            -v "$PWD/.tmp-atlas-migrations:/migrations" \
            "$ATLAS_IMAGE" migrate apply \
            --dir file:///migrations \
            --url 'postgres://companion:companion@companion-pg:5432/companion_migration?sslmode=disable'

      - name: Prove full SQLite to PostgreSQL semantic parity
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD:/src" \
            -w /src/backend \
            -e COMPANION_POSTGRES_MIGRATION_TEST_DSN='postgres://companion:companion@127.0.0.1:55432/companion_migration?sslmode=disable' \
            golang:1.26.6-bookworm \
            sh -c 'set -eu; go test ./internal/pgstore/migrate -count=1 -timeout=3m'

      - name: Exercise pg_dump restore and compare canonical state digest
        run: |
          set -euo pipefail
          digest() {
            docker run --rm --network host \
              -v "$PWD:/src" -w /src/backend golang:1.26.6-bookworm \
              go run ./cmd/companion-migrate digest-postgres \
              --postgres "postgres://companion:companion@127.0.0.1:55432/$1?sslmode=disable"
          }
          digest companion_migration > .tmp-before-restore.json
          docker exec companion-pg pg_dump -U companion -d companion_migration -Fc -f /tmp/companion-migration.dump
          docker exec companion-pg createdb -U companion companion_restore
          started_ns="$(date +%s%N)"
          docker exec companion-pg pg_restore -U companion -d companion_restore --exit-on-error /tmp/companion-migration.dump
          finished_ns="$(date +%s%N)"
          digest companion_restore > .tmp-after-restore.json
          diff -u .tmp-before-restore.json .tmp-after-restore.json
          restore_ms=$(( (finished_ns - started_ns) / 1000000 ))
          db_bytes="$(docker exec companion-pg psql -v ON_ERROR_STOP=1 -At -U companion -d companion_restore -c "SELECT pg_database_size(current_database());")"
          printf '{"postgres":"18.4","restore_ms":%d,"restored_db_bytes":%s,"digest_match":true}\n' "$restore_ms" "$db_bytes" | tee .tmp-postgres-restore-evidence.json

      - name: Exercise PostgreSQL to SQLite rollback round trip
        run: |
          set -euo pipefail
          rm -f .tmp-recovered.sqlite .tmp-recovered.sqlite-wal .tmp-recovered.sqlite-shm
          run_migrate() {
            docker run --rm --network host \
              -v "$PWD:/src" -w /src/backend golang:1.26.6-bookworm \
              go run ./cmd/companion-migrate "$@"
          }
          restored_dsn='postgres://companion:companion@127.0.0.1:55432/companion_restore?sslmode=disable'
          roundtrip_dsn='postgres://companion:companion@127.0.0.1:55432/companion_roundtrip?sslmode=disable'

          run_migrate export-sqlite --postgres "$restored_dsn" --sqlite /src/.tmp-recovered.sqlite > .tmp-rollback-export.json
          test -f .tmp-recovered.sqlite
          test ! -e .tmp-recovered.sqlite-wal
          test ! -e .tmp-recovered.sqlite-shm
          run_migrate verify --sqlite /src/.tmp-recovered.sqlite --postgres "$restored_dsn" > .tmp-rollback-verify.json
          if run_migrate export-sqlite --postgres "$restored_dsn" --sqlite /src/.tmp-recovered.sqlite >/dev/null 2>&1; then
            echo 'rollback exporter overwrote an existing recovery artifact' >&2
            exit 1
          fi

          docker exec companion-pg createdb -U companion companion_roundtrip
          docker run --rm --network companion-pg-test \
            -v "$PWD/.tmp-atlas-migrations:/migrations" \
            "$ATLAS_IMAGE" migrate apply \
            --dir file:///migrations \
            --url 'postgres://companion:companion@companion-pg:5432/companion_roundtrip?sslmode=disable'
          run_migrate import --sqlite /src/.tmp-recovered.sqlite --postgres "$roundtrip_dsn" > .tmp-rollback-reimport.json
          run_migrate digest-postgres --postgres "$restored_dsn" > .tmp-rollback-source-digest.json
          run_migrate digest-postgres --postgres "$roundtrip_dsn" > .tmp-rollback-roundtrip-digest.json
          diff -u .tmp-rollback-source-digest.json .tmp-rollback-roundtrip-digest.json
          printf '{"postgres_to_sqlite":true,"sqlite_to_postgres":true,"roundtrip_digest_match":true,"tables":24}\n' | tee .tmp-postgres-rollback-evidence.json

      - name: Re-apply is a no-op
        run: |
          set -euo pipefail
          before_idempotency="$(docker exec companion-pg psql -v ON_ERROR_STOP=1 -At -U companion -d companion -c "SELECT count(*) FROM idempotency_records;")"
          before_outbox="$(docker exec companion-pg psql -v ON_ERROR_STOP=1 -At -U companion -d companion -c "SELECT count(*) FROM outbox;")"
          output="$(docker run --rm --network companion-pg-test -v "$PWD/.tmp-atlas-migrations:/migrations" "$ATLAS_IMAGE" migrate apply --dir file:///migrations --url 'postgres://companion:companion@companion-pg:5432/companion?sslmode=disable')"
          printf '%s\n' "$output"
          grep -Fq 'No migration files to execute' <<<"$output"
          after_idempotency="$(docker exec companion-pg psql -v ON_ERROR_STOP=1 -At -U companion -d companion -c "SELECT count(*) FROM idempotency_records;")"
          after_outbox="$(docker exec companion-pg psql -v ON_ERROR_STOP=1 -At -U companion -d companion -c "SELECT count(*) FROM outbox;")"
          test "$before_idempotency" = "$after_idempotency"
          test "$before_outbox" = "$after_outbox"
