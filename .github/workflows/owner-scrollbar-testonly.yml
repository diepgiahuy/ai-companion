name: owner-scrollbar-testonly

on:
  push:
    branches: [feat/281-figma-visual-oracle]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/281-figma-visual-oracle
          fetch-depth: 0
      - run: python3 scripts/apply_owner_scrollbar_testonly.py
      - run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/internal/ownerweb/dashboard.html backend/internal/ownerweb/dashboard_browser_test.go
          git commit -m 'test(ownerweb): keep scrollbar hiding in browser oracle only (#281)'
          git push origin HEAD:feat/281-figma-visual-oracle
