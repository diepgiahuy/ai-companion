name: Apply issue-15 README truth update

on:
  push:
    branches: [issue-15-single-path-v2]
    paths:
      - scripts/apply_issue15_readme_truth.py
      - .github/workflows/apply_issue15_readme_truth.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-15-single-path-v2
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+diepgiahuy@users.noreply.github.com"
          python3 scripts/apply_issue15_readme_truth.py
          git diff --check
          git add README.md
          git commit -m "docs: make single-path architecture the source of truth"
          git push origin HEAD:issue-15-single-path-v2
