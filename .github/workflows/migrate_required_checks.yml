name: migrate-required-checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate_required_checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-required-checks
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      RULESET_ID: '20785214'
    steps:
      - name: Verify and migrate required checks
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}" || {
            echo "::error::PROJECT_TOKEN is unavailable; ruleset was not changed."
            exit 1
          }

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}"
          headers=(
            -H "Authorization: Bearer ${ADMIN_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          before="$(curl -fsSL "${headers[@]}" "$api")"
          jq -e '
            .id == 20785214 and
            .name == "second rule" and
            .target == "branch" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/heads/main"] and
            .conditions.ref_name.exclude == []
          ' <<<"$before" >/dev/null

          old_contexts='["CodeQL Go","Evidence truth gate","Go reproducibility, vet, race, vulnerabilities","PR Contract","e2e"]'
          target_contexts='["PR Contract","PR Gate"]'
          current_contexts="$(jq -c '
            [.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | sort
          ' <<<"$before")"

          if [[ "$current_contexts" != "$old_contexts" && "$current_contexts" != "$target_contexts" ]]; then
            echo "::error::Unexpected required-check set; refusing mutation: $current_contexts"
            exit 1
          fi

          before_invariants="$(jq -S -c '
            {
              name,
              target,
              enforcement,
              bypass_actors,
              conditions,
              rules: [.rules[] |
                if .type == "required_status_checks"
                then .parameters.required_status_checks = []
                else .
                end]
            }
          ' <<<"$before")"

          if [[ "$current_contexts" == "$old_contexts" ]]; then
            payload="$(jq -c '
              {
                name,
                target,
                enforcement,
                bypass_actors,
                conditions,
                rules: [.rules[] |
                  if .type == "required_status_checks"
                  then .parameters.required_status_checks = [
                    {"context":"PR Gate","integration_id":15368},
                    {"context":"PR Contract","integration_id":15368}
                  ]
                  else .
                  end]
              }
            ' <<<"$before")"

            curl -fsSL -X PUT "${headers[@]}" \
              -H "Content-Type: application/json" \
              "$api" \
              -d "$payload" >/tmp/ruleset-update.json
          fi

          after="$(curl -fsSL "${headers[@]}" "$api")"
          after_contexts="$(jq -c '
            [.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | sort
          ' <<<"$after")"
          test "$after_contexts" = "$target_contexts"

          jq -e '
            [.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]] == [
              {"context":"PR Gate","integration_id":15368},
              {"context":"PR Contract","integration_id":15368}
            ] and
            (.rules[] | select(.type == "required_status_checks") | .parameters.strict_required_status_checks_policy) == true and
            (.rules[] | select(.type == "required_status_checks") | .parameters.do_not_enforce_on_create) == false
          ' <<<"$after" >/dev/null

          after_invariants="$(jq -S -c '
            {
              name,
              target,
              enforcement,
              bypass_actors,
              conditions,
              rules: [.rules[] |
                if .type == "required_status_checks"
                then .parameters.required_status_checks = []
                else .
                end]
            }
          ' <<<"$after")"
          test "$before_invariants" = "$after_invariants"

          {
            echo "## Required-check migration"
            echo
            echo "- ruleset: ${RULESET_ID} (second rule)"
            echo "- target: refs/heads/main"
            echo "- before: ${current_contexts}"
            echo "- after: ${after_contexts}"
            echo "- non-check rules/conditions: unchanged"
            echo "- strict up-to-date policy: preserved"
          } >> "$GITHUB_STEP_SUMMARY"
