name: Firmware HIL

on:
  workflow_dispatch:
    inputs:
      device_port:
        description: Serial device connected to the trusted ESP32-S3 DUT
        required: true
        type: string
      erase_all:
        description: Erase flash before testing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firmware-hil-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hil:
    name: Trusted ESP32-S3 smoke test
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      HIL_PORT: ${{ inputs.device_port }}
      HIL_ERASE_ALL: ${{ inputs.erase_all }}

    steps:
      - name: Checkout trusted repository ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Record source revision
        run: |
          {
            echo "## Firmware HIL"
            echo
            echo "- Run: ${{ github.run_id }}"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Ref: ${{ github.ref }}"
            echo "- Target: esp32s3"
            echo "- Port: $HIL_PORT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate runner prerequisites
        run: |
          mkdir -p artifacts
          test -n "$HIL_PORT"
          test -e "$HIL_PORT"
          test -f "$HOME/esp/esp-idf/export.sh"
          source "$HOME/esp/esp-idf/export.sh"
          idf.py --version | tee artifacts/idf-version.txt
          echo "- ESP-IDF: $(idf.py --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned HIL dependencies
        run: |
          source "$HOME/esp/esp-idf/export.sh"
          python -m pip install --requirement tests/firmware/requirements.txt

      - name: Build firmware
        run: |
          source "$HOME/esp/esp-idf/export.sh"
          idf.py build

      - name: Run physical boot smoke test
        run: |
          source "$HOME/esp/esp-idf/export.sh"
          PYTEST_ARGS=(
            tests/firmware
            -s
            --embedded-services esp,idf
            --app-path .
            --target esp32s3
            --port "$HIL_PORT"
            --junitxml=artifacts/hil-junit.xml
          )
          if [ "$HIL_ERASE_ALL" = "true" ]; then
            PYTEST_ARGS+=(--erase-all)
          fi
          python -m pytest "${PYTEST_ARGS[@]}"

      - name: Upload HIL report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-hil-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
