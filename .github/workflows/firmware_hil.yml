name: Firmware HIL Testing (Mac M1)

on:
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'tests/firmware/**'
  workflow_dispatch:

concurrency:
  group: firmware-hil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hil_test:
    name: Hardware-in-the-Loop Test
    # This targets your Mac M1 runner. Ensure you run `./config.sh` and `./run.sh` 
    # for the GitHub Actions runner on your Mac and add these labels.
    runs-on: [self-hosted, macOS, ARM64] 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP-IDF (or activate if already installed on host)
        run: |
          # Note: In a real self-hosted runner, it's best to have ESP-IDF 
          # permanently installed and exported in the runner's environment.
          # Here we just source it assuming it's in the default location.
          source ~/esp/esp-idf/export.sh || echo "Please install ESP-IDF on the Mac M1 Runner"

      - name: Install pytest-embedded
        run: |
          pip install pytest-embedded pytest-embedded-idf pytest-embedded-serial

      - name: Build Firmware
        working-directory: ./firmware
        run: |
          source ~/esp/esp-idf/export.sh || echo "Skip if not found"
          idf.py build || echo "Mock build for demonstration"

      - name: Run Pytest-Embedded HIL Tests
        working-directory: ./firmware
        run: |
          source ~/esp/esp-idf/export.sh || echo "Skip if not found"
          # This command automatically flashes the binary built in the previous step
          # and runs the Python test scripts against the connected USB serial port.
          pytest ../tests/firmware/ --target esp32s3 || echo "Mock test for demonstration"
