name: Firmware HIL

on:
  workflow_dispatch:
    inputs:
      device_port:
        description: Serial device connected to the trusted ESP32-S3 DUT
        required: true
        type: string
      erase_all:
        description: Erase flash before testing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firmware-hil-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hil:
    name: Trusted ESP32-S3 smoke test
    runs-on: [self-hosted, macOS, ARM64, esp32s3-hil]
    timeout-minutes: 30
    env:
      HIL_PORT: ${{ inputs.device_port }}
      HIL_ERASE_ALL: ${{ inputs.erase_all }}
      HIL_WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
      HIL_WIFI_PASSWORD: ${{ secrets.HIL_WIFI_PASSWORD }}
      HIL_SERVER_URL: ${{ secrets.HIL_SERVER_URL }}
      HIL_DEVICE_CREDENTIAL: ${{ secrets.HIL_DEVICE_CREDENTIAL }}

    steps:
      - name: Checkout trusted repository ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record source revision
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Firmware HIL"
            echo
            echo "- Run: ${{ github.run_id }}"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Ref: ${{ github.ref }}"
            echo "- Target: esp32s3"
            echo "- Port: $HIL_PORT"
            echo "- Product transport: WebSocket protocol v2"
            echo "- Device auth: enrolled per-device credential"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate runner and product-network prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -n "$HIL_PORT"
          test -e "$HIL_PORT"
          test -r "$HIL_PORT"
          test -w "$HIL_PORT"
          test -n "$HIL_WIFI_SSID"
          test -n "$HIL_SERVER_URL"
          test -n "$HIL_DEVICE_CREDENTIAL"
          case "$HIL_SERVER_URL" in
            ws://*|wss://*) ;;
            *) echo "HIL_SERVER_URL must use ws:// or wss://" >&2; exit 1 ;;
          esac
          test -f "$HOME/esp/esp-idf/export.sh"
          source "$HOME/esp/esp-idf/export.sh"
          idf.py --version | tee artifacts/idf-version.txt
          python --version
          echo "- ESP-IDF: $(idf.py --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned HIL dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/esp/esp-idf/export.sh"
          python -m pip install --requirement tests/firmware/requirements.txt

      - name: Build canonical WebSocket firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/esp/esp-idf/export.sh"
          defaults="/tmp/companion-hil-sdkconfig.defaults"
          export HIL_DEFAULTS="$defaults"
          python - <<'PY'
          import os
          from pathlib import Path

          def kconfig_string(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          values = {
              "CONFIG_COMPANION_WIFI_SSID": os.environ["HIL_WIFI_SSID"],
              "CONFIG_COMPANION_WIFI_PASSWORD": os.environ.get("HIL_WIFI_PASSWORD", ""),
              "CONFIG_COMPANION_SERVER_URL": os.environ["HIL_SERVER_URL"],
              "CONFIG_COMPANION_DEVICE_CREDENTIAL": os.environ["HIL_DEVICE_CREDENTIAL"],
          }
          Path(os.environ["HIL_DEFAULTS"]).write_text(
              "".join(f"{key}={kconfig_string(value)}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
          export SDKCONFIG_DEFAULTS="sdkconfig.defaults;$defaults"
          rm -rf build sdkconfig
          idf.py set-target esp32s3
          idf.py build
          rm -f "$defaults" sdkconfig

      - name: Run physical boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/esp/esp-idf/export.sh"
          PYTEST_ARGS=(
            tests/firmware
            -s
            --embedded-services esp,idf
            --app-path .
            --build-dir build
            --target esp32s3
            --port "$HIL_PORT"
            --junitxml=artifacts/hil-junit.xml
          )
          if [ "$HIL_ERASE_ALL" = "true" ]; then
            PYTEST_ARGS+=(--erase-all)
          fi
          python -m pytest "${PYTEST_ARGS[@]}"

      - name: Remove HIL build containing test credentials
        if: always()
        shell: bash
        run: |
          rm -rf build sdkconfig
          rm -f /tmp/companion-hil-sdkconfig.defaults

      - name: Upload HIL report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-hil-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
