name: full-project-verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run canonical full project verification
        run: bash scripts/check_full.sh
