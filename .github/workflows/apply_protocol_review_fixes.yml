name: Apply protocol review fixes

on:
  push:
    branches:
      - codex/interaction-protocol-contracts
    paths:
      - scripts/apply_protocol_review_fixes.py
      - .github/workflows/apply_protocol_review_fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protocol branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/interaction-protocol-contracts
          fetch-depth: 0
      - name: Sync main and apply guarded fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python3 scripts/apply_protocol_review_fixes.py
          rm scripts/apply_protocol_review_fixes.py
          rm .github/workflows/apply_protocol_review_fixes.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No guarded fixes were produced" >&2
            exit 1
          fi
          git commit -m "fix(protocol): close final correctness review gaps"
          git push origin HEAD:codex/interaction-protocol-contracts
