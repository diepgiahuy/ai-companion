name: Temporary capability source-of-truth refresh push

on:
  push:
    branches:
      - feat/capability-hardening-246

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capability-hardening-246
          fetch-depth: 0
      - name: Apply embedded refresh script once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## Implemented Product-v1 facts$' docs/ADR-003-DEVICE-CAPABILITY-PLANE.md; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          workflow = Path('.github/workflows/temporary-capability-doc-refresh.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('embedded refresh script not found')
          exec(compile(textwrap.dedent(match.group(1)), 'capability-doc-refresh', 'exec'))
          PY
          git diff --check
      - name: Commit source-of-truth refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ADR-003-DEVICE-CAPABILITY-PLANE.md docs/ARCHITECTURE.md docs/architecture/AI_COMPANION_RESET_EXECUTION_PLANS_V2_CANONICAL_2026-08-17.md README.md
          git commit -m 'docs(capability): record generic RPC hardening cutover'
          git push origin HEAD:feat/capability-hardening-246
