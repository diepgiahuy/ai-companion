name: issue27-voice-context-apply

on:
  push:
    branches: [agent/issue-27-native-slice]
    paths: [.github/workflows/issue27-voice-context-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-27-native-slice
          fetch-depth: 0
      - name: Guard branch
        run: test "$GITHUB_REF_NAME" = "agent/issue-27-native-slice"
      - name: Apply exact-state voice/context patch
        run: python3 scripts/issue27_voice_context_patch.py
      - name: Format and test durable voice/context mutations
        run: |
          docker build -f Dockerfile.test -t issue27-voice-context-test .
          docker run --rm issue27-voice-context-test bash -c '
            gofmt -w backend/internal/domain/idempotency_ports.go backend/internal/store/idempotent_voice_context.go backend/internal/conversation/idempotency.go backend/internal/providers/conversation/idempotency.go backend/internal/providers/tools/native.go backend/internal/providers/tools/idempotency_voice_context_test.go &&
            cd backend &&
            go test ./internal/idempotency ./internal/store ./internal/conversation ./internal/providers/conversation ./internal/providers/tools &&
            go test -race ./internal/store ./internal/conversation ./internal/providers/conversation ./internal/providers/tools
          '
          docker run --rm -v "$PWD:/src" -w /src issue27-voice-context-test bash -c 'gofmt -w backend/internal/domain/idempotency_ports.go backend/internal/store/idempotent_voice_context.go backend/internal/conversation/idempotency.go backend/internal/providers/conversation/idempotency.go backend/internal/providers/tools/native.go backend/internal/providers/tools/idempotency_voice_context_test.go'
          git diff --check
      - name: Commit and remove one-shot helpers
        run: |
          git config user.name "Diệp Gia Huy"
          git config user.email "30974088+diepgiahuy@users.noreply.github.com"
          git rm .github/workflows/issue27-voice-context-apply.yml scripts/issue27_voice_context_patch.py
          git add backend/internal/domain backend/internal/store backend/internal/conversation backend/internal/providers/conversation backend/internal/providers/tools
          git diff --cached --check
          git commit -m "feat: make voice and conversation mutations durable"
          git push origin HEAD:agent/issue-27-native-slice
