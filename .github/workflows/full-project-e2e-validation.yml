name: full-project-e2e-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# This temporary workflow adds the promotion-only backend-full oracle.
# The repository's normal ci workflow sees this workflow-file change as
# pr-ci-control and, on the same exact PR head, runs host + PostgreSQL/River +
# ESP32-S3 protocol compile + Tier-1 software-device orchestration. Keeping
# those reusable workflows in one place avoids duplicate-job cancellation.
jobs:
  host:
    name: Full host simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libopus-dev libopusfile-dev libboost-system-dev nlohmann-json3-dev libssl-dev
      - name: Run host firmware and integration tests
        run: bash scripts/e2e.sh
      - name: Compile Tier-1 software-device nearest oracle
        run: |
          cmake -S host/companion_software_device -B build-software-device -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-software-device --target companion_software_device

  backend-full:
    name: Full Go backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build full quality image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.test
          target: quality
          load: true
          pull: true
          tags: companion-test:quality
          cache-from: type=gha,scope=companion-quality
          cache-to: type=gha,mode=max,scope=companion-quality
      - name: Run full backend quality, race and vulnerability checks
        run: docker run --rm companion-test:quality bash scripts/backend_quality.sh full
      - name: Diff hygiene
        run: git diff --check

  validation-gate:
    name: Validation supplement gate
    needs: [host, backend-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require supplement oracles
        env:
          HOST: ${{ needs.host.result }}
          BACKEND: ${{ needs.backend-full.result }}
        run: |
          set -euo pipefail
          test "$HOST" = success
          test "$BACKEND" = success
          echo 'VALIDATION SUPPLEMENT PASS: host + backend full'
