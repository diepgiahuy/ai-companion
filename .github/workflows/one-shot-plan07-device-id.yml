name: one-shot-plan07-device-id

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase-03-settings-wake-plan07
          fetch-depth: 0
          persist-credentials: true
      - name: Finish PLAN 07 residue cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('backend/internal/ownerweb/dashboard.html')
          text = dashboard.read_text()
          replacements = [
            (
              "    const data = await fetchJSON('/v1/owner/data/device' + (selectedDeviceID ? `?device_id=${selectedDeviceID}` : ''));\n    container.innerHTML = `",
              "    const data = await fetchJSON('/v1/owner/data/device' + (selectedDeviceID ? `?device_id=${encodeURIComponent(selectedDeviceID)}` : ''));\n    if (!selectedDeviceID && data?.device_id) selectedDeviceID = data.device_id;\n    container.innerHTML = `",
            ),
            (
              "  banner.textContent = 'Updating device twin configuration...';\n  try {\n    const res = await mutate('/v1/owner/data/device/config', 'POST', { device_id: selectedDeviceID || 'companion-s3-01', ota_poll_interval: val });",
              "  if (!selectedDeviceID) {\n    banner.textContent = 'No owned device selected';\n    return;\n  }\n  banner.textContent = 'Updating device twin configuration...';\n  try {\n    const res = await mutate('/v1/owner/data/device/config', 'POST', { device_id: selectedDeviceID, ota_poll_interval: val });",
            ),
            (
              "    banner.innerHTML = `✅ Interval updated to <b>${val}</b> for ${selectedDeviceID || 'companion-s3-01'}.`;",
              "    banner.innerHTML = `✅ Interval updated to <b>${val}</b> for ${selectedDeviceID}.`;",
            ),
            (
              "  banner.textContent = 'Pushing OTA trigger to device twin...';\n  try {\n    const res = await mutate('/v1/owner/data/device/ota-trigger', 'POST', { device_id: selectedDeviceID || 'companion-s3-01', target_version: 'v2.4.1' });",
              "  if (!selectedDeviceID) {\n    banner.textContent = 'No owned device selected';\n    return;\n  }\n  banner.textContent = 'Pushing OTA trigger to device twin...';\n  try {\n    const res = await mutate('/v1/owner/data/device/ota-trigger', 'POST', { device_id: selectedDeviceID, target_version: 'v2.4.1' });",
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
              elif count == 0 and new in text:
                  pass
              else:
                  raise SystemExit(f'expected zero(already applied) or one match, got {count}: {old[:100]!r}')
          if "selectedDeviceID || 'companion-s3-01'" in text:
              raise SystemExit('fake Owner Hub device-id fallback remains')
          dashboard.write_text(text)

          validator = Path('host/companion_software_device/validate_evidence.py')
          evidence = validator.read_text()
          old = '"reconnect_new_session", "config_update_report", "protocol_v1_rejected",'
          new = '"reconnect_new_session", "settings_update_apply", "protocol_v1_rejected",'
          count = evidence.count(old)
          if count == 1:
              evidence = evidence.replace(old, new, 1)
          elif count == 0 and new in evidence:
              pass
          else:
              raise SystemExit(f'legacy Tier-1 expectation match count={count}')
          if '"config_update_report"' in evidence:
              raise SystemExit('legacy Tier-1 scenario expectation remains')
          validator.write_text(evidence)
          PY
          git diff --check
      - name: Commit if needed
        run: |
          set -euo pipefail
          git config user.name "ai-companion-plan07-bot"
          git config user.email "ai-companion-plan07-bot@users.noreply.github.com"
          git add backend/internal/ownerweb/dashboard.html host/companion_software_device/validate_evidence.py
          if git diff --cached --quiet; then
            echo already-applied
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(settings): close Owner Hub and Tier-1 residues"
          git push origin HEAD:feat/phase-03-settings-wake-plan07
