name: project-token-smoke

on:
  push:
    branches:
      - agent/issue-115-project-token-smoke
    paths:
      - .github/workflows/project-token-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-project-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Verify PROJECT_TOKEN is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::PROJECT_TOKEN is not configured for this repository"
            exit 1
          fi

      - name: Verify GitHub CLI authentication and Projects access
        shell: bash
        run: |
          set -euo pipefail
          gh auth status
          gh project list --owner "${GITHUB_REPOSITORY_OWNER}" --limit 1 --format json >/tmp/projects.json
          jq -e 'type == "object" or type == "array"' /tmp/projects.json >/dev/null
          echo "PROJECT_TOKEN can access user-owned GitHub Projects."
