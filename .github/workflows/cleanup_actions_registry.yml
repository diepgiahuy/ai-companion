name: cleanup-actions-registry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup_actions_registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-actions-registry
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Disable stale workflow registry records
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_PATH: .github/workflows/cleanup_actions_registry.yml
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          workflows="$(curl -fsSL "${headers[@]}" "${api}/actions/workflows?per_page=100")"
          total="$(jq '.total_count' <<<"$workflows")"
          disabled=0
          kept=0
          managed=0

          while IFS=$'\t' read -r id path state; do
            [[ -n "$id" ]] || continue
            if [[ "$state" != "active" ]]; then
              continue
            fi
            case "$path" in
              .github/workflows/*) ;;
              *)
                managed=$((managed + 1))
                echo "IGNORE GitHub-managed workflow record: $path"
                continue
                ;;
            esac
            if [[ "$path" == "$SELF_PATH" ]]; then
              continue
            fi
            if [[ -f "$path" ]]; then
              kept=$((kept + 1))
              echo "KEEP active workflow with live file: $path"
              continue
            fi

            echo "DISABLE stale workflow id=$id path=$path"
            curl -fsSL -o /dev/null -X PUT "${headers[@]}" \
              "${api}/actions/workflows/${id}/disable"
            disabled=$((disabled + 1))
          done < <(jq -r '.workflows[] | [.id, .path, .state] | @tsv' <<<"$workflows")

          self_id="$(jq -r --arg path "$SELF_PATH" '.workflows[] | select(.path == $path) | .id' <<<"$workflows" | head -n1)"
          test -n "$self_id"
          echo "Disable one-shot cleanup workflow itself: id=$self_id"
          curl -fsSL -o /dev/null -X PUT "${headers[@]}" \
            "${api}/actions/workflows/${self_id}/disable"

          {
            echo "## Actions registry cleanup"
            echo
            echo "- registry records observed: $total"
            echo "- stale repository workflow records disabled this run: $disabled"
            echo "- live repository workflow files kept: $kept"
            echo "- GitHub-managed dynamic records ignored: $managed"
            echo "- cleanup workflow disabled itself: yes"
          } >> "$GITHUB_STEP_SUMMARY"
