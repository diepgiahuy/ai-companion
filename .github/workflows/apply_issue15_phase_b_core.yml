name: Apply issue-15 phase B core

on:
  push:
    branches:
      - issue-15-adk-auth-hard-cut
    paths:
      - scripts/apply_issue15_phase_b_core.py
      - .github/workflows/apply_issue15_phase_b_core.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout phase-B branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-15-adk-auth-hard-cut
          fetch-depth: 0
      - name: Apply guarded product-path cut
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/apply_issue15_phase_b_core.py
          gofmt -w backend/cmd/companiond/main.go backend/internal/runtimeconfig/config.go backend/internal/server/server.go backend/internal/server/identity.go backend/internal/adkbridge/*.go
          ! grep -R -n --exclude='*.md' --exclude='*_test.go' 'COMPANION_AGENT_RUNTIME\|COMPANION_DEVICE_AUTH\|COMPANION_DEVICE_TOKEN' backend/cmd backend/internal
          ! grep -R -n --exclude='*_test.go' 'QWEN_BASE_URL\|QWEN_MODEL\|QWEN_REASONING_MODEL\|QWEN_FAST_MODEL' backend/cmd
          ! grep -R -n --exclude='*_test.go' 'runner.NewInMemory' backend/internal/adkbridge
          ! grep -n 'token[[:space:]]*string' backend/internal/server/server.go
          git diff --check
          rm scripts/apply_issue15_phase_b_core.py
          git add -A
          git commit -m "refactor: hard-cut product composition to ADK and enrolled auth"
          git push origin HEAD:issue-15-adk-auth-hard-cut
