name: module-lock

on:
  pull_request:
    paths:
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/**/*.go'
      - '.github/workflows/module-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy:
    name: Generate exact Go module lock candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tidy with exact Go 1.26.5
        run: |
          mkdir -p module-lock
          docker run --rm \
            -v "$PWD:/src" \
            -w /src/backend \
            golang:1.26.5-bookworm \
            sh -c 'set -eu; go mod tidy; go mod verify; cp go.mod go.sum /src/module-lock/'
      - name: Upload lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-module-lock
          path: |
            module-lock/go.mod
            module-lock/go.sum
          if-no-files-found: error
