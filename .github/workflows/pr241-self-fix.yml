name: pr241-self-fix

on:
  push:
    branches:
      - feat/issue-228-a6-recovery-convergence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/issue-228-a6-recovery-convergence
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          set -euo pipefail
          python3 scripts/pr241_self_fix.py
          git diff --check

      - name: Verify host paths
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config libopus-dev libopusfile-dev libboost-system-dev nlohmann-json3-dev libssl-dev
          bash scripts/e2e.sh
          cmake -S host/companion_software_device -B build-software-device -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-software-device --target companion_software_device

      - name: Commit reviewed fixes
        run: |
          set -euo pipefail
          rm scripts/pr241_self_fix.py .github/workflows/pr241-self-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(firmware): make recovery generation filtering race-safe"
          git push origin HEAD:feat/issue-228-a6-recovery-convergence
