name: release-artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  id-token: write
  attestations: write

jobs:
  backend:
    name: Build and attest backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify attested source and hosted promotion gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "::error::Attested artifact source must be reachable from main: $RELEASE_SHA"
            exit 1
          }

          checks_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"
          ok="$(jq '[.check_runs[] | select(
            .name == "Promotion Gate" and
            .head_sha == env.RELEASE_SHA and
            .status == "completed" and
            .conclusion == "success" and
            .app.slug == "github-actions"
          )] | length' <<<"$checks_json")"
          if [[ "$ok" == "0" ]]; then
            echo "::error::Required successful GitHub Actions Promotion Gate missing on attested SHA ${RELEASE_SHA}"
            exit 1
          fi

          {
            echo '## Release source gate'
            echo
            echo "- Ref: ${GITHUB_REF}"
            echo "- Commit: ${RELEASE_SHA}"
            echo '- Reachable from main: yes'
            echo '- Required hosted gate: GitHub Actions Promotion Gate success'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate evidence policy
        run: python3 scripts/check_evidence.py

      - name: Build exact-toolchain image
        run: docker build --pull -f Dockerfile.test -t companion-release .

      - name: Build reproducible backend artifact
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" companion-release sh -c '
            set -eu
            cd /src/backend
            test "$(go env GOVERSION)" = "go1.26.6"
            go mod verify
            go build -tags "adk,mcp,nolibopusfile" -trimpath -ldflags="-s -w -buildid=" -o /out/companiond ./cmd/companiond
          '
          sha256sum dist/companiond | tee dist/companiond.sha256

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companiond-linux-amd64
          path: |
            dist/companiond
            dist/companiond.sha256
          if-no-files-found: error

      - name: Attest backend provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/companiond
