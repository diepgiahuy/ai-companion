name: release-artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  backend:
    name: Build and attest backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate evidence policy
        run: python3 scripts/check_evidence.py
      - name: Build exact-toolchain image
        run: docker build --pull -f Dockerfile.test -t companion-release .
      - name: Build reproducible backend artifact
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" companion-release bash -lc '
            set -euo pipefail
            cd /src/backend
            test "$(go env GOVERSION)" = "go1.26.5"
            go mod verify
            go build -tags "adk,nolibopusfile" -trimpath -ldflags="-s -w -buildid=" -o /out/companiond ./cmd/companiond
          '
          sha256sum dist/companiond | tee dist/companiond.sha256
      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companiond-linux-amd64
          path: |
            dist/companiond
            dist/companiond.sha256
          if-no-files-found: error
      - name: Attest backend provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/companiond
