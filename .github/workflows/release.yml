name: release-artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  backend:
    name: Build and attest backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate evidence policy
        run: python3 scripts/check_evidence.py
      - name: Build exact-toolchain image
        run: docker build --pull -f Dockerfile.test -t companion-release .
      - name: Build reproducible backend artifact
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" companion-release sh -c '
            set -eu
            cd /src/backend
            test "$(go env GOVERSION)" = "go1.26.5"
            go mod verify
            go build -tags "adk,mcp,webrtc,nolibopusfile" -trimpath -ldflags="-s -w -buildid=" -o /out/companiond ./cmd/companiond
          '
          sha256sum dist/companiond | tee dist/companiond.sha256
      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companiond-linux-amd64
          path: |
            dist/companiond
            dist/companiond.sha256
          if-no-files-found: error
      - name: Attest backend provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/companiond
