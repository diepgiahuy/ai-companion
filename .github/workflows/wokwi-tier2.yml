name: wokwi-tier2

on:
  pull_request:
    paths:
      - ".github/workflows/wokwi-tier2.yml"
      - "host/companion_software_device/validate_wokwi_probe.py"
      - "docs/TEST_EVIDENCE_LADDER.md"
      - "main/**"
      - "components/esp32_*/*"
      - "components/esp32_*/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record safe PR-context blocker without reading repository secrets
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/wokwi
          cat > artifacts/wokwi/capability.json <<'JSON'
          {
            "schema_version": 1,
            "evidence_class": "tier2_capability_probe",
            "status": "unavailable",
            "blocker_code": "trusted_dispatch_required",
            "simulation_ran": false,
            "promotion": "none"
          }
          JSON
      - name: Record trusted-dispatch token capability without consuming simulation quota
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/wokwi
          if [[ -z "${WOKWI_CLI_TOKEN:-}" ]]; then
            blocker="missing_wokwi_cli_token"
            status="unavailable"
          else
            blocker="null"
            status="token_available"
          fi
          python3 - "$status" "$blocker" <<'PY'
          import json, sys
          status, blocker = sys.argv[1:]
          payload = {
              "schema_version": 1,
              "evidence_class": "tier2_capability_probe",
              "status": status,
              "blocker_code": None if blocker == "null" else blocker,
              "simulation_ran": False,
              "promotion": "none",
          }
          open("artifacts/wokwi/capability.json", "w", encoding="utf-8").write(
              json.dumps(payload, indent=2) + "\n"
          )
          PY
      - name: Validate capability evidence
        run: python3 host/companion_software_device/validate_wokwi_probe.py artifacts/wokwi/capability.json
      - name: Upload Wokwi capability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wokwi-tier2-capability-${{ github.sha }}
          path: artifacts/wokwi/capability.json
          if-no-files-found: error
          retention-days: 14
