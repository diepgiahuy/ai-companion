name: product-v1-project-migration-retired

# The one-shot Product-v1 graph/Project migration completed and was verified in
# issue #210. The executable migration scripts were removed immediately after
# success. This inert manual-only marker is retained only because the connected
# GitHub write surface does not permit deleting workflow files safely.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Migration already completed
        run: echo 'Product-v1 Project migration completed under issue #210; no migration action remains.'
