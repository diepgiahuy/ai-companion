name: issue15-sync-main-probe

on:
  push:
    branches: [issue-15-single-path-v2]
    paths:
      - .github/workflows/issue15-sync-main-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Probe merge with protected main
        shell: bash
        run: |
          set -u
          git config user.name "issue15-merge-probe"
          git config user.email "issue15-merge-probe@invalid.local"
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            echo "MERGE_PROBE_CLEAN"
            git merge --abort || true
            exit 0
          fi
          echo "MERGE_PROBE_CONFLICTS"
          git status --short
          git diff --name-only --diff-filter=U
          git merge --abort || true
          exit 1
