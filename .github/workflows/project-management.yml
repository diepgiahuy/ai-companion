name: project-management

on:
  workflow_dispatch:
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - labeled
      - unlabeled
      - assigned
      - unassigned
  push:
    branches:
      - main
    paths:
      - scripts/bootstrap_github_project.py
      - scripts/migrate_project_control_plane_126.py
      - scripts/reconcile_github_issue_status.py
      - .github/workflows/project-management.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: project-management-${{ github.event_name }}-${{ github.event.issue.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      REPO_TOKEN: ${{ github.token }}
      PROJECT_OWNER: diepgiahuy
      PROJECT_REPOSITORY: diepgiahuy/ai-companion
      PROJECT_TITLE: AI Companion — Production v1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate required credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REPO_TOKEN:-}" || { echo "::error::REPO_TOKEN is unavailable"; exit 1; }
          test -n "${PROJECT_TOKEN:-}" || { echo "::error::PROJECT_TOKEN is not configured"; exit 1; }

      - name: Apply one-shot #126 native graph and Project schema migration
        if: github.event_name == 'push'
        run: python3 scripts/migrate_project_control_plane_126.py

      - name: Reconcile compatibility execution labels from native relationships
        run: python3 scripts/reconcile_github_issue_status.py

      - name: Sync Project item membership and deterministic Status
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            python3 scripts/bootstrap_github_project.py --sync-issue "${{ github.event.issue.number }}"
          else
            python3 scripts/bootstrap_github_project.py --sync-all
          fi
