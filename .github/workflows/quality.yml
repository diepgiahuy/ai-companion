name: quality-security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: Evidence truth gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate production evidence claims
        run: python3 scripts/check_evidence.py
      - name: Enforce single product runtime/auth/transport path
        run: python3 scripts/check_single_path.py

  backend-quality:
    name: Go reproducibility, vet, race, vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact Go 1.26.5 test image
        run: docker build --pull -f Dockerfile.test -t companion-quality .
      - name: Module reproducibility and verification
        run: |
          docker run --rm companion-quality sh -c '
            set -eu
            cd /src/backend
            cp go.mod /tmp/go.mod.before
            cp go.sum /tmp/go.sum.before
            go mod tidy
            cmp go.mod /tmp/go.mod.before
            cmp go.sum /tmp/go.sum.before
            go mod verify
          '
      - name: Vet and race production adapter tags
        run: |
          docker run --rm companion-quality sh -c '
            set -eu
            cd /src/backend
            go vet -tags "adk,mcp,nolibopusfile" ./...
            go test -tags "adk,mcp,nolibopusfile" -race -count=1 ./...
          '
      - name: Go vulnerability reachability scan
        run: |
          docker run --rm companion-quality sh -c '
            set -eu
            export GOBIN=/tmp/go-tools
            go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
            cd /src/backend
            /tmp/go-tools/govulncheck -tags=adk,mcp,nolibopusfile -test ./...
          '
      - name: Diff hygiene
        run: git diff --check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe Dependency Graph capability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          if curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$endpoint" >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is unavailable for this repository; dependency-review is UNAVAILABLE, not PASS. Enable Dependency Graph in repository security settings to activate this blocking gate."
            echo "### Dependency review" >> "$GITHUB_STEP_SUMMARY"
            echo "UNAVAILABLE: GitHub Dependency Graph is disabled or unsupported for this repository." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
