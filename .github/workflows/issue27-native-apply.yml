name: issue27-native-apply

on:
  push:
    branches: [agent/issue-27-native-slice]
    paths: [.github/workflows/issue27-native-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-27-native-slice
          fetch-depth: 0
      - name: Guard branch
        run: test "$GITHUB_REF_NAME" = "agent/issue-27-native-slice"
      - name: Apply exact-state native mutation patch
        run: python3 scripts/issue27_native_patch.py
      - name: Format and test durable native mutations
        run: |
          gofmt -w backend/internal/domain/idempotency_ports.go backend/internal/providers/tools/idempotency.go backend/internal/providers/tools/native.go backend/internal/providers/tools/native_test.go backend/internal/store/idempotency_run.go backend/internal/store/idempotent_domain.go
          cd backend
          go test ./internal/idempotency ./internal/store ./internal/providers/tools
          go test -race ./internal/idempotency ./internal/store ./internal/providers/tools
          cd ..
          git diff --check
      - name: Commit and remove one-shot helpers
        run: |
          git config user.name "Diệp Gia Huy"
          git config user.email "30974088+diepgiahuy@users.noreply.github.com"
          git rm .github/workflows/issue27-native-apply.yml scripts/issue27_native_patch.py
          git add backend/internal/domain backend/internal/providers/tools backend/internal/store
          git diff --cached --check
          git commit -m "feat: route native mutations through durable idempotency"
          git push origin HEAD:agent/issue-27-native-slice
