name: Apply issue-15 legacy code cleanup

on:
  push:
    branches: [issue-15-single-path-v2]
    paths:
      - scripts/apply_issue15_legacy_code_cleanup.py
      - .github/workflows/apply_issue15_legacy_code_cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-15-single-path-v2
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+diepgiahuy@users.noreply.github.com"
          python3 scripts/apply_issue15_legacy_code_cleanup.py
          gofmt -w backend/internal/server/server_test.go backend/internal/adkbridge/host_tools_test.go
          git diff --check
          git add backend/internal/server/server_test.go backend/internal/adkbridge/host_tools_test.go
          git commit -m "test: retire legacy Qwen parity scaffolding"
          git push origin HEAD:issue-15-single-path-v2
