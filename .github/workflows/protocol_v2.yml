name: Protocol v2 contract

on:
  pull_request:
    paths:
      - "backend/internal/protocol/**"
      - "backend/internal/server/**"
      - "components/companion_app/**"
      - "components/esp32_network/**"
      - "host/**"
      - "testdata/protocol/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "partitions.csv"
      - "main/**"
      - "Dockerfile.esp-idf"
      - ".github/workflows/protocol_v2.yml"
  push:
    branches: [main]
    paths:
      - "backend/internal/protocol/**"
      - "backend/internal/server/**"
      - "components/companion_app/**"
      - "components/esp32_network/**"
      - "host/**"
      - "testdata/protocol/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - "partitions.csv"
      - "main/**"
      - "Dockerfile.esp-idf"
      - ".github/workflows/protocol_v2.yml"
  workflow_dispatch:

concurrency:
  group: protocol-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  esp32s3-compile:
    name: ESP32-S3 protocol v2 compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ESP-IDF compiler cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .ccache
          key: esp-idf-v6.0.2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            esp-idf-v6.0.2-${{ runner.os }}-

      - name: Build firmware with pinned ESP-IDF image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ccache
          docker run --rm \
            -v "$PWD:/project" \
            -v "$PWD/.ccache:/ccache" \
            -w /project \
            -e HOME=/tmp \
            -e IDF_GIT_SAFE_DIR=/project \
            -e IDF_CCACHE_ENABLE=1 \
            -e CCACHE_DIR=/ccache \
            espressif/idf:v6.0.2 \
            bash -lc 'idf.py set-target esp32s3 && idf.py --ccache build && idf.py size && ccache --show-stats'
