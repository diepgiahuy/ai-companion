name: Protocol v2 contract

on:
  pull_request:
    paths:
      - "backend/internal/protocol/**"
      - "backend/internal/server/**"
      - "components/companion_app/**"
      - "components/esp32_network/**"
      - "host/**"
      - "testdata/protocol/**"
      - "Dockerfile.esp-idf"
      - ".github/workflows/protocol_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32s3-compile:
    name: ESP32-S3 protocol v2 compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build firmware with pinned ESP-IDF image
        run: docker build --file Dockerfile.esp-idf --tag companion-protocol-v2 .
