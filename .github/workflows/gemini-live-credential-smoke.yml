name: gemini-live-credential-smoke

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/gemini-live-credential-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-live-credential:
    name: Gemini Live credential smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install pinned WebSocket client
        run: python3 -m pip install --disable-pip-version-check --no-input 'websockets==17.0.1'

      - name: Verify Gemini Live authentication and setup
        env:
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
        run: |
          python3 - <<'PY'
          import asyncio
          import json
          import os
          import sys
          from urllib.parse import quote

          import websockets

          token = os.environ.get('GEMINI_TOKEN', '').strip()
          if not token:
              print('GEMINI LIVE SMOKE FAIL: GEMINI_TOKEN is unavailable to this workflow', file=sys.stderr)
              raise SystemExit(2)

          model = 'gemini-3.1-flash-live-preview'
          endpoint = (
              'wss://generativelanguage.googleapis.com/ws/'
              'google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent'
              '?key=' + quote(token, safe='')
          )
          setup = {
              'setup': {
                  'model': f'models/{model}',
                  'generationConfig': {'responseModalities': ['AUDIO']},
              }
          }

          async def smoke():
              try:
                  async with websockets.connect(
                      endpoint,
                      open_timeout=15,
                      close_timeout=5,
                      max_size=1 << 20,
                  ) as ws:
                      await ws.send(json.dumps(setup))
                      raw = await asyncio.wait_for(ws.recv(), timeout=15)
                      message = json.loads(raw)
                      if 'setupComplete' not in message:
                          print(
                              'GEMINI LIVE SMOKE FAIL: authenticated socket did not return setupComplete',
                              file=sys.stderr,
                          )
                          raise SystemExit(3)
                      print(f'GEMINI LIVE SMOKE PASS: model={model} setupComplete=true')
              except SystemExit:
                  raise
              except Exception as exc:
                  status = None
                  response = getattr(exc, 'response', None)
                  if response is not None:
                      status = getattr(response, 'status_code', None)
                  suffix = f' http_status={status}' if status is not None else ''
                  print(
                      f'GEMINI LIVE SMOKE FAIL: {type(exc).__name__}{suffix}',
                      file=sys.stderr,
                  )
                  raise SystemExit(4)

          asyncio.run(smoke())
          PY
