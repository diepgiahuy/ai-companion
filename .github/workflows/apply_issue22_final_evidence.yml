name: Apply issue-22 final evidence

on:
  push:
    branches:
      - issue-22-evidence-ladder
    paths:
      - scripts/apply_issue22_final_evidence.py
      - .github/workflows/apply_issue22_final_evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue-22 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-22-evidence-ladder
          fetch-depth: 0
      - name: Register final Tier-1 and Wokwi checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/apply_issue22_final_evidence.py
          python3 scripts/check_evidence.py
          rm scripts/apply_issue22_final_evidence.py
          git add -A
          git diff --cached --check
          git commit -m "docs(evidence): register issue-22 final checkpoints"
          git push origin HEAD:issue-22-evidence-ladder
